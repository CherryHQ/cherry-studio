appId: com.kangfenmao.CherryStudio
productName: Cherry Studio
extraMetadata:
  cherryEdition: global
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
  - ja # macOS/linux/win
  - ru # macOS/linux/win
  - zh_CN # for macOS
  - zh_TW # for macOS
  - en # for macOS
  - de
directories:
  buildResources: build

protocols:
  - name: Cherry Studio
    schemes:
      - cherrystudio
files:
  - "**/*"
  - "!**/{.vscode,.yarn,.yarn-lock,.github,.cursorrules,.prettierrc}"
  - "!electron.vite.config.{js,ts,mjs,cjs}}"
  - "!electron-builder.cn.config.cjs"
  - "!electron.vite.entries.config.ts"
  - "!.*"
  - "!components.json"
  - "!**/{.eslintignore,.eslintrc.js,.eslintrc.json,.eslintcache,root.eslint.config.js,eslint.config.js,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,eslint.config.mjs,dev-app-update.yml,CHANGELOG.md,README.md,.oxfmtrc.json}"
  - "!**/{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!**/{tsconfig.json,tsconfig.tsbuildinfo,tsconfig.node.json,tsconfig.web.json}"
  - "!**/{.editorconfig,.jekyll-metadata}"
  - "!src"
  - "!native"
  - "!config"
  - "!patches"
  - "!**/node_modules/**/*.cpp"
  - "!**/node_modules/node-addon-api/**"
  - "!**/node_modules/prebuild-install/**"
  - "!scripts"
  - "!local"
  - "!docs"
  - "!packages"
  - "!.swc"
  - "!.bin"
  - "!._*"
  - "!*.log"
  - "!stats.html"
  - "!*.md"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!**/*.{map,ts,tsx,jsx,less,scss,sass,css.d.ts,d.cts,d.mts,md,markdown,yaml,yml}"
  - "!**/{test,tests,__tests__,powered-test,coverage}/**"
  - "!**/{example,examples}/**"
  - "!**/*.{spec,test}.{js,jsx,ts,tsx}"
  - "!**/*.min.*.map"
  - "!**/*.d.ts"
  - "!**/dist/es6/**"
  - "!**/dist/demo/**"
  - "!**/amd/**"
  - "!**/{.DS_Store,Thumbs.db,thumbs.db,__pycache__}"
  - "!**/{LICENSE,license,LICENSE.*,*.LICENSE.txt,NOTICE.txt,README.md,readme.md,CHANGELOG.md}"
  - "!node_modules/rollup-plugin-visualizer"
  - "!node_modules/js-tiktoken"
  - "!node_modules/@tavily/core/node_modules/js-tiktoken"
  - "!node_modules/pdf-parse/lib/pdf.js/{v1.9.426,v1.10.88,v2.0.550}"
  - "!node_modules/mammoth/{mammoth.browser.js,mammoth.browser.min.js}"
  - "!**/node_modules/better-sqlite3/{bin,deps,src}/**"
  - "!**/node_modules/better-sqlite3/build/{Debug,Release/obj}/**"
  - "!**/node_modules/{selection-hook,@earendil-works/pi-coding-agent}/docs/**"
  # node-gyp-build prefers build/Release over prebuilds/, so ship the prebuilds and drop the
  # host-arch rebuild — a cross-built arm64 package would otherwise load the x86-64 binary (#20530).
  - "!node_modules/selection-hook/build/**"
  - "!node_modules/selection-hook/node_modules" # we don't need what in the node_modules dir
  - "!node_modules/selection-hook/src" # we don't need source files
  - "!**/node_modules/node-pty/build/**" # ship upstream prebuilds; the rebuilt binary needs GLIBC_2.34 and is never cross-compiled
  - "!node_modules/tesseract.js-core/{tesseract-core.js,tesseract-core.wasm,tesseract-core.wasm.js}" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core-lstm.js,tesseract-core-lstm.wasm,tesseract-core-lstm.wasm.js}" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core-simd-lstm.js,tesseract-core-simd-lstm.wasm,tesseract-core-simd-lstm.wasm.js}" # we don't need source files
  - "!node_modules/onnxruntime-web/**" # transformers.js's browser/WASM backend; local inference always runs onnxruntime-node instead
  - "!node_modules/@huggingface/transformers/node_modules/onnxruntime-web/**" # same package, nested copy
  - "!node_modules/onnxruntime-node/bin/**" # native binary is downloaded on first use (Toolchain/onnxruntime), never bundled — see OnnxRuntimeBinaryService
  - "!**/*.{h,iobj,ipdb,tlog,recipe,vcxproj,vcxproj.filters,Makefile,*.Makefile}" # filter .node build files
  - "resources/**/*" # include all files in resources, and unpack them from asar for runtime access
  - "!resources/devtools/**" # dev-only extensions are loaded from source in development
  - "node_modules/@deepseek-ai/dsh-sandbox-windows-acl/assets/**"
  - "resources/devtools/main-network/**" # Main Network panel (Developer Mode)
asarUnpack:
  - resources/**
  - "!resources/devtools/**"
  - "resources/devtools/main-network/**"
  - "**/*.{metal,exp,lib}"
  - "node_modules/@img/sharp-*/**"
  # DSH runs under bundled Bun: bundle its JS and unpack native/runtime files.
  - "node_modules/@cherrystudio/dsh-bridge/dist/runtime/**"
  - "node_modules/sharp/**"
  - "node_modules/@img/colour/**"
  - "node_modules/detect-libc/**"
  - "node_modules/semver/**"
  - "node_modules/node-pty/**"
  - "node_modules/koffi/**"
  - "node_modules/@koromix/koffi-*/**"
  - "node_modules/@deepseek-ai/dsh-sandbox-windows-acl/**"
  - "node_modules/@deepseek-ai/dsh-win32-process/**"
  - "node_modules/@deepseek-ai/dsh-lazy-require/**"
  - "node_modules/@deepseek-ai/dsh-subprocess/**"
  - "node_modules/@deepseek-ai/dsh-skill/**"
  - "node_modules/@deepseek-ai/dsh-scope/**"
  - "node_modules/@deepseek-ai/dsh-util-values/**"
  - "node_modules/@deepseek-ai/cordis/**"
  - "node_modules/@deepseek-ai/cosmokit/**"
  - "node_modules/@deepseek-ai/schemastery/**"
  - "node_modules/yaml/**"
  - "node_modules/@deepseek-ai/node-addon-system*/**"
  - "node_modules/@anthropic-ai/claude-agent-sdk-*/**" # native CLI binary must live on disk to be spawned
  - "node_modules/@silvia-odwyer/photon-node/**" # pi SDK WASM dep: photon_rs.js does fs.readFileSync(__dirname/photon_rs_bg.wasm)
  - "node_modules/@aiany/sqlite-vec-*/**" # sqlite-vec extension (.dylib/.so/.dll) is dlopen'd at runtime — must live on disk
  - "node_modules/@node-rs/xxhash-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/@firecrawl/anydoc-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/node-screenshots-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/node-mac-permissions/**" # native N-API binary must be unpacked for runtime loading
extraResources:
  - from: "migrations/sqlite-drizzle"
    to: "migrations/sqlite-drizzle"
  - from: "packages/provider-registry/data"
    to: "provider-registry"
win:
  executableName: Cherry Studio
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  extraResources:
    - from: "node_modules/@aiany/sqlite-vec-windows-${arch}/vec0.dll"
      to: "app.asar.unpacked/node_modules/@aiany/sqlite-vec-windows-${arch}/vec0.dll"
  target:
    - target: nsis
    - target: portable
  signtoolOptions:
    sign: scripts/packaging/win-sign.js
  signExts:
    - .node
  verifyUpdateCodeSignature: false
nsis:
  # Preserve the existing global installer identity so either edition replaces the same Windows installation.
  guid: 41a4ccd8-bcc0-5710-9eee-0e164da68057
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  allowToChangeInstallationDirectory: true
  oneClick: false
  include: build/nsis-installer.nsh
  buildUniversalInstaller: false
  differentialPackage: true
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
  buildUniversalInstaller: false
  # electron-builder 26.15.6 uses true for a unique $PLUGINSDIR on every launch.
  unpackDirName: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  target:
    - target: dmg
    - target: zip
dmg:
  writeUpdateInfo: false
toolsets:
  appimage: "1.0.3"
linux:
  artifactName: ${productName}-${version}-${arch}.${ext}
  executableName: CherryStudio
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  maintainer: electronjs.org
  category: Utility
  desktop:
    entry:
      Name: Cherry Studio
      StartupWMClass: CherryStudio
  mimeTypes:
    - x-scheme-handler/cherrystudio
rpm:
  # Workaround for electron build issue on rpm package:
  # https://github.com/electron/forge/issues/3594
  fpm: ["--rpm-rpmbuild-define=_build_id_links none"]
publish:
  provider: generic
  url: https://releases.cherry-ai.com
  useMultipleRangeRequest: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
beforePack: scripts/packaging/before-pack.js
afterPack: scripts/packaging/after-pack.js
afterSign: scripts/packaging/notarize.js
artifactBuildCompleted: scripts/packaging/artifact-build-completed.js
releaseInfo:
  releaseNotes: |
    <!--LANG:en-->
    Cherry Studio 2.1.5 - Remote Attachments, Channels, and Major Improvements

    ✨ New Features
    - [Remote Access] Upload images and files to remote Agent sessions from your paired mobile device, with resumable transfers up to 1 GiB per file.
    - [Channels] Add WeCom and DingTalk channels with QR setup, Agent conversations, streaming replies, notifications, and attachments.
    - [MCP] Support MCP SDK v2 with interactive requests, validated forms, cancellation, and structured results across chat and agent runtimes.
    - [Agent] Upgrade Pi runtime to 1.0 with native sandboxed Code Mode and MCP support. Action required: update custom Pi scripts to the native codemode API.
    - [Doctor] System Doctor gains an AI analysis section that reads diagnostic reports and proposes bounded fixes you can apply and undo.
    - [Device Connections] Improve mobile onboarding with platform-specific downloads, remembered progress, and automatic mobile previews.
    - [Paintings] Minimize the prompt dock after generate, zoom generated images with the mouse wheel, and open the shared image viewer on click.
    - [Models] Add Claude Haiku 5.5 support with reasoning controls, updated token limits, pricing, and Claude Code availability.
    - [Composer] Highlight the MCP toolbar shortcut when MCP tools are enabled for the current chat or agent session.
    - [Web Search] Add self-hosted Crawl4AI as a URL-fetch provider with configurable API Host and optional bearer token.
    - [Windows] Use native caption buttons in main and detached windows while preserving custom title bars and theme adaptation.
    - [Updates] Enable native differential downloads to reduce update size when a compatible cached installer is available.
    - [File Preview] Improve document previews with touch zoom, resilient PowerPoint slides, and clearer size-limit fallbacks. Add WebView compatibility for mobile integration.
    - [Archive] Restoring an agent now also restores its sessions, and archived task/topic rows show their owning agent or assistant.

    🐛 Bug Fixes
    - [Agent] Fix browser tool timeouts when switching sessions or closing tabs during an active task.
    - [Agent] Fix tool-denial reasons being mistaken for tool output — now explicitly attributed as the user's words.
    - [Chat] Fix mid-response failures discarding already-streamed content — now preserved alongside the error.
    - [Chat] Fix context compression progress not appearing inside the assistant message.
    - [Chat] Fix horizontal multi-model answers blocking upward scroll to earlier chat history.
    - [ComfyUI] Fix workflows with randomize seed rendering the same image every run.
    - [ComfyUI] Fix partner (API) nodes failing without the provider's API key — now sent correctly.
    - [ComfyUI] Fix workflows being converted with wrong values or failing with no_prompt_node.
    - [Notifications] Fix completion notifications to show the topic or session name and the final sentence.
    - [Notifications] Clear the macOS Dock badge when all notification preferences are turned off.
    - [Markdown] Stop linkifying single-segment slash runs (like `/jX_s`) as file paths.
    - [WebView] Limit native user agent to Google sign-in, preserving cleaned UA for AI Studio and other requests.
    - [Open Responses] Fix conversations failing when compatible gateways emit marked SSE keep-alive deltas.
    - [Backup] Fix local backups failing when the destination is a Windows drive root.
    - [Channels] Fix Channels settings rendering errors caused by malformed user IDs in saved WeChat credentials.
    - [Tools] Fix custom command-line tools named constructor or toString being misclassified as built-in Code CLIs.

    <!--LANG:zh-CN-->
    Cherry Studio 2.1.5 - 远程附件、消息通道与重要改进

    ✨ 新功能
    - [远程访问] 从已配对的移动端向远程 Agent 会话上传图片和文件，支持可恢复传输，单文件最大 1 GiB。
    - [消息通道] 新增企业微信和钉钉通道，支持二维码设置、Agent 对话、流式回复、通知和附件。
    - [MCP] 支持 MCP SDK v2，支持交互式请求、表单验证、取消和结构化结果，适用于对话和智能体运行时。
    - [智能体] 升级 Pi 运行时到 1.0，支持原生沙箱化代码模式和 MCP。需要操作：更新自定义 Pi 脚本到原生 codemode API。
    - [诊断] 系统诊断新增 AI 分析区域，读取诊断报告并提出可应用和撤销的有界修复建议。
    - [设备连接] 改进移动端引导流程，支持平台特定下载、记忆进度和自动移动端预览。
    - [绘图画廊] 生成后自动收起提示词面板，支持鼠标滚轮缩放图片，点击打开共享图片查看器。
    - [模型] 新增 Claude Haiku 5.5 支持，包含推理控制、更新的 token 限制、定价和 Claude Code 可用性。
    - [编辑器] 当 MCP 工具对当前对话或智能体会话启用时，高亮显示 MCP 工具栏快捷方式。
    - [网页搜索] 新增自托管 Crawl4AI 作为 URL 获取供应商，支持配置 API Host 和可选的 bearer 令牌。
    - [Windows] 在主窗口和分离窗口中使用原生标题栏按钮，同时保留自定义标题栏和主题适配。
    - [更新] 启用原生差量下载，在有兼容的缓存安装包时减少更新大小。
    - [文件预览] 改进文档预览，支持触控缩放、PowerPoint 幻灯片弹性和更清晰的大小限制回退。新增 WebView 兼容性以支持移动端集成。
    - [回收站] 恢复智能体时同时恢复其会话，已归档的任务/主题行显示所属智能体或助手。

    🐛 问题修复
    - [智能体] 修复在活跃任务期间切换会话或关闭标签页导致浏览器工具超时的问题。
    - [智能体] 修复工具拒绝原因被误认为工具输出的问题 — 现在明确归属为用户的意见。
    - [对话] 修复响应中途失败时丢失已流式内容的问题 — 现在内容与错误一并保留。
    - [对话] 修复上下文压缩进度未显示在助手消息内的问题。
    - [对话] 修复水平多模型回答阻止向上滚动到较早对话历史的问题。
    - [ComfyUI] 修复随机种子的重复生成相同图像的问题。
    - [ComfyUI] 修复合作伙伴 (API) 节点因缺少供应商 API 密钥而失败的问题 — 现在正确发送。
    - [ComfyUI] 修复工作流被转换时值错误或 no_prompt_node 失败的问题。
    - [通知] 修复完成通知显示对话名称和最后一句的问题。
    - [通知] 当所有通知偏好关闭时清除 macOS Dock 徽章。
    - [Markdown] 停止将单段斜杠运行（如 `/jX_s`）识别为文件路径。
    - [网页视图] 将原生 User Agent 仅限于 Google 登录，为 AI Studio 和其他请求保留清理后的 UA。
    - [Open Responses] 修复兼容网关发送标记的 SSE keep-alive 增量时对话失败的问题。
    - [备份] 修复备份目标为 Windows 驱动器根目录时失败的问题。
    - [通道] 修复保存的企业微信凭据中格式错误的用户 ID 导致通道设置渲染错误的问题。
    - [工具] 修复名为 constructor 或 toString 的自定义命令行工具被错误分类为内置 Code CLI 的问题。
    <!--LANG:END-->
