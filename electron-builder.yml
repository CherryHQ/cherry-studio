appId: com.kangfenmao.CherryStudio
productName: Cherry Studio
extraMetadata:
  cherryEdition: global
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
  - ja # macOS/linux/win
  - ru # macOS/linux/win
  - zh_CN # for macOS
  - zh_TW # for macOS
  - en # for macOS
  - de
directories:
  buildResources: build

protocols:
  - name: Cherry Studio
    schemes:
      - cherrystudio
files:
  - "**/*"
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**" # ClaudeCodeBinaryService downloads the native runtime on demand
  - "!**/{.vscode,.yarn,.yarn-lock,.github,.cursorrules,.prettierrc}"
  - "!electron.vite.config.{js,ts,mjs,cjs}}"
  - "!electron-builder.*.config.cjs"
  - "!release-bundle.json"
  - "!electron.vite.entries.config.ts"
  - "!.*"
  - "!components.json"
  - "!**/{.eslintignore,.eslintrc.js,.eslintrc.json,.eslintcache,root.eslint.config.js,eslint.config.js,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,eslint.config.mjs,dev-app-update.yml,CHANGELOG.md,README.md,.oxfmtrc.json}"
  - "!**/{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!**/{tsconfig.json,tsconfig.tsbuildinfo,tsconfig.node.json,tsconfig.web.json}"
  - "!**/{.editorconfig,.jekyll-metadata}"
  - "!src"
  - "!native"
  - "!config"
  - "!patches"
  - "!**/node_modules/**/*.cpp"
  - "!**/node_modules/node-addon-api/**"
  - "!**/node_modules/prebuild-install/**"
  - "!scripts"
  - "!local"
  - "!docs"
  - "!packages"
  - "!.swc"
  - "!.bin"
  - "!._*"
  - "!*.log"
  - "!stats.html"
  - "!*.md"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!**/*.{map,ts,tsx,jsx,less,scss,sass,css.d.ts,d.cts,d.mts,md,markdown,yaml,yml}"
  - "!**/{test,tests,__tests__,powered-test,coverage}/**"
  - "!**/{example,examples}/**"
  - "!**/*.{spec,test}.{js,jsx,ts,tsx}"
  - "!**/*.min.*.map"
  - "!**/*.d.ts"
  - "!**/dist/es6/**"
  - "!**/dist/demo/**"
  - "!**/amd/**"
  - "!**/{.DS_Store,Thumbs.db,thumbs.db,__pycache__}"
  - "!**/{LICENSE,license,LICENSE.*,*.LICENSE.txt,NOTICE.txt,README.md,readme.md,CHANGELOG.md}"
  - "!node_modules/mammoth/{mammoth.browser.js,mammoth.browser.min.js}"
  - "!**/node_modules/better-sqlite3/{bin,build,deps,src}/**"
  - "!**/node_modules/{selection-hook,@earendil-works/pi-coding-agent}/docs/**"
  # node-gyp-build prefers build/Release over prebuilds/, so ship the prebuilds and drop the
  # host-arch rebuild — a cross-built arm64 package would otherwise load the x86-64 binary (#20530).
  - "!node_modules/selection-hook/build/**"
  - "!node_modules/selection-hook/node_modules" # we don't need what in the node_modules dir
  - "!node_modules/selection-hook/src" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core.js,tesseract-core.wasm,tesseract-core.wasm.js}" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core-lstm.js,tesseract-core-lstm.wasm,tesseract-core-lstm.wasm.js}" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core-simd.js,tesseract-core-simd.wasm,tesseract-core-simd.wasm.js}" # tesseract.js loads tesseract-core-simd-lstm (default LSTM_ONLY OEM on SIMD)
  - "!**/node_modules/tesseract.js-core/tesseract-core-simd-lstm.wasm.js"
  - "!node_modules/onnxruntime-web/**" # transformers.js's browser/WASM backend; local inference always runs onnxruntime-node instead
  - "!node_modules/@huggingface/transformers/node_modules/onnxruntime-web/**" # same package, nested copy
  - "!node_modules/onnxruntime-node/bin/**" # native binary is downloaded on first use (Toolchain/onnxruntime), never bundled — see OnnxRuntimeBinaryService
  - "!node_modules/sherpa-onnx-{darwin,linux,win}-*/**" # binaries are downloaded on first use; only the JS wrapper ships
  - "!**/*.{h,iobj,ipdb,tlog,recipe,vcxproj,vcxproj.filters,Makefile,*.Makefile}" # filter .node build files
  - "resources/**/*" # include all files in resources, and unpack them from asar for runtime access
  - "!resources/devtools/**" # dev-only extensions are loaded from source in development
asarUnpack:
  - resources/**
  - "!resources/devtools/**"
  - "**/*.{metal,exp,lib}"
  - "node_modules/@cursor/sdk-*/**" # Cursor locates platform executables by package path.
  - "node_modules/@img/sharp-*/**"
  - "node_modules/sharp/**"
  - "node_modules/@img/colour/**"
  - "node_modules/detect-libc/**"
  - "node_modules/semver/**"
  - "node_modules/node-pty/**"
  - "node_modules/koffi/**"
  - "node_modules/@microsoft/mxc-sdk/**"
  - "node_modules/@koromix/koffi-*/**"
  - "node_modules/yaml/**"
  - "node_modules/@silvia-odwyer/photon-node/**" # pi SDK WASM dep: photon_rs.js does fs.readFileSync(__dirname/photon_rs_bg.wasm)
  - "node_modules/@aiany/sqlite-vec-*/**" # sqlite-vec extension (.dylib/.so/.dll) is dlopen'd at runtime — must live on disk
  - "node_modules/@node-rs/xxhash-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/@firecrawl/anydoc-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/node-screenshots-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/node-mac-permissions/**" # native N-API binary must be unpacked for runtime loading
extraResources:
  - from: "out/pi-acp"
    to: "pi-acp"
  - from: "packages/ui/licenses"
    to: "licenses/ui"
  - from: "src/main/ai/voice/localAdapters/NOTICE.txt"
    to: "voice-audio/NOTICE.txt"
  - from: "migrations/sqlite-drizzle"
    to: "migrations/sqlite-drizzle"
  - from: "packages/provider-registry/data"
    to: "provider-registry"
  - from: "node_modules/pdfjs-dist/cmaps"
    to: "pdfjs/cmaps"
  - from: "node_modules/pdfjs-dist/standard_fonts"
    to: "pdfjs/standard_fonts"
win:
  executableName: Cherry Studio
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  extraResources:
    # before-pack adds system-speech only for x64; extraResources .exe files use signtoolOptions below.
    - from: "node_modules/@aiany/sqlite-vec-windows-${arch}/vec0.dll"
      to: "app.asar.unpacked/node_modules/@aiany/sqlite-vec-windows-${arch}/vec0.dll"
  target:
    - target: nsis
    - target: portable
  signtoolOptions:
    sign: scripts/packaging/win-sign.js
    signingHashAlgorithms: [sha256]
  signExts:
    - .node
  verifyUpdateCodeSignature: false
nsis:
  # Preserve the existing global installer identity so either edition replaces the same Windows installation.
  guid: 41a4ccd8-bcc0-5710-9eee-0e164da68057
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  allowToChangeInstallationDirectory: true
  oneClick: false
  include: build/nsis-installer.nsh
  buildUniversalInstaller: false
  differentialPackage: true
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
  buildUniversalInstaller: false
  # electron-builder 26.15.6 uses true for a unique $PLUGINSDIR on every launch.
  unpackDirName: true
mac:
  extraFiles:
    - from: native/system-speech/dist/native/darwin-${arch}/cherry-system-speech
      to: Helpers/cherry-system-speech
  entitlementsInherit: build/entitlements.mac.plist
  sign: scripts/packaging/mac-sign.js
  notarize: false
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSSpeechRecognitionUsageDescription: Cherry Studio transcribes voice recordings on this device.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    NSCalendarsUsageDescription: Cherry Studio allows local MCP servers to read and manage your calendar events.
    NSCalendarsFullAccessUsageDescription: Cherry Studio allows local MCP servers to read and manage your calendar events.
    NSCalendarsWriteOnlyAccessUsageDescription: Cherry Studio allows local MCP servers to create calendar events.
    NSRemindersUsageDescription: Cherry Studio allows local MCP servers to read and manage your reminders.
    NSRemindersFullAccessUsageDescription: Cherry Studio allows local MCP servers to read and manage your reminders.
    NSAppleEventsUsageDescription: Cherry Studio allows local MCP servers to control other applications using AppleScript.
  target:
    - target: dmg
    - target: zip
dmg:
  format: ULFO
  writeUpdateInfo: false
  # PNGs are rendered from build/dmg-background.svg; Finder's title bar hides the bottom 32px.
  background: build/dmg-background.png
  window:
    width: 600
    height: 380
  iconSize: 128
  contents:
    - x: 150
      y: 154
      type: file
    - x: 450
      y: 154
      type: link
      path: /Applications
toolsets:
  appimage: "1.0.3"
linux:
  artifactName: ${productName}-${version}-${arch}.${ext}
  executableName: CherryStudio
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  maintainer: electronjs.org
  category: Utility
  desktop:
    entry:
      Name: Cherry Studio
      StartupWMClass: CherryStudio
  mimeTypes:
    - x-scheme-handler/cherrystudio
rpm:
  # Workaround for electron build issue on rpm package:
  # https://github.com/electron/forge/issues/3594
  fpm: ["--rpm-rpmbuild-define=_build_id_links none"]
publish:
  provider: generic
  url: https://releases.cherry-ai.com
  useMultipleRangeRequest: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
beforePack: scripts/packaging/before-pack.js
afterPack: scripts/packaging/after-pack.js
afterSign: scripts/packaging/notarize.js
artifactBuildCompleted: scripts/packaging/artifact-build-completed.js
releaseInfo:
  releaseNotes: |
    <!--LANG:en-->
    Cherry Studio 2.2.5 - Local Agents, History Import, and the Unified Gateway

    ✨ New Features
    - [Agent] Agent Services (Beta): install, configure, and chat with local Claude Code, Codex, and ACP-compatible agents, with native model selection, permissions, session controls, usage reporting, and local dictation. Message editing and conversation forking are disabled where a local runtime cannot support them.
    - [Agent] Import local Claude Code, Codex, and OpenCode conversation histories into an existing Pi Agent from Data Settings.
    - [Agent] New Cherry Assistant and Cherry Support agents default to Pi Durable with Auto permissions.
    - [Agent] Create an Agent or Assistant from a single sentence: describe a purpose, pick a model, and Auto create sets the name, avatar, System Prompt, and matching knowledge bases, MCP servers, skills, or web search. Manual create walks through identity, built-in tools, MCP servers, reply language, heartbeat, environment variables, and IM channels (WeChat, Feishu, WeCom, DingTalk, QQ, Telegram, Discord, Slack), ending on a summary page that shows what was configured, with buttons to adjust settings or start a conversation, and WeChat or Feishu QR login can be completed there.
    - [Agent] Agents can create new Agents and Assistants and change their own settings from a conversation, each after your approval, shown as a card that opens the result. On Pi Durable Agents, every part of the System Prompt can be edited, AI-optimized, and restored, including the persona and memory files.
    - [Agent] Click the Assistant or Agent avatar to open a profile pane with usage, recent topics, scheduled tasks, suggested next steps and "Try asking" opening questions, quick settings that change in place, and an Outputs tab collecting pages, media, and files the Agent delivered or images the Assistant generated across sessions.
    - [Agent] The Agent and Assistant edit dialogs are reorganized into a main page and "More settings" sub-pages, including per-Agent channels and scheduled tasks; plan/small model and quick-prompt bindings are removed.
    - [Agent] Pi Durable queued messages appear only in the queue panel—where you can view, edit, reorder, withdraw, and steer them into the running turn—until the agent takes them. Stopping a reply pauses the queue and resuming continues it in order, even after restart, and model failures no longer leave a reply running or drop queued messages.
    - [Agent] Pi Durable resumes a turn after a broken model stream or a temporary network outage, and restores pending approvals, questions, and queued replies after restart.
    - [Agent] A System Prompt preview shows the full prompt the Pi Durable runtime sends, with only the Agent's own instructions editable and an approximate token count.
    - [MCP] Claude Code and Pi can discover remote skills and load verified instructions and current attachments on demand, with each skill's reading permission set in MCP Server settings. App-only MCP tools are hidden from the model, and MCP Apps open from tool results with their connection origins shown.
    - [Chat] Quote selected text with a configurable shortcut, jump back to quoted messages, and save a reply to selected text as a draft; right-click a rendered formula to copy its LaTeX.
    - [Chat] Home chat history shows where the recent-messages limit cuts off.
    - [Chat] Collapsed reasoning shows a one-line preview with an expand/collapse chevron, and with auto-collapse enabled reasoning starts collapsed while streaming.
    - [Chat] When a third-party provider runs out of quota, the input suggests topping up, switching providers, or subscribing to Cherry AI.
    - [Models] Reasoning and tool continuity are preserved when switching between compatible model routes, while history the new endpoint cannot reuse is left out.
    - [Models] Added CherryIN Claude Fable 5.2 with its 1M context window, 128K output, and xhigh reasoning, Gemini 4 Neon, and Seedream 5.5 image generation; synced the Tencent Cloud TokenHub catalog; added the missing DashScope Qwen Image and Z-Image models; enabled AiHubMix native search for Gemini 4 and Vertex native search for Gemini 4 Hydrogen and Carbon; and restored reasoning controls for SWE-2, Flint, Beam, Fugu, and Namazu custom-provider models.
    - [OCR] Added PaddleOCR VL-1.5, VL-1.6, and VL models to image OCR; VL images are parsed as documents for better formula recognition.
    - [Paintings] You can add an image from a URL.
    - [Files] Copy a file's absolute path from the Files list or image grid, right-click the open preview for the same menu as the list, and view Mermaid diagrams at full size with sharp rendering in the preview window.
    - [Desktop] Native scroll bounce on macOS in the main window and detached tabs.
    - [Quick Panel] `/` search ranks exact and prefix command or skill name matches ahead of description-only matches.
    - [Code Viewer] Fold nested JSON objects and arrays and follow indentation guides in Trace and other code viewers.
    - [Providers] Deep-link provider import lets you edit the provider ID, choose merge or replace when the ID already exists, and shows where the API key will be sent; merge is the default and no longer overwrites an existing endpoint.
    - [Gateway] Open Unified Gateway from Launchpad, copy API URLs and Model IDs for third-party clients, and use keyless local model calls and authenticated LAN sharing, with a redesigned icon and consistent naming across entry points.
    - [Cherry AI] Without signing in to Cherry AI, the built-in free Qwen model now powers helper features: topic and note naming, translation and language detection, AI error diagnosis, conversation starters, prompt polish, and assistant auto-configure. Chatting with Qwen still requires signing in.
    - [Remote] Paired clients can discover the available desktop Agent models and choose one for a new remote conversation.
    - [PlantUML] PlantUML diagrams render locally without sending their source to a remote server, and a pager shows every page of multi-page diagrams. Diagrams that relied on remote includes need those definitions inlined.
    - [Selection Assistant] Save both the selected text and the generated result to Notes with one click.
    - [App] Added Korean (ko-KR) language support.

    🐛 Bug Fixes
    - [Agent] The first conversation with a new Agent no longer asks for a name or overwrites the name already set.
    - [Agent] Fixed startup and backup restore failures when upgrading older Agent sessions that contain detached messages.
    - [Agent] When the native SDK can preserve context, Claude Code conversations can edit their first message after tool retries or compaction, and Plan Only hides file mutation tools.
    - [Agent] Messages sent while a turn is running are no longer dropped when the runtime connection changes, and the local permission mode is shared across sessions.
    - [Agent] Agent replies keep intermediate text and tool calls in order during streaming and after Stop, with consistent spacing; avatars show while waiting and on every visible reply segment, and completed process groups fold after a steer.
    - [Agent] Work conversations name the Claude Code process exit and its diagnostic reference in the error card instead of a generic error, and non-Anthropic endpoints now surface upstream JSON error reasons.
    - [Agent] Subagents follow root permissions and reliably show approval requests with their task origin and complete commands; nested tools, including calls from code-mode scripts, use the same approval policy.
    - [Agent] Pi and Pi Durable Agents show Knowledge Search and Manage Knowledge once a knowledge base is bound, and turning Knowledge Search off also disables document listing and reading.
    - [Agent] Fixed re-importing local Skills already in the library and loading enabled Skills whose folder names contain spaces or leading dots; safe Unicode characters in skill folder names are preserved.
    - [Agent] Fixed the missing cause when a System Prompt could not be assembled and when Pi Durable fails to initialize, instead of suggesting a network interruption.
    - [Agent] The built-in Assistant asks for approval before submitting feedback through wrapped, nested, `gh api`, inline-interpreter, or PowerShell commands, and Cherry Support asks before every PowerShell command.
    - [Agent] Text-layer PDFs that the parser rejects as malformed are now converted, and scanned PDFs use the default document processor. DeepSeek history imports keep conversations when an attachment is missing and warn about the missing file.
    - [Agent] Scheduled tasks no longer misinterpret interval durations ("1d" no longer runs every minute), unsupported formats are rejected, and reused sessions are compacted and recover after overflow.
    - [Agent] Single-message "Export as Markdown (with reasoning)" no longer omits reasoning in Work mode, and assistant reply edits save when you are signed out or out of quota.
    - [Agent] Opening older conversations with very large tool results after upgrading loads less data, and long conversations keep their loaded messages as new turns arrive.
    - [Agent] The WeChat and Feishu login QR code shows in chat when a Pi Durable Agent sets up its channel.
    - [Agent] Claude Read results show image previews in chat, and an Agent conversation opens at the correct scroll position; an uploaded Assistant avatar shows in the header, greeting, and tab.
    - [Agent] RTK exit code 3 (Ask verdict) rewrites now require user approval instead of being applied automatically.
    - [Agent] Claude Code tool guards now cover Windows PowerShell calls and MultiEdit, and Claude Code can use the CLI already downloaded by Cherry Studio when no standalone CLI is found.
    - [Chat] Stopping a message translation clears the loading placeholder and keeps any text already saved, and the translation page stops rendering when no output is pending.
    - [Chat] Unified Gateway conversations preserve thought signatures on whitespace-only assistant text, and chats with signed history no longer fail when switching models or connections.
    - [Chat] Anthropic-compatible providers no longer reject tool requests whose tool root schema is a non-object, untyped, `$ref`, or combinator schema, Gemini requests no longer fail when an MCP tool declares an unsupported enum or const, and non-portable regex patterns in MCP tool schemas are stripped before sending.
    - [Chat] Continuing a conversation whose earlier assistant replies contained blank text blocks no longer errors, and follow-up requests no longer fail after history is trimmed or compacted.
    - [Chat] "Retry all" on a grouped answer retries each failed model with that reply's model instead of the model currently selected in the composer.
    - [Chat] Responses API requests no longer fail when an assistant uses a legacy custom reasoning effort parameter, and legacy custom Anthropic tool choices serialize correctly.
    - [Chat] Fixed image generation with providers that return an image URL: images served from the provider endpoint are downloaded with the provider credential, Gemini-compatible relays that return image URLs download correctly, and New API Google image requests route to generateContent.
    - [Chat] Requests no longer send conflicting output-token fields, and a provider that rejects the requested output-token budget is retried with a lower limit.
    - [Chat] Context size is estimated from the outgoing request, avoiding inflated estimates and early compression after server-side tool use.
    - [Chat] A failed Agent turn that carries a runtime detail now shows that detail instead of a misleading "check your network" interruption message.
    - [Chat] The message navigation rail is no longer hidden behind the input box, the Ask Question composer shows an emphasized Next button when options are selected, and tooltips stay closed after a menu restores focus.
    - [Markdown] Equation numbers no longer overlap display formulas, code blocks no longer draw operator ligatures, and wide formulas scroll horizontally in side-by-side replies.
    - [Notes] Pasted images stay visible after reopening notes when the image path contains spaces or Markdown punctuation.
    - [Files] File renames no longer submit twice when focus moves after Enter, and cancelled edits stay cancelled.
    - [Files] Inline HTML previews no longer jump in height when CSS decoration overflows the content, and extremely wide or tall SVG previews no longer render blank.
    - [Files] Fixed XLSX preview totals and chart points when worksheet references differ in capitalization, and cells that depend on an unavailable formula now show the formula instead of a misleading number.
    - [Files] Fixed document conversion failures when a server returns a ZIP result with a mixed-case or parameterized Content-Type header.
    - [Files] Fixed removal of missing PDF originals from the file library while retaining translation history and translated PDFs.
    - [Files] The built-in filesystem tool deletes a symlink itself instead of the directory or file it points to.
    - [Files] Remote-access attachments are cleared when a remote session disconnects without sending, and authenticated remote sessions are reaped after a sixty-second receive idle.
    - [Preview] Offline PlantUML previews honor diagram background colors and built-in icons, no longer hang after switching views when a diagram references unbundled standard-library includes, and multi-page diagrams show every page.
    - [Preview] Mermaid previews ignore obsolete worker replies when the diagram or rendering options change, and Graphviz previews use theme-aware defaults and render braces in quoted graph names and leading comments.
    - [Skills] External skill exports now default to off on upgrade without a saved setting.
    - [MCP] Connected servers that do not implement resource template discovery no longer show a false start-failure dialog, servers whose probe gets no response fall back to the legacy handshake, and the built-in memory server no longer loses entities after a failed save or overwrites a corrupted file.
    - [Backup] Restore failures are shown readably in a dialog, and the S3 restore picker shows its empty message in the app language.
    - [Errors] Request-body buffer limit and "payload is too large" rejections get request-size guidance, timeouts are no longer reported as provider HTTP errors, oMLX prefill memory rejections suggest shortening the conversation or a smaller model, low credit balance rejections are recognized, and AI error diagnosis runs on demand with your default model.
    - [Errors] Quota refusals returned with 429 are no longer prefixed with the rate-limit hint, and a Work conversation identifies a missing model provider with help choosing a replacement.
    - [Errors] Windows Work conversations and MCP launches no longer fail when a captured environment variable contains NUL bytes.
    - [Usage] Request entries no longer show 0 rows when sorted by cost, filtering by clicking chart data points is restored, and an open dashboard includes the new day after midnight.
    - [Conversations] Dropping a topic onto its own group header keeps it in place.
    - [Code CLI] Code CLI launches on Linux by detecting common terminal emulators instead of failing with `spawn xterm ENOENT`, and keeps local CLI availability when version lookup is offline with a detection retry instead of a misleading installation action.
    - [Quick Assistant] A dedicated drag area above chat messages keeps the window movable without interfering with text selection.
    - [Gateway] Statusless context-window overflow errors map to HTTP 400 instead of HTTP 500, so retries no longer storm and Agent runtimes can trigger compaction.
    - [Providers] The provider list filter supports keyboard navigation and announces the active filter to screen readers.

    💄 Improvements
    - [UI] Conversation history and management views are full-width with immediate selection highlights, improved resource dialogs, and a refined Unified Gateway icon.
    - [Agent] Completed Agent tool histories collapse by default with a step count, and very large histories no longer mount tens of thousands of DOM nodes on open.
    - [Agent] The avatar picker shows upload, random, and emoji in one panel and lets you crop an uploaded image.
    - [Agent] An Agent's reply language is a single dropdown with an "Other language…" option, and heartbeat settings are grouped in one card.
    - [Agent] Built-in Agents show a fixed, system-managed skill list.
    - [Agent] The remaining-messages context is shown as a clear "Last N messages" or "Follow global" choice when editing an Assistant or Agent.
    - [Chat] When a quick action prefills the composer over text you already typed, you can replace the draft or keep it, with a "Don't ask again" option.
    - [Conversations] Conversation rows no longer show a one-click Archive action; Archive remains in the context menu and can be undone from the toast, and rows stay interactive when item dragging is unavailable.
    - [Feedback] Problem reports omit chat history by default; select the option to include the last 24 hours of the affected conversation.
    - [Privacy] Updated desktop privacy policy disclosures and consent version. (action required: review the updated privacy policy if data collection is enabled.)
    - [Models] The model service list filter explains what its tabs group by, and the model selector can pin or unpin the CherryAI group.
    - [UI] Fixed tooltip and sidebar selection flicker, opened Mini Apps directly from Launchpad, and made Mini App and CodeMate icons consistent, including Codex dark mode.
    - [Files] File type icons are consistent across the Files library, composer, and message attachments.
    - [Diagnostics] A new Doctor check reports unreadable provider registry files and whether the built-in or downloaded catalog is in use.
    - [Settings] Settings search tolerates accents, case, and full-width characters, and composers focus their input when you switch conversations or tabs.
    - [Desktop] The main window starts at 90% of the work area (capped at 1440 × 900), while a saved window size still takes precedence.

    ⚡ Performance
    - [Agent] Long Agent conversations update individual streaming parts and load a completed reply without reloading unrelated history pages; a reply stays readable if its first history read fails.
    - [Agent] Oversized tool outputs no longer stall history loading, and completed tool details load on demand while streaming stays responsive.
    - [Chat] Code-heavy conversations do less layout work, and the composer stays stable when switching between sending and pausing.
    - [Files] Native file-watcher cleanup is faster and no longer blocks workspace cleanup.

    <!--LANG:zh-CN-->
    Cherry Studio 2.2.5 - 本地智能体、历史导入与统一网关

    ✨ 新功能
    - [智能体] 智能体服务（Beta）：可安装、配置并与本地 Claude Code、Codex 和 ACP 兼容智能体对话，支持原生模型选择、权限、会话控制、用量统计和本地听写；本地运行时不支持的消息编辑和会话分叉会被禁用。
    - [智能体] 可在「数据设置」中把本地 Claude Code、Codex 和 OpenCode 的对话历史导入已有的 Pi 智能体。
    - [智能体] 新建的 Cherry 小助手和 Cherry Support 默认使用 Pi Durable 和自动权限。
