appId: com.kangfenmao.CherryStudio
productName: Cherry Studio
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
  - ja # macOS/linux/win
  - ru # macOS/linux/win
  - zh_CN # for macOS
  - zh_TW # for macOS
  - en # for macOS
  - de
directories:
  buildResources: build

protocols:
  - name: Cherry Studio
    schemes:
      - cherrystudio
files:
  - "**/*"
  - "!**/{.vscode,.yarn,.yarn-lock,.github,.cursorrules,.prettierrc}"
  - "!electron.vite.config.{js,ts,mjs,cjs}}"
  - "!.*"
  - "!components.json"
  - "!**/{.eslintignore,.eslintrc.js,.eslintrc.json,.eslintcache,root.eslint.config.js,eslint.config.js,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,eslint.config.mjs,dev-app-update.yml,CHANGELOG.md,README.md,biome.jsonc}"
  - "!**/{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!**/{tsconfig.json,tsconfig.tsbuildinfo,tsconfig.node.json,tsconfig.web.json}"
  - "!**/{.editorconfig,.jekyll-metadata}"
  - "!src"
  - "!config"
  - "!patches"
  - "!**/node_modules/**/*.cpp"
  - "!**/node_modules/node-addon-api/**"
  - "!**/node_modules/prebuild-install/**"
  - "!scripts"
  - "!local"
  - "!docs"
  - "!packages"
  - "!.swc"
  - "!.bin"
  - "!._*"
  - "!*.log"
  - "!stats.html"
  - "!*.md"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!**/*.{map,ts,tsx,jsx,less,scss,sass,css.d.ts,d.cts,d.mts,md,markdown,yaml,yml}"
  - "!**/{test,tests,__tests__,powered-test,coverage}/**"
  - "!**/{example,examples}/**"
  - "!**/*.{spec,test}.{js,jsx,ts,tsx}"
  - "!**/*.min.*.map"
  - "!**/*.d.ts"
  - "!**/dist/es6/**"
  - "!**/dist/demo/**"
  - "!**/amd/**"
  - "!**/{.DS_Store,Thumbs.db,thumbs.db,__pycache__}"
  - "!**/{LICENSE,license,LICENSE.*,*.LICENSE.txt,NOTICE.txt,README.md,readme.md,CHANGELOG.md}"
  - "!node_modules/rollup-plugin-visualizer"
  - "!node_modules/js-tiktoken"
  - "!node_modules/@tavily/core/node_modules/js-tiktoken"
  - "!node_modules/pdf-parse/lib/pdf.js/{v1.9.426,v1.10.88,v2.0.550}"
  - "!node_modules/mammoth/{mammoth.browser.js,mammoth.browser.min.js}"
  - "!node_modules/selection-hook/prebuilds/**/*" # we rebuild .node, don't use prebuilds
  - "!node_modules/selection-hook/node_modules" # we don't need what in the node_modules dir
  - "!node_modules/selection-hook/src" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core.js,tesseract-core.wasm,tesseract-core.wasm.js}" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core-lstm.js,tesseract-core-lstm.wasm,tesseract-core-lstm.wasm.js}" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core-simd-lstm.js,tesseract-core-simd-lstm.wasm,tesseract-core-simd-lstm.wasm.js}" # we don't need source files
  - "!node_modules/onnxruntime-web/**" # transformers.js's browser/WASM backend; local inference always runs onnxruntime-node instead
  - "!node_modules/@huggingface/transformers/node_modules/onnxruntime-web/**" # same package, nested copy
  - "!node_modules/onnxruntime-node/bin/**" # native binary is downloaded on first use (Toolchain/onnxruntime), never bundled — see OnnxRuntimeBinaryService
  - "!**/*.{h,iobj,ipdb,tlog,recipe,vcxproj,vcxproj.filters,Makefile,*.Makefile}" # filter .node build files
  - "resources/**/*" # include all files in resources, and unpack them from asar for runtime access
  - "!resources/devtools/**" # dev-only extensions are loaded from source in development
asarUnpack:
  - resources/**
  - "!resources/devtools/**"
  - "**/*.{metal,exp,lib}"
  - "node_modules/@img/sharp-*/**"
  - "node_modules/@anthropic-ai/claude-agent-sdk-*/**" # native CLI binary must live on disk to be spawned
  - "node_modules/@silvia-odwyer/photon-node/**" # pi SDK WASM dep: photon_rs.js does fs.readFileSync(__dirname/photon_rs_bg.wasm)
  # beforePack adds the complete DSH subprocess dependency closure here.
  - "node_modules/@aiany/sqlite-vec-*/**" # sqlite-vec extension (.dylib/.so/.dll) is dlopen'd at runtime — must live on disk
  - "node_modules/@node-rs/xxhash-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/@firecrawl/anydoc-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/node-screenshots-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/node-mac-permissions/**" # native N-API binary must be unpacked for runtime loading
extraResources:
  - from: "migrations/sqlite-drizzle"
    to: "migrations/sqlite-drizzle"
  - from: "packages/provider-registry/data"
    to: "provider-registry"
win:
  executableName: Cherry Studio
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  extraResources:
    - from: "node_modules/@aiany/sqlite-vec-windows-${arch}/vec0.dll"
      to: "app.asar.unpacked/node_modules/@aiany/sqlite-vec-windows-${arch}/vec0.dll"
  target:
    - target: nsis
    - target: portable
  signtoolOptions:
    sign: scripts/win-sign.js
  verifyUpdateCodeSignature: false
nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  allowToChangeInstallationDirectory: true
  oneClick: false
  include: build/nsis-installer.nsh
  buildUniversalInstaller: false
  differentialPackage: false
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
  buildUniversalInstaller: false
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  target:
    - target: dmg
    - target: zip
dmg:
  writeUpdateInfo: false
linux:
  artifactName: ${productName}-${version}-${arch}.${ext}
  executableName: CherryStudio
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  maintainer: electronjs.org
  category: Utility
  desktop:
    entry:
      Name: Cherry Studio
      StartupWMClass: CherryStudio
  mimeTypes:
    - x-scheme-handler/cherrystudio
rpm:
  # Workaround for electron build issue on rpm package:
  # https://github.com/electron/forge/issues/3594
  fpm: ["--rpm-rpmbuild-define=_build_id_links none"]
publish:
  provider: generic
  url: https://releases.cherry-ai.com
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
beforePack: scripts/before-pack.js
afterPack: scripts/after-pack.js
afterSign: scripts/notarize.js
artifactBuildCompleted: scripts/artifact-build-completed.js
releaseInfo:
  releaseNotes: |
    <!--LANG:en-->
    Cherry Studio 2.0.7 - New Features, Fixes, and Performance

    ✨ New Features
    - [xlsx-preview] Preview .xlsx spreadsheets directly in the artifact preview pane: multi-sheet tabs, cell styles and merged cells, floating images and charts, formula results, click-to-expand cell content, and photographic zoom.
    - [MCP] Add built-in QVeris Hosted MCP integration with API key setup guidance.
    - [Help] Added a localized Help & Feedback menu with the in-app update feature list and history, documentation and repository shortcuts, anonymous diagnostic upload, Cherry Support feedback, and GitHub Issues
    - [Agent] Agents no longer stop at a maximum turn count — a long autonomous run continues until it finishes or is interrupted. To keep a hard cap, set CLAUDE_CODE_MAX_TURNS in the agent's environment variables
    - [Agent] Fast (Pi) agents gain an "Approve for Me" permission mode and new ones start in it — the agent works on its own and asks when it recognizes a risky action. "Full Access" on a Fast (Pi) agent is now unconditional. The agent create dialog now picks the runtime with flat cards, and the edit dialog shows the (unchangeable) runtime
    - [Agent] Add DeepSeek Harness (dsh) as a third agent runtime for agent sessions, with tool approvals, host-bridged MCP and Cherry built-in tools, skills, context-usage reporting, auto-compaction, /compact and /goal commands, provider retry status, and OpenTelemetry tracing
    - [Code Mate] Code Mate can now install and run DeepSeek Harness with Cherry providers or the Unified Gateway, with managed settings, Web UI access, and a Launchpad shortcut
    - [Chat] Composer shortcuts for send, line break, and steer are now configurable in Settings → Chat → Input. While an Agent is running, the new steer shortcut (⌘Enter on macOS, Ctrl+Enter elsewhere) sends your message straight into the current turn instead of queueing it. Shift+Enter still inserts a line break. On Windows and Linux the send shortcut drops the Win/Super+Enter option that the OS reserved and that never worked

    🐛 Bug Fixes
    - [i18n] Translate previously untranslated Agent, DeepSeek Harness, and spreadsheet preview text across supported locales.
    - [Shortcuts] Caps Lock can now be bound as a shortcut key.
    - [Skills] Fixed online Skill installation hanging indefinitely or failing to reach GitHub: the clone step is now bounded by a timeout, never waits on a credential prompt, and follows the proxy configured in Cherry Studio.
    - [Providers] Fix providers using the native OpenAI adapter (official OpenAI, Codex, TokenHub, DMXAPI, and any provider on an `openai-responses` endpoint) failing to start with `Failed to create provider "openai"`.
    - [Agent] Fix usage and cost attribution for dsh agent sessions routed through the local API Gateway: provider requests now carry the session usage headers, so usage records attach to the owning agent message and reuse a stable per-session prompt cache key.
    - [Code Mate] Fixed Code Mate installation of DeepSeek Harness when mise upgrades Node at the same time.
    - [Composer] Fixed the composer input collapsing to two lines after switching topics/agents, hiding part of a saved draft.
    - [DSH] Fix DeepSeek Harness agents failing to start in packaged builds when subprocess dependencies were left inside app.asar.
    - [Backup] Delayed overdue automatic backups briefly after startup so they no longer interrupt messages immediately after launch.
    - [Models] Restored the SiliconFlow referral link used by the Get API Key action.
    - [Web Search] Fixed an issue where importing an MCP server from ModelScope could leave settings unresponsive when the Web Search API key dialog was open.
    - [Chat] Starting a branch from the latest assistant message now creates a real two-way branch instead of a linear empty continuation.
    - [Models] Fix custom OpenAI-compatible providers incorrectly displaying metadata from a same-family model with a different parameter size
    - [Models] Fix MiniMax-M3 requests failing because the app requested more than the provider's supported output-token limit
    - [Models] Fix provider model rows shifting in Settings when a model group is collapsed or expanded
    - [Chat] Fix chat messages, prompt previews, and translations rendering single line breaks as spaces — in-paragraph newlines now display as actual line breaks, matching AI output conventions
    - [Chat] Fix a v2.0.5 regression where attaching an image to a model without declared vision support failed the turn with an error — the image is sent to the provider again, so models behind gateways or proxies that accept images work as before
    - [Chat] Generated images from Agent tool calls are now displayed directly in the conversation instead of being hidden in collapsed tool history
    - [Chat] Fix the first keystroke being lost when focusing the chat/agent composer input
    - [Chat] Fix composer input history so the first Arrow Up press recalls the previous entry and places the caret at the end of the recalled text
    - [Chat] Fix clipboard files being attached twice when pasting into the chat composer before its rich editor finished loading
    - [Chat] Fix the composer caret remaining in an all-selected state after clearing the entire input
    - [Agent] Fix agent skills picked from the composer being reported as missing on the first call when the skill's display name differs from its directory name
    - [Agent] Fix @ file references in Agent chat only finding files within the first three levels of the working directory — files in more deeply nested subdirectories are now searchable
    - [Agent] Fix deleting an agent's only remaining non-active session causing that agent to disappear from the list — a replacement session is silently created for it
    - [Agent] Fix deleting an active agent task creating a stray empty task — it now correctly selects the neighbouring task within the same agent
    - [Agent] Fix a crash where deleting an agent's last session (then the auto-created replacement) could white-screen the window
    - [Topics] Fix deleting the last conversation in the "Unlinked assistant" group leaving the group behind — a new unlinked conversation is now auto-created
    - [Topics] Topics that carried no name in v1 now show the app's localized default conversation name after migrating to v2, instead of always being labelled "Unnamed Topic" in English
    - [Settings] Settings → Usage now remembers your last selected time window, grouping, metric, chart type, rollup, top-N, heatmap metric, currency, and table sorting when you leave and return to the page
    - [Paintings] Fix the painting template carousel refreshing and reordering when returning to an open tab
    - [Tabs] Fix "Back to main window" in a detached (sub-)window doing nothing when the main window was closed — the main window is now automatically rebuilt with the tab restored
    - [Tabs] Fix quickly dragging a tab out of the tab bar sometimes removing the tab without opening a detached window — the detached window now always appears after a drag
    - [Artifacts] HTML artifact popups and interactive preview approvals now remain available when their source message scrolls out of the virtualized message list
    - [UI] Fix action popovers remaining open after selecting external apps, file actions, or HTML capture destinations
    - [Window] Fix the selection assistant toolbar being hidden behind other always-on-top windows on Windows
    - [Knowledge Base] Fix conversations saved directly to a knowledge base losing their formatting — fenced code blocks now keep their fence and language tag, and the stray divider between the conversation title and the first message is gone
    - [Knowledge Base] Fix a knowledge base conversation getting permanently stuck on "TypeError: Cannot read properties of undefined (reading 'length')" — an unreadable stored kb tool result is now skipped with a note instead of failing every later turn
    - [Knowledge Base] Restore 0.01 similarity-threshold precision for knowledge base retrieval
    - [Knowledge Base] Fix bulk reindex missing items that were being processed when the reindex was triggered
    - [Local Models] Fix the local embedding model getting stuck in a loop between "ready" and "model files incomplete", which re-downloaded the ~600MB weights every time the Local Models page was reopened
    - [Shortcuts] Fix F13–F24 not being accepted by the shortcut recorder
    - [MCP/Security] Fix MCP server environment variable values (e.g. GITHUB_PERSONAL_ACCESS_TOKEN) and builtin MCP server secrets being written in plaintext to app logs — log output is now redacted. If you used MCP servers with secret env vars before, consider rotating those credentials and clearing old logs
    - [MCP/Security] Fix secrets included in MCP server log notifications reaching the app debug log and the MCP server logs page unredacted — log notification messages are now redacted

    ⚡ Performance
    - [Models] Improve model management performance when adding or removing all models, preventing the drawer from becoming unresponsive.
    - [Export] Exporting long topics to Notion now prepares messages concurrently, noticeably reducing the wait before the upload starts. Output content and ordering are unchanged
    - [Translate] Selection translation now disables model reasoning during LLM language detection when supported, reducing latency and avoiding empty detection output
    - [AI] One-shot AI utility requests (topic/note auto-naming, error classification, prompt polish, export titles, and the model health-check probe) now disable model reasoning when supported, reducing latency and token usage

    <!--LANG:zh-CN-->
    Cherry Studio 2.0.7 - 新功能、修复与性能优化

    ✨ 新功能
    - [xlsx-preview] 在 artifact 预览面板中直接预览 .xlsx 电子表格：多工作表标签、单元格样式和合并单元格、浮动图片和图表、公式结果、点击展开单元格内容、以及摄影式缩放。
    - [MCP] 新增内置 QVeris Hosted MCP 集成，并提供 API 密钥设置指引。
    - [帮助] 新增本地化的"帮助与反馈"菜单，包含应用内更新功能列表与历史、文档与仓库快捷入口、匿名诊断上传、Cherry Support 反馈和 GitHub Issues
    - [Agent] Agent 不再受最大回合数限制 —— 长时间自主运行会持续到完成或被打断。如需硬性上限，可在 Agent 环境变量中设置 CLAUDE_CODE_MAX_TURNS
    - [Agent] 快速（Pi）Agent 新增"自动批准"权限模式，且新创建的 Agent 默认使用该模式 —— Agent 自主工作，识别到风险操作时才询问。快速（Pi）Agent 的"完全访问"现在为无条件开启。新建 Agent 对话改用扁平卡片选择运行时，编辑对话框会显示（不可更改的）运行时
    - [Agent] 新增 DeepSeek Harness（dsh）作为第三个 Agent 会话运行时，支持工具审批、由宿主桥接的 MCP 与 Cherry 内置工具、技能、上下文用量上报、自动压缩、/compact 和 /goal 命令、服务商重试状态和 OpenTelemetry 追踪
    - [Code Mate] Code Mate 现在可以使用 Cherry 服务商或统一网关安装并运行 DeepSeek Harness，提供托管设置、Web UI 访问和启动台快捷方式
    - [对话] 发送、换行和干预快捷键现在可在"设置 → 对话 → 输入"中自定义。Agent 运行时，新的干预快捷键（macOS 为 ⌘Enter，其他系统为 Ctrl+Enter）会将消息直接发送到当前回合，而不是排队。Shift+Enter 仍用于插入换行。Windows 和 Linux 上发送快捷键移除了被系统保留且从未生效的 Win/Super+Enter 选项

    🐛 问题修复
    - [i18n] 翻译了之前未翻译的 Agent、DeepSeek Harness 和电子表格预览文本，覆盖所有支持的语言。
    - [快捷键] 大写锁定键现在可以用作快捷键。
    - [技能] 修复在线技能安装无限挂起或无法连接 GitHub 的问题：克隆步骤现在有超时限制，不会等待凭据提示，并遵循 Cherry Studio 中配置的代理。
    - [服务商] 修复使用原生 OpenAI 适配器的服务商（官方 OpenAI、Codex、TokenHub、DMXAPI 以及任何使用 `openai-responses` 端点的服务商）启动失败并显示 `Failed to create provider "openai"` 的问题。
    - [Agent] 修复通过本地 API Gateway 路由的 dsh agent 会话的用量和费用归属问题：提供商请求现在携带会话用量头部，因此用量记录会关联到所属 agent 消息并复用稳定的每会话提示缓存键。
    - [Code Mate] 修复当 mise 同时升级 Node 时 Code Mate 安装 DeepSeek Harness 失败的问题。
    - [对话框] 修复切换话题/Agent 后对话框输入框折叠为两行、隐藏部分已保存草稿的问题。
    - [DSH] 修复 DeepSeek Harness agent 在打包版本中因子进程依赖被留在 app.asar 内而无法启动的问题。
    - [备份] 延迟启动后立即执行的过期自动备份，使其不再在启动后立即打断消息发送。
    - [模型] 恢复 SiliconFlow 的"获取 API 密钥"操作中使用的推荐链接。
    - [网页搜索] 修复从 ModelScope 导入 MCP 服务器时，如果网页搜索 API 密钥对话框已打开，可能导致设置页面无响应的问题。
    - [对话] 从最新助手消息创建分支时，现在会创建真正的双向分支，而不是线性的空延续。
    - [模型] 修复自定义 OpenAI 兼容服务商在同族模型存在不同参数尺寸时错误显示其他模型元数据的问题
    - [模型] 修复 MiniMax-M3 因应用请求超过服务商支持的输出 token 上限而请求失败的问题
    - [模型] 修复设置中模型分组展开/折叠时模型行位置错动的问题
    - [对话] 修复对话消息、提示词预览和翻译中单换行被渲染为空格的问题 —— 段落内换行现在会显示为真实换行，符合 AI 输出惯例
    - [对话] 修复 v2.0.5 引入的回归：向未声明支持视觉的模型附加图片会因读不到文本而失败 —— 图片现在会再次发送给服务商，让网关或代理背后实际支持图片的模型恢复正常
    - [对话框] Agent 工具调用生成的图片现在直接显示在对话中，而不再被折叠在工具历史里
    - [对话框] 修复聚焦对话/Agent 输入框时首次按键丢失的问题
    - [对话框] 修复输入框历史记录首次按上方向键无法召回上一条、且光标未定位到末尾的问题
    - [对话框] 修复在富文本编辑器加载完成前粘贴时剪贴板文件被重复附加的问题
    - [对话框] 修复清空输入后光标仍处于全选状态的问题
    - [Agent] 修复从输入框选择的 Agent 技能在技能显示名与目录名不一致时首次调用报缺失的问题
    - [Agent] 修复 Agent 对话中 @ 文件引用只能找到工作区前三级目录文件的问题 —— 更深层嵌套子目录中的文件现在可被搜索
    - [Agent] 修复删除 Agent 唯一非活动会话导致该 Agent 从列表消失的问题 —— 现在会为其静默创建替换会话
    - [Agent] 修复删除正在进行的 Agent 任务会创建多余空任务的问题 —— 现在会正确切换到同一 Agent 内的相邻任务
    - [Agent] 修复删除 Agent 最后一个会话（以及自动创建的替换会话）可能导致窗口白屏崩溃的问题
    - [话题] 修复删除"未关联助手"分组中最后一个对话后该分组仍残留的问题 —— 现在会自动创建新的未关联对话
    - [话题] v1 中未命名的话题在迁移到 v2 后现在会显示应用本地化的默认对话名，而不再被一律标记为英文的"Unnamed Topic"
    - [设置] 设置 → 用量现在会在你离开并返回页面时记住上次选择的时间范围、分组、指标、图表类型、汇总、Top N、热力图指标、货币和表格排序
    - [绘画] 修复返回已打开标签页时绘画模板轮播刷新并重新排序的问题
    - [标签页] 修复在分离（子）窗口中"返回主窗口"在主窗口已关闭时无反应的问题 —— 主窗口现在会自动重建并恢复该标签页
    - [标签页] 修复快速将标签页拖出标签栏时有时会移除标签页但不打开分离窗口的问题 —— 现在拖拽后总会出现分离窗口
    - [Artifact] HTML artifact 弹窗和交互式预览审批现在在其源消息滚动出虚拟化消息列表后仍保持可用
    - [界面] 修复选择外部应用、文件操作或 HTML 抓取目标后操作浮层仍保持打开的问题
    - [窗口] 修复 Windows 上划词助手工具栏被其他置顶窗口遮挡的问题
    - [知识库] 修复直接将对话保存到知识库时格式丢失的问题 —— 代码块围栏现在会保留围栏和语言标签，对话标题与首条消息之间多余的分割线也已移除
