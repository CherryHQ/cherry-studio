appId: com.kangfenmao.CherryStudio
productName: Cherry Studio
extraMetadata:
  cherryEdition: global
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
  - ja # macOS/linux/win
  - ru # macOS/linux/win
  - zh_CN # for macOS
  - zh_TW # for macOS
  - en # for macOS
  - de
directories:
  buildResources: build

protocols:
  - name: Cherry Studio
    schemes:
      - cherrystudio
files:
  - "**/*"
  - "!**/{.vscode,.yarn,.yarn-lock,.github,.cursorrules,.prettierrc}"
  - "!electron.vite.config.{js,ts,mjs,cjs}}"
  - "!electron-builder.cn.config.cjs"
  - "!electron.vite.entries.config.ts"
  - "!.*"
  - "!components.json"
  - "!**/{.eslintignore,.eslintrc.js,.eslintrc.json,.eslintcache,root.eslint.config.js,eslint.config.js,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,eslint.config.mjs,dev-app-update.yml,CHANGELOG.md,README.md,.oxfmtrc.json}"
  - "!**/{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!**/{tsconfig.json,tsconfig.tsbuildinfo,tsconfig.node.json,tsconfig.web.json}"
  - "!**/{.editorconfig,.jekyll-metadata}"
  - "!src"
  - "!config"
  - "!patches"
  - "!**/node_modules/**/*.cpp"
  - "!**/node_modules/node-addon-api/**"
  - "!**/node_modules/prebuild-install/**"
  - "!scripts"
  - "!local"
  - "!docs"
  - "!packages"
  - "!.swc"
  - "!.bin"
  - "!._*"
  - "!*.log"
  - "!stats.html"
  - "!*.md"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!**/*.{map,ts,tsx,jsx,less,scss,sass,css.d.ts,d.cts,d.mts,md,markdown,yaml,yml}"
  - "!**/{test,tests,__tests__,powered-test,coverage}/**"
  - "!**/{example,examples}/**"
  - "!**/*.{spec,test}.{js,jsx,ts,tsx}"
  - "!**/*.min.*.map"
  - "!**/*.d.ts"
  - "!**/dist/es6/**"
  - "!**/dist/demo/**"
  - "!**/amd/**"
  - "!**/{.DS_Store,Thumbs.db,thumbs.db,__pycache__}"
  - "!**/{LICENSE,license,LICENSE.*,*.LICENSE.txt,NOTICE.txt,README.md,readme.md,CHANGELOG.md}"
  - "!node_modules/rollup-plugin-visualizer"
  - "!node_modules/js-tiktoken"
  - "!node_modules/@tavily/core/node_modules/js-tiktoken"
  - "!node_modules/pdf-parse/lib/pdf.js/{v1.9.426,v1.10.88,v2.0.550}"
  - "!node_modules/mammoth/{mammoth.browser.js,mammoth.browser.min.js}"
  # node-gyp-build prefers build/Release over prebuilds/, so ship the prebuilds and drop the
  # host-arch rebuild — a cross-built arm64 package would otherwise load the x86-64 binary (#20530).
  - "!node_modules/selection-hook/build/**"
  - "!node_modules/selection-hook/node_modules" # we don't need what in the node_modules dir
  - "!node_modules/selection-hook/src" # we don't need source files
  - "!**/node_modules/node-pty/build/**" # ship upstream prebuilds; the rebuilt binary needs GLIBC_2.34 and is never cross-compiled
  - "!node_modules/tesseract.js-core/{tesseract-core.js,tesseract-core.wasm,tesseract-core.wasm.js}" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core-lstm.js,tesseract-core-lstm.wasm,tesseract-core-lstm.wasm.js}" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core-simd-lstm.js,tesseract-core-simd-lstm.wasm,tesseract-core-simd-lstm.wasm.js}" # we don't need source files
  - "!node_modules/onnxruntime-web/**" # transformers.js's browser/WASM backend; local inference always runs onnxruntime-node instead
  - "!node_modules/@huggingface/transformers/node_modules/onnxruntime-web/**" # same package, nested copy
  - "!node_modules/onnxruntime-node/bin/**" # native binary is downloaded on first use (Toolchain/onnxruntime), never bundled — see OnnxRuntimeBinaryService
  - "!**/*.{h,iobj,ipdb,tlog,recipe,vcxproj,vcxproj.filters,Makefile,*.Makefile}" # filter .node build files
  - "resources/**/*" # include all files in resources, and unpack them from asar for runtime access
  - "!resources/devtools/**" # dev-only extensions are loaded from source in development
asarUnpack:
  - resources/**
  - "!resources/devtools/**"
  - "**/*.{metal,exp,lib}"
  - "node_modules/@img/sharp-*/**"
  # DSH runs under bundled Bun: bundle its JS and unpack native/runtime files.
  - "node_modules/@cherrystudio/dsh-bridge/dist/runtime/**"
  - "node_modules/sharp/**"
  - "node_modules/@img/colour/**"
  - "node_modules/detect-libc/**"
  - "node_modules/semver/**"
  - "node_modules/node-pty/**"
  - "node_modules/koffi/**"
  - "node_modules/@koromix/koffi-*/**"
  - "node_modules/@deepseek-ai/dsh-sandbox-windows-acl/**"
  - "node_modules/@deepseek-ai/dsh-win32-process/**"
  - "node_modules/@deepseek-ai/node-addon-landlock-run*/**"
  - "node_modules/@anthropic-ai/claude-agent-sdk-*/**" # native CLI binary must live on disk to be spawned
  - "node_modules/@silvia-odwyer/photon-node/**" # pi SDK WASM dep: photon_rs.js does fs.readFileSync(__dirname/photon_rs_bg.wasm)
  - "node_modules/@aiany/sqlite-vec-*/**" # sqlite-vec extension (.dylib/.so/.dll) is dlopen'd at runtime — must live on disk
  - "node_modules/@node-rs/xxhash-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/@firecrawl/anydoc-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/node-screenshots-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/node-mac-permissions/**" # native N-API binary must be unpacked for runtime loading
extraResources:
  - from: "migrations/sqlite-drizzle"
    to: "migrations/sqlite-drizzle"
  - from: "packages/provider-registry/data"
    to: "provider-registry"
win:
  executableName: Cherry Studio
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  extraResources:
    - from: "node_modules/@aiany/sqlite-vec-windows-${arch}/vec0.dll"
      to: "app.asar.unpacked/node_modules/@aiany/sqlite-vec-windows-${arch}/vec0.dll"
  target:
    - target: nsis
    - target: portable
  signtoolOptions:
    sign: scripts/win-sign.js
  signExts:
    - .node
  verifyUpdateCodeSignature: false
nsis:
  # Preserve the existing global installer identity so either edition replaces the same Windows installation.
  guid: 41a4ccd8-bcc0-5710-9eee-0e164da68057
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  allowToChangeInstallationDirectory: true
  oneClick: false
  include: build/nsis-installer.nsh
  buildUniversalInstaller: false
  differentialPackage: false
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
  buildUniversalInstaller: false
  # electron-builder 26.15.6 uses true for a unique $PLUGINSDIR on every launch.
  unpackDirName: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  target:
    - target: dmg
    - target: zip
dmg:
  writeUpdateInfo: false
toolsets:
  appimage: "1.0.3"
linux:
  artifactName: ${productName}-${version}-${arch}.${ext}
  executableName: CherryStudio
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  maintainer: electronjs.org
  category: Utility
  desktop:
    entry:
      Name: Cherry Studio
      StartupWMClass: CherryStudio
  mimeTypes:
    - x-scheme-handler/cherrystudio
rpm:
  # Workaround for electron build issue on rpm package:
  # https://github.com/electron/forge/issues/3594
  fpm: ["--rpm-rpmbuild-define=_build_id_links none"]
publish:
  provider: generic
  url: https://releases.cherry-ai.com
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
beforePack: scripts/before-pack.js
afterPack: scripts/after-pack.js
afterSign: scripts/notarize.js
artifactBuildCompleted: scripts/artifact-build-completed.js
releaseInfo:
  releaseNotes: |
    <!--LANG:en-->
    Cherry Studio 2.1.3 - New Features, Performance, and Reliability

    ✨ New Features
    - [Remote] Device Connections: pair a compatible mobile client to import providers and use desktop Agents over an encrypted LAN connection, with reconnect recovery, execution failures, approvals and questions. Action required: legacy devices must pair again for the new identity-based protocol.
    - [Document] Support self-hosted MinerU 4 document parsing while retaining compatibility with legacy Open MinerU servers.
    - [Screenshot] Use system OCR on macOS and Windows to select and copy screenshot text without downloading a local model.
    - [Models] Add Claude Opus 5.5 to API chat with updated model limits, pricing, reasoning controls, and web-tool eligibility.
    - [Models] Add GPT-6 Sol and Luna catalog metadata, OpenAI web-search eligibility, and OpenAI Codex model entries.
    - [Models] Add Grok 4.7 to the model catalog (xAI, OpenRouter, Vercel AI Gateway, OpenCode, Copilot) with the xhigh reasoning effort; Grok CLI now lists Grok 4.6, Grok 4.7 and Grok 4.7 Fast; Grok 4.6 gains the xhigh reasoning effort.
    - [Models] Add Xiaomi MiMo V2.6 Flash, Pro and Pro-UltraSpeed to the model catalog for the MiMo, OpenRouter, Vercel AI Gateway and OpenCode providers, with the thinking on/off switch.
    - [Skills] Adds protected automatic file saving and manual remote updates for Skills installed from exact supported paths.
    - [Skills] Adds dedicated Skill detail pages, source labels, safer removal, and one-click launch into an Agent session.
    - [Settings] Add an “Agent reply language” setting (default: follow the conversation language) with preset and custom values, plus a per-agent override with an effective-language preview, so users can pin the language agents reply in.
    - [Shortcuts] On macOS, Command+W now closes the active tab instead of the window; closing the window moved to Command+Shift+W.

    🐛 Bug Fixes
    - [Settings] Restore scrolling the provider model list from outside the list and let group headings scroll with the page.
    - [Settings] English search terms now find the V2 conversation style setting.
    - [Settings] Automatically verify and enable providers after adding models, and prevent model-selection dialogs from jumping when large lists load.
    - [Proxy] Fixed local services such as DeepSeek Harness failing to connect when IPv4 or IPv6 loopback requests were routed through a proxy.
    - [Proxy] Fix model list synchronization failing behind a corporate proxy or with an intercepted TLS certificate, which previously failed even though the provider itself worked for chat.
    - [Proxy] Fix proxy bypass rules written as bare IPv6 literals (`::1`, `fe80::1`, `2001:db8::1`) never matching, and match IPv6 addresses by value so equivalent notations are recognized.
    - [Agent] Scheduled tasks can now be edited in place through the cron tool, with session-reuse controls and clearer name-conflict guidance.
    - [Agent] The bundled Cherry tool guide now describes when the notify tool is available and how scheduled tasks get their notification recipients.
    - [Agent] Fixed dsh-type Agent sessions failing on proxy-only networks by inheriting the configured proxy into the agent runtime process.
    - [Agent] Keep multi-agent requests in one reply until all work finishes, with compact subtask lists and reliable nested-task navigation.
    - [Agent] Fixed sent-message link chips and website hover previews opening separate tabs instead of using the Agent conversation's browser pane.
    - [Chat] Improve the thinking panel height, scrolling, and text readability for long reasoning content.
    - [Chat] Keep unsubmitted AskUserQuestion answers when switching conversations, so returning to a pending question resumes where the user left off.
    - [Chat] Fixed token usage not being calculated or displayed for some models after message refresh.
    - [Chat] Fixed chat messages failing to stay at the bottom after scrolling down with the mouse wheel or dragging the scrollbar.
    - [Chat] Fixed Responses continuations that sent a UUID as an input item id and were rejected because the id must begin with rs or msg.
    - [Chat] Fix migrated managed images that still point to an old data directory.
    - [Skills] Fix skill ZIP import refusing a within-limit skill because the repository archive around it exceeded the old shared ceilings; skill packs may now hold up to 20,000 files.
    - [Skills] Fixed ClawHub skill installation failing because the download size limit was undefined.
    - [Skills] Skill installs from Claude Plugins and skills.sh now download only the skill's directory instead of the whole repository, and installing a larger skill from a GitHub link no longer times out.
    - [Skills] Improve name readability in the two-column settings layout while preserving card size, and show full names and descriptions in tooltips.
    - [Skills] Fix slash-command and Skills menus while editing messages and after cancelling edits.
    - [Skills] Fixed CLI cards stuck on “Installing…” when no install was actually running; the status now reconciles against live operations instead of trusting leftover markers.
    - [Screenshot] Fixed the screenshot toolbar being partly pushed off screen when the selection is near the left edge of a display.
    - [File] Fixed workspace file trees stopping after a transient Windows file-lock watcher error.
    - [File] Preserve directory state across brief page switches without keeping the page active.
    - [AI] Fixed Gemini requests failing with unknown-field 400 errors when a tool schema contains propertyNames or additionalProperties keywords.
    - [AI] Show clear HTTP 400 request-failure messages and preserve Claude Agent SDK HTTP status codes for accurate error classification.
    - [AI] Explain HTTP 413 agent request failures and suggest reducing payload size before retrying.
    - [Windows] Fixed a Windows startup crash when application control blocks the native shutdown handler.
    - [Linux] Linux AppImages no longer require the system libfuse2 library.
    - [Mini Apps] Fix the Add mini app dialog width so installation content remains within the dialog.
    - [History] Chat and Agent history now use archive icons and labels that accurately describe their recoverable archive actions.
    - [UI] Fixed tooltip content sometimes lingering pinned to the top-left corner after clicking a file path in agent sessions.
    - [UI] Fixed tooltips lingering at the window's top-left corner after switching right-pane panels.
    - [UI] Keep message, conversation, and clear actions accessible on devices without hover support, including Windows tablets with detached keyboards.
    - [Error] Render error causes as text instead of HTML for safer display.
    - [Citations] Citation panel sources now open in the sidebar browser on left click and in a separate application tab on middle click.

    <!--LANG:zh-CN-->
    Cherry Studio 2.1.3 - 新功能、性能与可靠性提升

    ✨ 新功能
    - [远程] 设备连接：配对兼容的移动客户端以导入供应商，并通过加密的局域网通道使用桌面 Agent，支持重连恢复、执行失败、审批和问答。注意：旧设备需要重新配对以使用新的身份协议。
    - [文档] 支持自托管 MinerU 4 文档解析，同时保持与旧版 Open MinerU 服务器的兼容性。
    - [截图] 在 macOS 和 Windows 上使用系统 OCR，无需下载本地模型即可选择和复制截图中的文字。
    - [模型] 新增 Claude Opus 5.5，更新模型限制、定价、推理控制和网页工具资格。
    - [模型] 新增 GPT-6 Sol 和 Luna 目录元数据、OpenAI 网页搜索资格和 OpenAI Codex 模型条目。
    - [模型] 新增 Grok 4.7 到模型目录（xAI、OpenRouter、Vercel AI Gateway、OpenCode、Copilot），支持 xhigh 推理强度；Grok CLI 现在列出 Grok 4.6、Grok 4.7 和 Grok 4.7 Fast；Grok 4.6 新增 xhigh 推理强度。
    - [模型] 新增小米 MiMo V2.6 Flash、Pro 和 Pro-UltraSpeed 到模型目录，支持 MiMo、OpenRouter、Vercel AI Gateway 和 OpenCode 供应商，提供思考模式开关。
    - [技能] 为通过精确受支持路径安装的技能新增带冲突保护的文件自动保存和手动远程更新。
    - [技能] 新增独立技能详情页、来源标签、更安全的删除操作，以及一键进入 Agent 会话试用技能。
    - [设置] 新增”Agent 回复语言”设置（默认：跟随对话语言），支持预设值和自定义值，以及每个 Agent 的覆盖选项（使用全局/无约束/自定义）和有效语言预览，用户可以固定 Agent 回复使用的语言。
    - [快捷键] 在 macOS 上，Command+W 现在关闭当前标签页而非窗口；关闭窗口改为 Command+Shift+W。

    🐛 问题修复
    - [设置] 修复在模型列表外无法滚动供应商模型的问题，并取消模型分组标题吸顶。
    - [设置] 英文搜索词现在可以找到 V2 对话风格设置。
    - [设置] 添加模型后自动验证并启用供应商，防止大型列表加载时模型选择对话框跳动。
    - [代理] 修复 IPv4 或 IPv6 本地回环请求被代理路由时，DeepSeek Harness 等本地服务无法连接的问题。
    - [代理] 修复在企业代理或 TLS 证书被拦截的网络环境下，模型列表同步失败的问题（之前即使供应商本身可以用于聊天，同步也会失败）。
    - [代理] 修复以裸 IPv6 字面量（`::1`、`fe80::1`、`2001:db8::1`）写入的代理绕过规则无法匹配的问题，并按值匹配 IPv6 地址以识别等效表示法。
    - [智能体] 计划任务现在可以通过 cron 工具原地编辑，支持会话重用控制和更清晰的名称冲突提示。
    - [智能体] 内置 Cherry 工具指南现在描述 notify 工具何时可用以及计划任务如何获取通知接收者。
    - [智能体] 修复 dsh 类型 Agent 会话在仅代理网络上失败的问题，通过将配置的代理继承到 agent 运行时进程。
    - [智能体] 将多 Agent 请求保持在一个回复中直到所有工作完成，提供紧凑的子任务列表和可靠的嵌套任务导航。
    - [智能体] 修复发送消息链接卡片和网站悬停预览打开单独标签页而非使用 Agent 对话的浏览器窗格的问题。
    - [对话] 改进思考面板的高度、滚动和长推理内容的文本可读性。
    - [对话] 切换对话时保留未提交的 AskUserQuestion 答案，返回待处理问题时可以继续之前的状态。
    - [对话] 修复刷新消息后某些模型的 token 用量未被计算或显示的问题。
    - [对话] 修复使用鼠标滚轮或拖动滚动条向下滚动后，聊天消息无法保持在底部的问题。
    - [对话] 修复 Responses 延续发送 UUID 作为输入项 ID 被拒绝的问题（ID 必须以 rs 或 msg 开头）。
    - [对话] 修复迁移后的托管图片仍指向旧数据目录的问题。
    - [技能] 修复技能 ZIP 导入因仓库存档超过旧的共享上限而拒绝符合限制的技能的问题；技能包现在最多可包含 20,000 个文件。
    - [技能] 修复 ClawHub 技能安装因下载大小限制未定义而失败的问题。
    - [技能] 从 Claude Plugins 和 skills.sh 安装技能现在仅下载技能目录而非整个仓库，从 GitHub 链接安装较大的技能不再超时。
    - [技能] 改进双列布局中的名称可读性，同时保持卡片大小，并在工具提示中显示完整名称和描述。
    - [技能] 修复编辑消息和取消编辑后的斜杠命令和技能菜单问题。
    - [技能] 修复 CLI 卡片卡在”安装中…”状态而实际上没有安装的问题；状态现在与实际操作协调而非信任残留标记。
    - [截图] 修复选择靠近显示器左边缘时截图工具栏部分被推出屏幕的问题。
    - [文件] 修复由于短暂的 Windows 文件锁定监视器错误导致工作区文件树停止的问题。
    - [文件] 在短暂的页面切换期间保留目录状态，而无需保持页面活动。
    - [AI] 修复工具模式包含 propertyNames 或 additionalProperties 关键字时 Gemini 请求因未知字段返回 400 错误的问题。
    - [AI] 显示清晰的 HTTP 400 请求失败消息，并保留 Claude Agent SDK HTTP 状态代码以进行准确的错误分类。
    - [AI] 解释 HTTP 413 Agent 请求失败并建议重试前减少有效负载大小。
    - [Windows] 修复应用程序控制阻止本机关闭处理程序时的 Windows 启动崩溃。
    - [Linux] Linux AppImage 不再需要系统 libfuse2 库。
    - [小程序] 修复添加小程序对话框宽度，使安装内容保持在对话框内。
    - [历史] 聊天和 Agent 历史现在使用准确描述其可恢复存档操作的存档图标和标签。
    - [界面] 修复在 Agent 会话中点击文件路径后工具提示内容有时会固定在窗口左上角的问题。
    - [界面] 修复切换右侧窗格面板后工具提示在窗口左上角残留的问题。
    - [界面] 在不支持悬停的设备上（包括分离键盘的 Windows 平板电脑）保持消息、对话和清除操作可访问。
    - [错误] 将错误原因以文本而非 HTML 形式渲染，以更安全地显示。
    - [引用] 引用面板来源现在在左键单击时在侧边栏浏览器中打开，中键单击时在单独的应用程序标签页中打开。
    <!--LANG:END-->
