appId: com.kangfenmao.CherryStudio
productName: Cherry Studio
extraMetadata:
  cherryEdition: global
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
  - ja # macOS/linux/win
  - ru # macOS/linux/win
  - zh_CN # for macOS
  - zh_TW # for macOS
  - en # for macOS
  - de
directories:
  buildResources: build

protocols:
  - name: Cherry Studio
    schemes:
      - cherrystudio
files:
  - "**/*"
  - "!**/{.vscode,.yarn,.yarn-lock,.github,.cursorrules,.prettierrc}"
  - "!electron.vite.config.{js,ts,mjs,cjs}}"
  - "!electron-builder.cn.config.cjs"
  - "!electron.vite.entries.config.ts"
  - "!.*"
  - "!components.json"
  - "!**/{.eslintignore,.eslintrc.js,.eslintrc.json,.eslintcache,root.eslint.config.js,eslint.config.js,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,eslint.config.mjs,dev-app-update.yml,CHANGELOG.md,README.md,.oxfmtrc.json}"
  - "!**/{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!**/{tsconfig.json,tsconfig.tsbuildinfo,tsconfig.node.json,tsconfig.web.json}"
  - "!**/{.editorconfig,.jekyll-metadata}"
  - "!src"
  - "!config"
  - "!patches"
  - "!**/node_modules/**/*.cpp"
  - "!**/node_modules/node-addon-api/**"
  - "!**/node_modules/prebuild-install/**"
  - "!scripts"
  - "!local"
  - "!docs"
  - "!packages"
  - "!.swc"
  - "!.bin"
  - "!._*"
  - "!*.log"
  - "!stats.html"
  - "!*.md"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!**/*.{map,ts,tsx,jsx,less,scss,sass,css.d.ts,d.cts,d.mts,md,markdown,yaml,yml}"
  - "!**/{test,tests,__tests__,powered-test,coverage}/**"
  - "!**/{example,examples}/**"
  - "!**/*.{spec,test}.{js,jsx,ts,tsx}"
  - "!**/*.min.*.map"
  - "!**/*.d.ts"
  - "!**/dist/es6/**"
  - "!**/dist/demo/**"
  - "!**/amd/**"
  - "!**/{.DS_Store,Thumbs.db,thumbs.db,__pycache__}"
  - "!**/{LICENSE,license,LICENSE.*,*.LICENSE.txt,NOTICE.txt,README.md,readme.md,CHANGELOG.md}"
  - "!node_modules/rollup-plugin-visualizer"
  - "!node_modules/js-tiktoken"
  - "!node_modules/@tavily/core/node_modules/js-tiktoken"
  - "!node_modules/pdf-parse/lib/pdf.js/{v1.9.426,v1.10.88,v2.0.550}"
  - "!node_modules/mammoth/{mammoth.browser.js,mammoth.browser.min.js}"
  - "!node_modules/selection-hook/prebuilds/**/*" # we rebuild .node, don't use prebuilds
  - "!node_modules/selection-hook/node_modules" # we don't need what in the node_modules dir
  - "!node_modules/selection-hook/src" # we don't need source files
  - "!**/node_modules/node-pty/build/**" # ship upstream prebuilds; the rebuilt binary needs GLIBC_2.34 and is never cross-compiled
  - "!node_modules/tesseract.js-core/{tesseract-core.js,tesseract-core.wasm,tesseract-core.wasm.js}" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core-lstm.js,tesseract-core-lstm.wasm,tesseract-core-lstm.wasm.js}" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core-simd-lstm.js,tesseract-core-simd-lstm.wasm,tesseract-core-simd-lstm.wasm.js}" # we don't need source files
  - "!node_modules/onnxruntime-web/**" # transformers.js's browser/WASM backend; local inference always runs onnxruntime-node instead
  - "!node_modules/@huggingface/transformers/node_modules/onnxruntime-web/**" # same package, nested copy
  - "!node_modules/onnxruntime-node/bin/**" # native binary is downloaded on first use (Toolchain/onnxruntime), never bundled — see OnnxRuntimeBinaryService
  - "!**/*.{h,iobj,ipdb,tlog,recipe,vcxproj,vcxproj.filters,Makefile,*.Makefile}" # filter .node build files
  - "resources/**/*" # include all files in resources, and unpack them from asar for runtime access
  - "!resources/devtools/**" # dev-only extensions are loaded from source in development
asarUnpack:
  - resources/**
  - "!resources/devtools/**"
  - "**/*.{metal,exp,lib}"
  - "node_modules/@img/sharp-*/**"
  # DSH runs as an external Node process: bundle its JS and unpack only native/runtime files.
  - "node_modules/@cherrystudio/dsh-bridge/dist/runtime/**"
  - "node_modules/sharp/**"
  - "node_modules/@img/colour/**"
  - "node_modules/detect-libc/**"
  - "node_modules/semver/**"
  - "node_modules/node-pty/**"
  - "node_modules/koffi/**"
  - "node_modules/@koromix/koffi-*/**"
  - "node_modules/@deepseek-ai/dsh-sandbox-windows-acl/**"
  - "node_modules/@deepseek-ai/node-addon-landlock-run*/**"
  - "node_modules/@anthropic-ai/claude-agent-sdk-*/**" # native CLI binary must live on disk to be spawned
  - "node_modules/@silvia-odwyer/photon-node/**" # pi SDK WASM dep: photon_rs.js does fs.readFileSync(__dirname/photon_rs_bg.wasm)
  - "node_modules/@aiany/sqlite-vec-*/**" # sqlite-vec extension (.dylib/.so/.dll) is dlopen'd at runtime — must live on disk
  - "node_modules/@node-rs/xxhash-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/@firecrawl/anydoc-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/node-screenshots-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/node-mac-permissions/**" # native N-API binary must be unpacked for runtime loading
extraResources:
  - from: "migrations/sqlite-drizzle"
    to: "migrations/sqlite-drizzle"
  - from: "packages/provider-registry/data"
    to: "provider-registry"
win:
  executableName: Cherry Studio
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  extraResources:
    - from: "node_modules/@aiany/sqlite-vec-windows-${arch}/vec0.dll"
      to: "app.asar.unpacked/node_modules/@aiany/sqlite-vec-windows-${arch}/vec0.dll"
  target:
    - target: nsis
    - target: portable
  signtoolOptions:
    sign: scripts/win-sign.js
  verifyUpdateCodeSignature: false
nsis:
  # Preserve the existing global installer identity so either edition replaces the same Windows installation.
  guid: 41a4ccd8-bcc0-5710-9eee-0e164da68057
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  allowToChangeInstallationDirectory: true
  oneClick: false
  include: build/nsis-installer.nsh
  buildUniversalInstaller: false
  differentialPackage: false
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
  buildUniversalInstaller: false
  # electron-builder 26.15.6 uses true for a unique $PLUGINSDIR on every launch.
  unpackDirName: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  target:
    - target: dmg
    - target: zip
dmg:
  writeUpdateInfo: false
linux:
  artifactName: ${productName}-${version}-${arch}.${ext}
  executableName: CherryStudio
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  maintainer: electronjs.org
  category: Utility
  desktop:
    entry:
      Name: Cherry Studio
      StartupWMClass: CherryStudio
  mimeTypes:
    - x-scheme-handler/cherrystudio
rpm:
  # Workaround for electron build issue on rpm package:
  # https://github.com/electron/forge/issues/3594
  fpm: ["--rpm-rpmbuild-define=_build_id_links none"]
publish:
  provider: generic
  url: https://releases.cherry-ai.com
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
beforePack: scripts/before-pack.js
afterPack: scripts/after-pack.js
afterSign: scripts/notarize.js
artifactBuildCompleted: scripts/artifact-build-completed.js
releaseInfo:
  releaseNotes: |
    <!--LANG:en-->
    Cherry Studio 2.0.14 - New Features, Fixes, and Performance

    ✨ New Features
    - [Agent] Agent sessions now label self-started replies — “Goal round N” for DSH goal continuations, or “Continued after background work” — so users understand why a new message appears.
    - [Models] DeepSeek V4.1 Flash Expires-On-0910 vision model is now available in the catalog.
    - [Cherry Cloud] Cloud sessions are now bound to the current computer, preserving free-grant history across credential resets.

    🐛 Bug Fixes
    - [Startup] Fixed Cherry Studio failing to start after an upgrade when the built-in Support Agent still needs to be created.
    - [Local Models] Windows cleanup now tolerates transient DLL release failures after an inference utility process exits.
    - [Knowledge Base] Fixed tables from PDFs imported through Mistral OCR being dropped; table contents are now indexed as Markdown tables.
    - [Pi] Fix OpenCode Go/Zen requests failing with MissingSessionID by preserving the agent session header.
    - [Export] Notion export now waits for the page body to be written and reports failed writes as errors instead of success.
    - [Obsidian] Fix invalid front matter when the note title contains “: “ or starts with “#”, and export tags as a proper YAML list.
    - [Prompt Polish] Add cancellation and a 60-second timeout so stalled requests return to a retryable state.
    - [Chat] Show safe, actionable provider details instead of generic errors such as “400 null”.
    - [Debug] Fixed truncated Outputs and UI freezes when inspecting long streaming responses in the message debug panel (Call Chain).
    - [Provider] OpenCode Go/Zen requests from model health checks, topic naming, and context compaction now carry the required session header.
    - [Chat] Deleting a response selected for context now preserves other replies and transfers context and follow-up messages to an adjacent reply.
    - [Cherry Cloud] Unsupported client versions now show an update-required message instead of asking users to retry login.
    - [Chat] Fixed text-only continuation turns incorrectly processing stale image attachments and failing before the response starts.
    - [Cherry Cloud] Login now requires a configured client signing key for custom builds.

    ⚡ Performance
    - [Knowledge] Knowledge page management dialogs and item detail panels are now loaded on demand instead of with the page.

    <!--LANG:zh-CN-->
    Cherry Studio 2.0.14 - 新功能、修复与性能优化

    ✨ 新功能
    - [智能体] 智能体会话现在为自动发起的回复添加标签——DSH 目标推进显示”目标推进 · 第 N 轮”，后台工作后继续显示”后台工作后继续”——让用户了解为什么出现了新消息。
    - [模型] DeepSeek V4.1 Flash Expires-On-0910 视觉模型现已上架模型目录。
    - [樱桃云] 云会话现已绑定当前设备，在凭证重置后保留免费额度历史。

    🐛 问题修复
    - [启动] 修复升级后需要首次创建内置产品反馈 Agent 时 Cherry Studio 无法启动的问题。
    - [本地模型] 修复 Windows 下 inference utility process 退出后 DLL 短暂占用导致模型清理偶发失败的问题。
    - [知识库] 修复通过 Mistral OCR 导入的 PDF 表格丢失问题；表格内容现在以 Markdown 表格形式索引。请重新索引已有条目以获取表格内容。
    - [Pi] 修复 OpenCode Go/Zen 请求因 MissingSessionID 失败的问题，现已保留智能体会话头部。
    - [导出] Notion 导出现在等待页面正文写入完成，写入失败时正确报错而非显示成功。
    - [Obsidian] 修复笔记标题包含”: “或以”#”开头时导出无效前置数据的问题，并将标签导出为正确的 YAML 列表。
    - [提示词润色] 支持取消和 60 秒超时，卡住的请求可立即恢复为可重试状态。
    - [对话] 显示安全可操作的错误详情，而非”400 null”等通用错误。
    - [调试] 修复消息调试面板(Call Chain)中长输出被截断和 UI 卡死的问题。
    - [服务商] OpenCode Go/Zen 的模型健康检查、话题命名和上下文压缩请求现在携带必需的会话头部。
    - [对话] 删除用于上下文的回复时，现在保留其他回复，并将上下文和后续消息转移到相邻回复。
    - [樱桃云] 不支持的客户端版本现在显示更新提示，而非让用户重试登录。
    - [对话] 修复纯文本续写轮次错误处理残留图片附件并在响应开始前失败的问题。
    - [樱桃云] 自定义构建现在需要配置客户端签名密钥才能登录。

    ⚡ 性能优化
    - [知识库] 知识库页面管理对话框和条目详情面板现在按需加载，而非随页面加载。
    <!--LANG:END-->
