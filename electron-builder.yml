appId: com.kangfenmao.CherryStudio
productName: Cherry Studio
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
  - ja # macOS/linux/win
  - ru # macOS/linux/win
  - zh_CN # for macOS
  - zh_TW # for macOS
  - en # for macOS
  - de
directories:
  buildResources: build

protocols:
  - name: Cherry Studio
    schemes:
      - cherrystudio
files:
  - "**/*"
  - "!**/{.vscode,.yarn,.yarn-lock,.github,.cursorrules,.prettierrc}"
  - "!electron.vite.config.{js,ts,mjs,cjs}}"
  - "!.*"
  - "!components.json"
  - "!**/{.eslintignore,.eslintrc.js,.eslintrc.json,.eslintcache,root.eslint.config.js,eslint.config.js,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,eslint.config.mjs,dev-app-update.yml,CHANGELOG.md,README.md,biome.jsonc}"
  - "!**/{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!**/{tsconfig.json,tsconfig.tsbuildinfo,tsconfig.node.json,tsconfig.web.json}"
  - "!**/{.editorconfig,.jekyll-metadata}"
  - "!src"
  - "!config"
  - "!patches"
  - "!**/node_modules/**/*.cpp"
  - "!**/node_modules/node-addon-api/**"
  - "!**/node_modules/prebuild-install/**"
  - "!scripts"
  - "!local"
  - "!docs"
  - "!packages"
  - "!.swc"
  - "!.bin"
  - "!._*"
  - "!*.log"
  - "!stats.html"
  - "!*.md"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!**/*.{map,ts,tsx,jsx,less,scss,sass,css.d.ts,d.cts,d.mts,md,markdown,yaml,yml}"
  - "!**/{test,tests,__tests__,powered-test,coverage}/**"
  - "!**/{example,examples}/**"
  - "!**/*.{spec,test}.{js,jsx,ts,tsx}"
  - "!**/*.min.*.map"
  - "!**/*.d.ts"
  - "!**/dist/es6/**"
  - "!**/dist/demo/**"
  - "!**/amd/**"
  - "!**/{.DS_Store,Thumbs.db,thumbs.db,__pycache__}"
  - "!**/{LICENSE,license,LICENSE.*,*.LICENSE.txt,NOTICE.txt,README.md,readme.md,CHANGELOG.md}"
  - "!node_modules/rollup-plugin-visualizer"
  - "!node_modules/js-tiktoken"
  - "!node_modules/@tavily/core/node_modules/js-tiktoken"
  - "!node_modules/pdf-parse/lib/pdf.js/{v1.9.426,v1.10.88,v2.0.550}"
  - "!node_modules/mammoth/{mammoth.browser.js,mammoth.browser.min.js}"
  - "!node_modules/selection-hook/prebuilds/**/*" # we rebuild .node, don't use prebuilds
  - "!node_modules/selection-hook/node_modules" # we don't need what in the node_modules dir
  - "!node_modules/selection-hook/src" # we don't need source files
  - "!**/node_modules/node-pty/build/**" # ship upstream prebuilds; the rebuilt binary needs GLIBC_2.34 and is never cross-compiled
  - "!node_modules/tesseract.js-core/{tesseract-core.js,tesseract-core.wasm,tesseract-core.wasm.js}" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core-lstm.js,tesseract-core-lstm.wasm,tesseract-core-lstm.wasm.js}" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core-simd-lstm.js,tesseract-core-simd-lstm.wasm,tesseract-core-simd-lstm.wasm.js}" # we don't need source files
  - "!node_modules/onnxruntime-web/**" # transformers.js's browser/WASM backend; local inference always runs onnxruntime-node instead
  - "!node_modules/@huggingface/transformers/node_modules/onnxruntime-web/**" # same package, nested copy
  - "!node_modules/onnxruntime-node/bin/**" # native binary is downloaded on first use (Toolchain/onnxruntime), never bundled — see OnnxRuntimeBinaryService
  - "!**/*.{h,iobj,ipdb,tlog,recipe,vcxproj,vcxproj.filters,Makefile,*.Makefile}" # filter .node build files
  - "resources/**/*" # include all files in resources, and unpack them from asar for runtime access
  - "!resources/devtools/**" # dev-only extensions are loaded from source in development
asarUnpack:
  - resources/**
  - "!resources/devtools/**"
  - "**/*.{metal,exp,lib}"
  - "node_modules/@img/sharp-*/**"
  # DSH runs as an external Node process: bundle its JS and unpack only native/runtime files.
  - "node_modules/@cherrystudio/dsh-bridge/dist/runtime/**"
  - "node_modules/sharp/**"
  - "node_modules/@img/colour/**"
  - "node_modules/detect-libc/**"
  - "node_modules/semver/**"
  - "node_modules/node-pty/**"
  - "node_modules/koffi/**"
  - "node_modules/@koromix/koffi-*/**"
  - "node_modules/@deepseek-ai/dsh-sandbox-windows-acl/**"
  - "node_modules/@deepseek-ai/node-addon-landlock-run*/**"
  - "node_modules/@anthropic-ai/claude-agent-sdk-*/**" # native CLI binary must live on disk to be spawned
  - "node_modules/@silvia-odwyer/photon-node/**" # pi SDK WASM dep: photon_rs.js does fs.readFileSync(__dirname/photon_rs_bg.wasm)
  - "node_modules/@aiany/sqlite-vec-*/**" # sqlite-vec extension (.dylib/.so/.dll) is dlopen'd at runtime — must live on disk
  - "node_modules/@node-rs/xxhash-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/@firecrawl/anydoc-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/node-screenshots-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/node-mac-permissions/**" # native N-API binary must be unpacked for runtime loading
extraResources:
  - from: "migrations/sqlite-drizzle"
    to: "migrations/sqlite-drizzle"
  - from: "packages/provider-registry/data"
    to: "provider-registry"
win:
  executableName: Cherry Studio
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  extraResources:
    - from: "node_modules/@aiany/sqlite-vec-windows-${arch}/vec0.dll"
      to: "app.asar.unpacked/node_modules/@aiany/sqlite-vec-windows-${arch}/vec0.dll"
  target:
    - target: nsis
    - target: portable
  signtoolOptions:
    sign: scripts/win-sign.js
  verifyUpdateCodeSignature: false
nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  allowToChangeInstallationDirectory: true
  oneClick: false
  include: build/nsis-installer.nsh
  buildUniversalInstaller: false
  differentialPackage: false
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
  buildUniversalInstaller: false
  # electron-builder 26.15.6 uses true for a unique $PLUGINSDIR on every launch.
  unpackDirName: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  target:
    - target: dmg
    - target: zip
dmg:
  writeUpdateInfo: false
linux:
  artifactName: ${productName}-${version}-${arch}.${ext}
  executableName: CherryStudio
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  maintainer: electronjs.org
  category: Utility
  desktop:
    entry:
      Name: Cherry Studio
      StartupWMClass: CherryStudio
  mimeTypes:
    - x-scheme-handler/cherrystudio
rpm:
  # Workaround for electron build issue on rpm package:
  # https://github.com/electron/forge/issues/3594
  fpm: ["--rpm-rpmbuild-define=_build_id_links none"]
publish:
  provider: generic
  url: https://releases.cherry-ai.com
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
beforePack: scripts/before-pack.js
afterPack: scripts/after-pack.js
afterSign: scripts/notarize.js
artifactBuildCompleted: scripts/artifact-build-completed.js
releaseInfo:
  releaseNotes: |
    <!--LANG:en-->
    Cherry Studio 2.0.9 - Features, Fixes, and Experience Improvements

    ✨ New Features
    - [WeChat] Agents can now send documents and videos through WeChat channels, while incoming video and voice messages are saved to the Agent workspace.
    - [Skills] Installed Skill details once again show the source file tree and content preview, with optional one-click Chinese translation for Markdown files.
    - [Skills] Installed Skill details now include an action to open the managed skill folder.
    - [Agent] Agent sessions now automatically discover workspace skills stored under .agents/skills.
    - [Appearance] Chat conversation list and work task list positions can now be changed from Settings → Appearance.
    - [Sidebar] Sidebar items can now be opened in a new tab with middle-click or the context menu.
    - [Models] Added DeepSeek V4 Flash Vision Exp with image input support.
    - [Export] Notion export now converts GitHub-style Markdown alerts into native Notion callout blocks.
    - [Files] The Agent workspace file tree now offers a context-menu action to copy a file path.
    - [Prompts] Prompts can now be global or limited to selected contexts, with context-specific ordering and management in Settings.
    - [MCP] Agents can now register an MCP server in one step; new servers remain inactive and untrusted until enabled unless activation was explicitly requested.
    - [Usage] Redesigned usage analytics with a clearer overview, independent request sorting, and interactive charts.
    - [Mini Apps] Mini apps can now be shown side by side in a split view.
    - [Sidebar] Assistants and Agents can now be pinned to the sidebar for quick access to their latest conversation.
    - [Providers] Provider and model catalog updates can now be delivered without waiting for an app release.

    🐛 Bug Fixes
    - [Providers] Model deletion now keeps the model list synchronized when a request reports failure after the model was already removed.
    - [Providers] Updating provider settings now preserves untouched nested options and correctly removes explicitly cleared values.
    - [Screenshot] Capture overlays now remain on the active macOS Space.
    - [Composer] Fixed the first paperclip attachment not appearing immediately after switching to an unused assistant.
    - [Agent] Fixed an immediate retry after stopping a session returning an empty or stalled response or losing Claude Code resume state.
    - [UI] Fixed the left sidebar resize handle becoming misaligned after returning from Settings.
    - [Code Editor] Fixed artifact file previews not filling or scrolling correctly and restored syntax highlighting for Markdown, TSX, TOML, Vue, PHP, and other file types.
    - [Painting] Painting size selections now keep their full outline visible.
    - [Settings] Generic Settings entry points now consistently open Model Services.
    - [LM Studio] Fixed LM Studio models not appearing in Pi and DeepSeek Harness Agent model pickers.
    - [Gemini] Fixed Gemini 3 latest aliases failing after the first tool call because replayed calls lacked thought signatures.
    - [Painting] Image count controls now reject fractional values while continuous controls retain decimal precision.
    - [Markdown] Fixed streamed inline code appearing abruptly and occasionally causing a rendering error.
    - [Agent] Global search no longer exposes hidden model reasoning, and existing search data is cleaned automatically.
    - [Agent] Referenced conversations are now treated as historical context and cannot authorize Agent actions.
    - [Composer] Fixed pasted Windows screenshots being dropped when the clipboard also contains text.
    - [Gemini] Fixed Gemini 3.x requests failing with HTTP 400 when web search and MCP tools are used together.
    - [Agent] Deleting an Agent now also removes its scheduled tasks instead of leaving them running and failing in the background.
    - [Migration] An unreadable legacy Agent database no longer blocks v2 migration; it is preserved and reported while remaining data continues migrating.
    - [Input] Confirming a Chinese, Japanese, or Korean IME candidate no longer saves raw composition text when renaming a conversation.
    - [Onboarding] Fixed a fresh installation crashing on the model-selection step.
    - [Markdown] Copying a table now returns the original Markdown table instead of unrelated message content.
    - [CodeMate] Fixed DeepSeek Harness failing to launch when old managed API-key entries remain in its credentials file.
    - [MCP] Fixed workspace file search failing to parse ripgrep results correctly.
    - [Prompts] Prompt and translation placeholders now preserve literal replacement text, including special replacement characters.
    - [Artifact Pane] Fixed the elevated composer remaining visible after maximizing the artifact pane.
    - [QuickPanel] Fixed hidden actions remaining clickable after switching back to a tab.
    - [Models] Recognized custom models now inherit missing registry descriptions and input/output capabilities.
    - [PDF] Fixed BabelDOC installation failing in mainland China by using accessible Python, font, and model mirrors.
    - [Tools] Python-based tool installation in mainland China now retries alternate package mirrors when the default mirror is not ready.
    - [Composer] Markdown attachments can once again be opened in the file preview from the Composer or sent messages.
    - [Models] Existing custom models now inherit context limits and pricing when a registry update recognizes them.
    - [Screenshot] The IME candidate window now remains visible while annotating screenshots with text.
    - [API Gateway] Fixed reasoning effort being lost when Chat Completions requests are converted to OpenAI Responses requests.
    - [Screenshot] Escape now dismisses a capture overlay before a selection is made, including on another hovered display.
    - [API Gateway] Fixed Agent sessions failing on OpenAI-compatible endpoints that require system messages to appear first.
    - [Providers] Fixed Anthropic-compatible providers failing when thinking blocks omit a signature.
    - [Screenshot] Fixed the annotation toolbar appearing off-screen after a full-screen capture.
    - [Startup] Launch on Startup now registers with the operating system and reapplies the saved preference when Cherry Studio starts.
    - [Agent] Pi and DeepSeek Harness Agents can now use models without a configured context window by falling back to 256K.
    - [Ollama] Local Ollama models now use their reported context window, preventing tool-based Agent sessions from being truncated and failing.
    - [CodeMate] Fixed DeepSeek Harness 0.1.1 and newer rejecting the credentials layout written by Cherry Studio.
    - [Providers] Fixed Volcengine Ark multi-turn Responses and web search, Hugging Face reasoning and tool use, compatible third-party reasoning settings, OpenAI reasoning summaries, and Fast mode for supported Doubao models.
    - [Quick Assistant] Quick Assistant now uses the configured Quick Model instead of silently falling back to the default model.
    - [MCP] MCP prompts with arguments now collect values in a form before inserting the rendered prompt.
    - [Mini Apps] Keyboard shortcuts such as Ctrl+Tab now work while focus is inside a Mini App.
    - [API Gateway] Fixed Agent requests to OpenAI reasoning models failing because compatible providers sent max_tokens instead of max_completion_tokens.
    - [Composer] Fixed the input box restoring an already-sent message after sending.
    - [Agent] Pi Agent citations now render as citation badges with a source list instead of literal markers.
    - [Search] Opening another conversation while message location is in progress no longer loads the entire history into the newly opened conversation.
    - [Migration] V1-to-v2 migration now skips IndexedDB records whose large backing value can no longer be read.
    - [Tools] Dependency installs now validate the executables a recipe actually provides, fixing false “installed but not runnable” errors.
    - [Artifacts] Fixed inline HTML previews continuously jumping between two heights when content ends with bare text.
    - [Chat] Fixed arrow-key scrolling jitter in message lists.
    - [Chat] Topic rename success now appears only after the title is saved, and automatic rename failures are reported.
    - [Citations] Switching conversations now closes the citations panel so sources from the previous conversation are not shown.
    - [OVMS] Downloaded OVMS models now remain visible in Model Manager even when server-side loading fails.
    - [Shortcuts] The clear-messages shortcut once again clears the active conversation.
    - [Shortcuts] Restored Ctrl+L as the clear-messages shortcut, with a confirmation step.
    - [Tabs] Message navigation and selection now target the correct tab when the same conversation is open more than once.
    - [Composer] Drafts, attachments, and structured tokens are preserved when the main process blocks a send request.
    - [Navigation] Actions no longer target the previous assistant or Agent conversation while a newly selected conversation is loading.
    - [Chat] Clearing messages from a non-active conversation now affects the selected conversation instead of the active one.
    - [Migration] Data-directory migration on Windows now copies symbolic-link targets as ordinary files and directories.
    - [Notes] The first click after renaming a note now switches to the selected note correctly.
    - [Windows] Restored Bash command output; if CLAUDE_CODE_GIT_BASH_PATH points to git-bash.exe, update it to Git Bash's bin/bash.exe.
    - [Chat] Conversation and Agent session titles no longer briefly revert after an inline rename.
    - [Agent] Reused empty Agent sessions now appear in the correct recent date group.
    - [Agent] V2 Agent identity and memory files are preserved when their old v1 source workspace no longer exists.
    - [Ollama] Fixed Claude Agent SDK system updates being dropped by some Ollama model templates.
    - [Tasks] Scheduled tasks now report accurate next-run times after pause, resume, manual runs, and restarts.
    - [CodeMate] Fixed stale provider selections interfering with the currently selected Code Mate configuration.
    - [Navigation] A chat window no longer remains on an assistant conversation that was deleted elsewhere.
    - [Search] Message-search navigation now stops loading old history after switching conversations.
    - [Agent] Continuing after an unanswered tool approval no longer fails with “No tool output found for tool call”.
    - [Code] Code blocks no longer flash as unhighlighted text before syntax highlighting appears.
    - [API Gateway] Agent sessions on non-Anthropic models no longer receive internal Agent SDK context as an assistant reply.
    - [Skills] Missing subagent dependencies now show a clear error, and unresolved CLI executables show a warning instead of silently producing unrelated output.
    - [API Gateway] Anthropic requests containing server tools without an input schema no longer fail the whole request on providers that cannot run those tools.
    - [Agent] Pi Agent citations now resolve for web-search results returned by third-party MCP tools.
    - [Tabs] Transient Mini App tabs no longer offer an unsupported Pin Tab action.
    - [Qwen] Fixed the thinking toggle for locally deployed Qwen models on OpenAI-compatible providers.
    - [Skills] Fixed GitHub Skill installation from raw links, repository-root descriptors, lowercase skill.md files, and explicit branches or tags.

    💄 Improvements
    - [Agent] Improved Agent creation and editing with consistent navigation, clearer runtime choices, integrated avatar editing, and reliable permission defaults.
    - [Agent] Pi Agent now uses its official icon.
    - [Memory] Added a memory overview and clarified the roles of Agent File Memory, Knowledge Base, and MCP Memory after removal of v1 Global Memory.
    - [Agent] Added a back button to subagent flow details.
    - [Agent] Agent creation tools now refresh the Agent list and offer a Go to chat action for the newly created Agent.
    - [QuickPanel] Improved row layout so command and Skill names remain readable while descriptions use the available space.
    - [Launchpad] Refreshed built-in apps with dedicated multicolor icons and consistent sizing.
    - [Prompts] Aligned prompt editor action buttons for consistent sizing, shape, color, and icon scale.
    - [Models] Removed native number spinners from numeric model-setting fields.
    - [QuickPanel] Improved Skill-name readability.
    - [Models] Model selectors now identify duplicate names by provider and model ID.
    - [Composer] Truncated pasted links now show an ellipsis, reveal the full URL on hover, and display preview cards faster.
    - [Artifact Pane] Maximizing and restoring the right pane now animates smoothly without content jumps, overlap, or dark-mode transparency.
    - [Files] File-opening menus now show bounded application choices and remember the preferred app for each file type.
    - [PDF] PDF translation now shows accurate progress while required resources are downloaded.
    - [Agent] Agent questions now show their full title instead of truncating it to one line.
    - [Permissions] Improved permission-mode readability and restored warning tooltips.
    - [Assistant] Selection Assistant and Quick Assistant settings now show the active model and link directly to its global configuration.
    - [Providers] Action required: the retired GitHub Models provider has been removed; configure another provider if you previously relied on it.
    - [MCP] Built-in flomo and Nowledge Mem servers now use their real Streamable HTTP endpoints; existing servers migrate automatically, but flomo users must authorize once more.
    - [Privacy] The August 2026 privacy policy adds model-relay and third-party billing disclosures; users with anonymous data collection enabled must review it before analytics resumes.
    - [Permissions] Full Access now skips per-call approval for knowledge-base edits, image generation, CLI installation, and Assistant settings/file tools; choose Approve for Me or Ask Before Acting if these actions should still prompt.

    ⚡ Performance
    - [Installation] Reduced unpacked DeepSeek Harness runtime files to improve Cherry Studio installation speed.
    - [Painting] Painting history now loads independent file metadata concurrently.
    - [Screenshot] Capture overlays now appear immediately.
    - [Local Models] Hardware acceleration is now enabled by default for local inference.

    <!--LANG:zh-CN-->
    Cherry Studio 2.0.9 - 新功能、修复与体验优化

    ✨ 新功能
    - [微信] Agent 现在可以通过微信渠道发送文档和视频，收到的视频和语音消息会保存到 Agent 工作区。
    - [技能] 已安装技能详情重新支持查看源文件树和内容，并可一键将 Markdown 文件翻译为中文。
    - [技能] 已安装技能详情新增打开托管技能文件夹的操作。
    - [Agent] Agent 会话现在会自动发现工作区 .agents/skills 目录中的技能。
    - [外观] 可在“设置 → 外观”中调整对话列表和工作任务列表的位置。
    - [侧边栏] 支持通过鼠标中键或右键菜单在新标签页中打开侧边栏项目。
    - [模型] 新增支持图片输入的 DeepSeek V4 Flash Vision Exp。
    - [导出] 导出到 Notion 时会将 GitHub 风格的 Markdown 提示块转换为原生 Notion Callout。
    - [文件] Agent 工作区文件树新增右键复制文件路径。
    - [提示词] 提示词可设为全局可用或仅在指定场景可用，并支持按场景排序和在设置中管理。
    - [MCP] Agent 现在可一步注册 MCP 服务器；除非用户明确要求启用，否则新服务器会保持未启用和不受信任状态。
    - [用量] 全新用量统计页面提供更清晰的概览、独立请求排序和可交互图表。
    - [小程序] 支持分屏并排显示两个小程序。
    - [侧边栏] 助手和 Agent 可固定到侧边栏，快速打开各自最近的会话。
    - [服务商] 服务商和模型目录现在无需等待应用发版即可热更新。

    🐛 问题修复
    - [服务商] 修复删除模型时请求报告失败但模型实际已删除，导致模型列表不同步的问题。
    - [服务商] 更新服务商设置时会保留未修改的嵌套选项，并正确移除明确清空的值。
    - [截图] 截图遮罩在捕获期间会保持在当前 macOS 空间。
    - [输入框] 修复切换到未使用的助手后，首次通过回形针添加的附件未立即显示的问题。
    - [Agent] 修复停止会话后立即重试可能返回空白或卡住、或丢失 Claude Code 恢复状态的问题。
    - [界面] 修复从设置返回后左侧边栏缩放手柄位置错位的问题。
    - [代码编辑器] 修复产物文件预览无法正确铺满或滚动，并恢复 Markdown、TSX、TOML、Vue、PHP 等文件的语法高亮。
    - [绘画] 绘画尺寸选项现在会完整显示选中描边。
    - [设置] 通用设置入口现在会稳定打开“模型服务”。
    - [LM Studio] 修复 LM Studio 模型未出现在 Pi 和 DeepSeek Harness Agent 模型选择器中的问题。
    - [Gemini] 修复 Gemini 3 latest 别名在首次工具调用后因缺少思考签名而失败的问题。
    - [绘画] 图片数量参数不再接受小数，连续型参数仍保留小数精度。
    - [Markdown] 修复流式内联代码突然出现，并可能在流式渲染期间触发错误的问题。
    - [Agent] 全局搜索不再暴露模型隐藏思考内容，升级时会自动清理已有搜索数据。
    - [Agent] 引用的历史会话仅作为上下文，不再能够授权 Agent 执行动作。
    - [输入框] 修复 Windows 截图在剪贴板同时包含文本格式时未发送给模型的问题。
    - [Gemini] 修复 Gemini 3.x 同时使用联网搜索和 MCP 工具时返回 HTTP 400 的问题。
    - [Agent] 删除 Agent 时会一并删除其定时任务，避免任务继续在后台运行并反复失败。
    - [迁移] 无法读取的旧版 Agent 数据库不再阻断 v2 迁移；数据库会被保留并报告，其余数据继续迁移。
    - [输入] 使用中日韩输入法重命名会话时，确认候选词不再错误保存为未上屏的拼音或组合文本。
    - [引导] 修复全新安装在模型选择步骤崩溃的问题。
    - [Markdown] 修复复制表格时得到无关消息内容而非原始 Markdown 表格的问题。
    - [CodeMate] 修复凭据文件残留旧版托管 API Key 时 DeepSeek Harness 无法启动的问题。
