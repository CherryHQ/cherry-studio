appId: com.kangfenmao.CherryStudio
productName: Cherry Studio
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
  - ja # macOS/linux/win
  - ru # macOS/linux/win
  - zh_CN # for macOS
  - zh_TW # for macOS
  - en # for macOS
  - de
directories:
  buildResources: build

protocols:
  - name: Cherry Studio
    schemes:
      - cherrystudio
files:
  - "**/*"
  - "!**/{.vscode,.yarn,.yarn-lock,.github,.cursorrules,.prettierrc}"
  - "!electron.vite.config.{js,ts,mjs,cjs}}"
  - "!.*"
  - "!components.json"
  - "!**/{.eslintignore,.eslintrc.js,.eslintrc.json,.eslintcache,root.eslint.config.js,eslint.config.js,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,eslint.config.mjs,dev-app-update.yml,CHANGELOG.md,README.md,biome.jsonc}"
  - "!**/{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!**/{tsconfig.json,tsconfig.tsbuildinfo,tsconfig.node.json,tsconfig.web.json}"
  - "!**/{.editorconfig,.jekyll-metadata}"
  - "!src"
  - "!config"
  - "!patches"
  - "!**/node_modules/**/*.cpp"
  - "!**/node_modules/node-addon-api/**"
  - "!**/node_modules/prebuild-install/**"
  - "!scripts"
  - "!local"
  - "!docs"
  - "!packages"
  - "!.swc"
  - "!.bin"
  - "!._*"
  - "!*.log"
  - "!stats.html"
  - "!*.md"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!**/*.{map,ts,tsx,jsx,less,scss,sass,css.d.ts,d.cts,d.mts,md,markdown,yaml,yml}"
  - "!**/{test,tests,__tests__,powered-test,coverage}/**"
  - "!**/{example,examples}/**"
  - "!**/*.{spec,test}.{js,jsx,ts,tsx}"
  - "!**/*.min.*.map"
  - "!**/*.d.ts"
  - "!**/dist/es6/**"
  - "!**/dist/demo/**"
  - "!**/amd/**"
  - "!**/{.DS_Store,Thumbs.db,thumbs.db,__pycache__}"
  - "!**/{LICENSE,license,LICENSE.*,*.LICENSE.txt,NOTICE.txt,README.md,readme.md,CHANGELOG.md}"
  - "!node_modules/rollup-plugin-visualizer"
  - "!node_modules/js-tiktoken"
  - "!node_modules/@tavily/core/node_modules/js-tiktoken"
  - "!node_modules/pdf-parse/lib/pdf.js/{v1.9.426,v1.10.88,v2.0.550}"
  - "!node_modules/mammoth/{mammoth.browser.js,mammoth.browser.min.js}"
  - "!node_modules/selection-hook/prebuilds/**/*" # we rebuild .node, don't use prebuilds
  - "!node_modules/selection-hook/node_modules" # we don't need what in the node_modules dir
  - "!node_modules/selection-hook/src" # we don't need source files
  - "!**/node_modules/node-pty/build/**" # ship upstream prebuilds; the rebuilt binary needs GLIBC_2.34 and is never cross-compiled
  - "!node_modules/tesseract.js-core/{tesseract-core.js,tesseract-core.wasm,tesseract-core.wasm.js}" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core-lstm.js,tesseract-core-lstm.wasm,tesseract-core-lstm.wasm.js}" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core-simd-lstm.js,tesseract-core-simd-lstm.wasm,tesseract-core-simd-lstm.wasm.js}" # we don't need source files
  - "!node_modules/onnxruntime-web/**" # transformers.js's browser/WASM backend; local inference always runs onnxruntime-node instead
  - "!node_modules/@huggingface/transformers/node_modules/onnxruntime-web/**" # same package, nested copy
  - "!node_modules/onnxruntime-node/bin/**" # native binary is downloaded on first use (Toolchain/onnxruntime), never bundled — see OnnxRuntimeBinaryService
  - "!**/*.{h,iobj,ipdb,tlog,recipe,vcxproj,vcxproj.filters,Makefile,*.Makefile}" # filter .node build files
  - "resources/**/*" # include all files in resources, and unpack them from asar for runtime access
  - "!resources/devtools/**" # dev-only extensions are loaded from source in development
asarUnpack:
  - resources/**
  - "!resources/devtools/**"
  - "**/*.{metal,exp,lib}"
  - "node_modules/@img/sharp-*/**"
  - "node_modules/@anthropic-ai/claude-agent-sdk-*/**" # native CLI binary must live on disk to be spawned
  - "node_modules/@silvia-odwyer/photon-node/**" # pi SDK WASM dep: photon_rs.js does fs.readFileSync(__dirname/photon_rs_bg.wasm)
  # beforePack adds the complete DSH subprocess dependency closure here.
  - "node_modules/@aiany/sqlite-vec-*/**" # sqlite-vec extension (.dylib/.so/.dll) is dlopen'd at runtime — must live on disk
  - "node_modules/@node-rs/xxhash-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/@firecrawl/anydoc-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/node-screenshots-*/**" # native N-API binary must be unpacked for runtime loading
  - "node_modules/node-mac-permissions/**" # native N-API binary must be unpacked for runtime loading
extraResources:
  - from: "migrations/sqlite-drizzle"
    to: "migrations/sqlite-drizzle"
  - from: "packages/provider-registry/data"
    to: "provider-registry"
win:
  executableName: Cherry Studio
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  extraResources:
    - from: "node_modules/@aiany/sqlite-vec-windows-${arch}/vec0.dll"
      to: "app.asar.unpacked/node_modules/@aiany/sqlite-vec-windows-${arch}/vec0.dll"
  target:
    - target: nsis
    - target: portable
  signtoolOptions:
    sign: scripts/win-sign.js
  verifyUpdateCodeSignature: false
nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  allowToChangeInstallationDirectory: true
  oneClick: false
  include: build/nsis-installer.nsh
  buildUniversalInstaller: false
  differentialPackage: false
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
  buildUniversalInstaller: false
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  target:
    - target: dmg
    - target: zip
dmg:
  writeUpdateInfo: false
linux:
  artifactName: ${productName}-${version}-${arch}.${ext}
  executableName: CherryStudio
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  maintainer: electronjs.org
  category: Utility
  desktop:
    entry:
      Name: Cherry Studio
      StartupWMClass: CherryStudio
  mimeTypes:
    - x-scheme-handler/cherrystudio
rpm:
  # Workaround for electron build issue on rpm package:
  # https://github.com/electron/forge/issues/3594
  fpm: ["--rpm-rpmbuild-define=_build_id_links none"]
publish:
  provider: generic
  url: https://releases.cherry-ai.com
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
beforePack: scripts/before-pack.js
afterPack: scripts/after-pack.js
afterSign: scripts/notarize.js
artifactBuildCompleted: scripts/artifact-build-completed.js
releaseInfo:
  releaseNotes: |
    <!--LANG:en-->
    Cherry Studio 2.0.8 - Features, Fixes, and Performance

    ✨ New Features
    - [MCP] MCP prompts and resources are now usable from the composer: pick a prompt to insert its text with Tab-fillable argument fields, or pick a resource to attach its content. Assistants can also browse and read MCP resources through new mcp_resource_list / mcp_resource_read tools.
    - [PDF] Add layout-preserving PDF translation via BabelDOC on the Translate page. Install the BabelDOC plugin from Settings → Environment Dependencies to translate PDFs while keeping their original layout, previewed side by side with the source.
    - [PDF] PDF translations are now saved to Translation History, and the translated PDF is added to the file manager. Open a history entry to reopen the preview, or to open, reveal, or save the translated PDF.
    - [Screenshot] Added a built-in screen capture tool. Use the global shortcut to select any region across your displays, annotate it with rectangles, arrows, drawing, text, or mosaic, then copy or save the result. Local OCR can recognize selectable text directly in the capture. Enable it under Settings → Screenshot.
    - [Agent] Add durable, auditable requests and asynchronous completion results between Agent Sessions, with trusted attribution, queue state, search, and restart recovery.
    - [Agent] Agent task progress now appears in a floating capsule above the composer with live progress and hover details.
    - [Agent] Pi Agent Runtime now uses Code Mode to discover and orchestrate MCP tools with tool_search, tool_describe, tool_call, and approval-gated tool_exec.
    - [Agent] Cherry Studio now shows completion notifications for Agent tasks and assistant responses, using in-app cards for other sessions and system notifications when the app is in the background.
    - [Skills] Added global enable/disable switches for installed skills. Globally disabled skills remain installed and are removed from Agent skill selection in real time.
    - [Settings] Reorganized settings with a new General page for system and assistant context preferences.
    - [Settings] Provider settings now provide one Model Check action for checking a single model or all models. Both workflows use consistent masked API key selectors with progress and per-key results.
    - [Fetch] Web fetch tools can now reach local network addresses. A new Settings → General toggle, "Allow fetching local network addresses", is on by default. Turn it off if you run sensitive services locally.
    - [Shortcuts] Improved the Keyboard Shortcuts settings page with compact search, filtering, and bulk actions.

    🐛 Bug Fixes
    - [Agent] Fix the DeepSeek Harness (dsh) agent runtime failing to start on Linux with "Failed to load native module: pty.node".
    - [Agent] Fix DSH tool approval cards that could disappear when bridge and session events arrived out of order.
    - [Agent] Fix DSH agent web search: results now render as a source card with clickable links, and inline citation markers resolve instead of showing raw [cite:id] text.
    - [Agent] Fix DSH subagent output occasionally rendering under the wrong tool card after a send_message follow-up to a running subagent.
    - [Agent] Fix Agent creation not automatically selecting the configured default model for Pi and DeepSeek Harness when it is enabled and compatible.
    - [Agent] Fix ExitPlanMode approval and denied headless tool records showing an empty tool preview instead of the generated plan.
    - [Agent] Fix agent sessions on Kimi models failing with "tokenization failed" when ToolSearch activates.
    - [Agent] Fix Claude Code Agent sessions using OpenAI Responses-compatible providers failing when upstream requires storage to be disabled.
    - [Agent] Fix agents failing with "tool parameter root must be an object type" when using xAI/Grok models with the built-in notify tool.
    - [Agent] Fix Fast (Pi) agents in "Approve for Me" mode asking for permission when reading enabled Cherry-managed skills.
    - [Agent] Fix Pi Agent requests ignoring Cherry Studio's configured proxy environment.
    - [Agent] Fix the right-pane file preview placing text, Markdown, and HTML against the panel edges and allowing long lines in text files to overflow horizontally.
    - [Ollama] Fix Ollama health check causing UI to freeze for ~30 seconds by using a lightweight probe instead of the full text generation pipeline.
    - [Ollama] Fix Ollama Qwen models not displaying inline `<think>` reasoning in the collapsible reasoning block.
    - [Ollama] Fix Ollama reasoning models skipping their thinking process when reasoning mode is set to Default.
    - [Ollama] Fix Agent mode failing with a 400 error when using Ollama models that do not support thinking.
    - [Chat] Fix message edit and translation resetting the message's saved reasoning effort and fast mode.
    - [Chat] Fix the missing edit action on assistant replies from providers that annotate their output, such as every OpenAI Responses API reply.
    - [Chat] Fix conversations remaining named "New Chat" when auto naming is disabled by using the first user message as the fallback title.
    - [Chat] Fix editing conversation names so spaces can be entered for unpinned assistant conversations.
    - [Chat] Fix Quick Assistant completed text responses remaining in a streaming state.
    - [Translation] Fix slow or blank selection translation results with Bailian Qwen Responses models.
    - [Markdown] Fix message rendering replacing model output with "[blocked]" / "[Image blocked: ...]" when a reply contains a link or image the renderer will not load.
    - [Markdown] Fix copied formulas losing their TeX source in packaged builds; the clipboard now keeps both TeX and rich HTML.
    - [Knowledge Base] Improve retrieval and citations when using an attached knowledge base.
    - [CodeMate] Start unconfigured coding agents through the Cherry Studio unified gateway using the app's default model.
    - [CodeMate] Hide providers that are incompatible with DeepSeek Harness instead of letting them fail at launch.
    - [CherryIN] Refresh the displayed balance after returning from a top-up in the system browser.
    - [Localization] Localize the new Code Mode tool names and descriptions in all supported renderer languages.
    - [UI] Fix drag-and-drop getting stuck when an external window takes focus mid-drag, which left the dragged item following the cursor.
    - [UI] Use consistent drag-preview backgrounds in assistant and Agent conversation lists.
    - [Provider] Fix model connectivity check for image-generation models: it now calls the image endpoint instead of failing.
    - [Provider] Fix provider connection-check error popup showing raw JSON for nested errors, and long unbroken tokens overflowing the popup width.
    - [Provider] Fix image generation on user-added copies of built-in providers: image-to-image failed on Volcengine Ark, DashScope image models bypassed their async transport, and vendor image parameters were dropped for ModelScope / PPIO / SiliconFlow / DMXAPI.
    - [Provider] Restore smart aspect-ratio matching and 1K/2K/4K controls for Nano Banana 2 image generation, including Google models used through Gateway.
    - [Provider] Fix image generation failing with a 400 "response_format is not supported" error on LiteLLM-backed gateways — the request is now retried without it, and failed image-URL downloads no longer save corrupt files.
    - [Provider] Fix OpenAI image generation now accepting image responses returned as URLs as well as Base64 data.
    - [Provider] Fix Zhipu web search not recognizing API keys inherited from the selected model's provider.
    - [Provider] Fix Zhipu web search continuing to use a stale API key after the provider key was updated or disabled.
    - [MCP] Fix deleted MCP servers being able to reconnect in the background and leave orphaned server processes running.
    - [MCP] Fix MCP settings prefetching tools, prompts, and resources until those tabs are opened.
    - [MCP] Fix skill marketplace installs failing for repos that contain duplicate SKILL.md files in hidden directories.
    - [MCP] Fix System skills organized in nested directories now being discovered and importable.
    - [Security] Security hardening: legacy IPC channels now reject untrusted renderer senders, "open with default app" refuses dangerous file types, and archive extraction enforces zip-entry containment.
    - [Security] Block unsafe non-web navigation and webview popups, remove leftover plaintext migration staging files after migration, and restrict developer trace files to the current user.
    - [Security] Fix startup and IPC access in Windows portable builds when the renderer path uses a filesystem alias such as a Windows 8.3 short name.
    - [Security] Fix images sent through a WeChat channel arriving as a grey placeholder.
    - [Migration] Fix v2 Agent data migration on Windows volumes that reject hard-link publication.
    - [Migration] Fix v1-to-v2 migrations failing when stale Agent attachment references remain from an earlier attempt.
    - [Migration] Fix v1-to-v2 migration failing when an IndexedDB record has already lost its backing file.
    - [Migration] Allow v2 upgrades to continue when an external virtual-drive Agent workspace cannot resolve its real path.
    - [Export] Fix Obsidian export appending the same content twice when the export button is double-clicked.
    - [Export] Fix wide tables and webfont text being clipped when exporting a conversation or message as an image.
    - [Window] Fix closing the main window with the system tray disabled leaving Cherry Studio processes running in the background.
    - [Window] Fix detached-window title bars sitting too close to the left edge in macOS fullscreen mode.
    - [UI] Fix assistant conversation and agent task lists keeping empty groups visible, expanding long groups incrementally, and scrolling smoothly.
    - [UI] Fix the Paintings model list reordering itself after selecting a model.
    - [UI] Fix Feishu agent channels with official SDK reliability, persistent conversation isolation, and thread/topic support in group chats.
    - [UI] Fix local embedding initialization failures on Linux after the ONNX inference worker restarts.
    - [UI] Fix images attached to models without Vision now using OCR and stopping with a configuration prompt when OCR is unavailable or fails.
    - [UI] Fix provider/model catalog refresh and hide unsupported batch and gateway routing aliases.
    - [UI] Fix context variables passed to the built-in Python tool being injected into the script's execution scope.
    - [UI] Fix a startup JavaScript error when a proxy or network gateway returns non-ASCII response headers.
    - [UI] Fix web fetching failing behind fake-IP proxies and on IPv6-only networks.

    ⚡ Performance
    - Reduced main-process stalls: file reads (Notes search), Word export and image save no longer block the whole app while reading files or showing save dialogs.
    - Improved scrolling smoothness for expanded conversation resource lists.

    <!--LANG:zh-CN-->
    Cherry Studio 2.0.8 - 新功能、修复与性能优化

    ✨ 新功能
    - [MCP] MCP 提示和资源现在可以在输入框中使用：选择提示可插入带 Tab 填充参数的文本，选择资源可附加其内容。助手也可以通过新的 mcp_resource_list / mcp_resource_read 工具浏览和读取 MCP 资源。
    - [PDF] 在翻译页面新增布局保留的 PDF 翻译功能（通过 BabelDOC）。从"设置 → 环境依赖"安装 BabelDOC 插件，即可翻译 PDF 并保留原始布局，支持左右对照预览。
    - [PDF] PDF 翻译现在会保存到翻译历史，翻译后的 PDF 会添加到文件管理器。打开历史条目可重新预览，或打开、显示、保存翻译后的 PDF。
    - [截图] 新增内置截图工具。使用全局快捷键可跨显示器选择任意区域，添加矩形、箭头、画笔、文字或马赛克标注，再复制或保存结果；本地 OCR 可识别并直接选取截图中的文字。请在“设置 → 截图”中启用。
    - [Agent] 新增 Agent 会话间的持久化、可审计请求和异步完成结果，支持可信归属、队列状态、搜索和重启恢复。
    - [Agent] Agent 任务进度现在会在输入框上方以浮动胶囊显示，并提供实时进度和悬停详情。
    - [Agent] Pi Agent 运行时现在使用代码模式来发现和编排 MCP 工具，支持 tool_search、tool_describe、tool_call 和审批式 tool_exec。
    - [Agent] Cherry Studio 现在会为 Agent 任务和助手回复显示完成通知，其他会话使用应用内卡片，应用在后台时使用系统通知。
    - [技能] 新增已安装技能的全局启用/禁用开关。全局禁用的技能仍会保留，并会实时从 Agent 的技能选择中移除。
    - [设置] 设置页面重新组织，新增"通用"页面用于系统和助手上下文偏好设置。
    - [设置] 服务商设置现在提供统一的模型检查操作，可检查单个模型或所有模型。两种工作流都使用一致的掩码 API 密钥选择器，显示进度和每密钥结果。
    - [抓取] 网页抓取工具现在可以访问本地网络地址。新增"设置 → 通用"开关"允许抓取本地网络地址"，默认开启。如果在本地运行敏感服务，请关闭此选项。
    - [快捷键] 改进了键盘快捷键设置页面，支持紧凑搜索、过滤和批量操作。

    🐛 问题修复
    - [Agent] 修复 DeepSeek Harness (dsh) Agent 运行时在 Linux 上启动失败，报错"Failed to load native module: pty.node"。
    - [Agent] 修复 DSH 工具审批卡片在桥接和会话事件乱序到达时可能消失的问题。
    - [Agent] 修复 DSH Agent 网页搜索：结果现在渲染为带可点击链接的来源卡片，引用标记正常解析而非显示原始 [cite:id] 文本。
    - [Agent] 修复在向运行中的子 Agent 发送 send_message 后，DSH 子 Agent 输出偶尔显示在错误工具卡片下的问题。
    - [Agent] 修复创建 Agent 时未自动选择已启用且兼容的默认模型（适用于 Pi 和 DeepSeek Harness）。
    - [Agent] 修复 ExitPlanMode 审批和拒绝的无头工具记录显示空工具预览而非生成的计划。
    - [Agent] 修复 Kimi 模型在 ToolSearch 激活时报"tokenization failed"失败。
    - [Agent] 修复使用 OpenAI Responses 兼容服务商的 Claude Code Agent 会话在上游要求禁用存储时失败。
    - [Agent] 修复使用 xAI/Grok 模型时内置通知工具报"tool parameter root must be an object type"失败。
    - [Agent] 修复"自动批准"模式下的快速（Pi）Agent 在读取已启用的 Cherry 托管技能时仍请求权限。
    - [Agent] 修复 Pi Agent 请求未使用 Cherry Studio 中已配置代理环境的问题。
    - [Agent] 修复右侧文件预览中文本、Markdown 和 HTML 文件贴边，以及文本文件长行水平溢出的问题。
    - [Ollama] 修复 Ollama 健康检查导致 UI 冻结约 30 秒，改用轻量级探测替代完整文本生成管道。
    - [Ollama] 修复 Ollama Qwen 模型的内联 `<think>` 推理未显示在可折叠推理块中。
    - [Ollama] 修复 Ollama 推理模型在推理模式设为默认时跳过思考过程。
    - [Ollama] 修复不支持思考的 Ollama 模型在 Agent 模式下报 400 错误的问题。
    - [对话] 修复消息编辑和翻译会重置消息保存的推理力度和快速模式。
    - [对话] 修复来自标注输出（如 OpenAI Responses API）的助手回复缺少编辑操作。
    - [对话] 修复禁用自动命名时对话仍名"新对话"，改用第一条用户消息作为后备标题。
    - [对话] 修复编辑对话名称时无法输入空格。
    - [对话] 修复快速助手完成的文本回复仍处于流式状态。
    - [翻译] 修复百炼 Qwen Responses 模型的划词翻译结果迟缓或空白的问题。
    - [Markdown] 修复消息渲染将模型输出替换为"[blocked]"或"[Image blocked: ...]"，当回复包含渲染器不会加载的链接或图片时。
    - [Markdown] 修复打包版本中复制公式会丢失 TeX 源码的问题；剪贴板现在会同时保留 TeX 和富文本 HTML。
    - [知识库] 改进使用已附加知识库时的检索与引用。
    - [CodeMate] 未配置的编程 Agent 现在会使用应用默认模型，通过 Cherry Studio 统一网关启动。
    - [CodeMate] 隐藏与 DeepSeek Harness 不兼容的服务商，避免选择后启动失败。
    - [CherryIN] 从系统浏览器充值返回后，自动刷新显示的余额。
    - [本地化] 为所有支持的渲染器语言补齐新 Code Mode 工具的名称和说明。
    - [界面] 修复拖拽在外部窗口获取焦点时卡住，导致拖拽项跟随光标。
    - [界面] 统一助手和 Agent 对话列表的拖拽预览背景。
    - [服务商] 修复图片生成模型的连通性检查：现在调用正确的图片端点而非失败。
    - [服务商] 修复服务商连接检查错误弹窗显示原始 JSON，以及长 token 溢出弹窗宽度。
    - [服务商] 修复用户添加的内置服务商副本上的图片生成：Volcengine Ark 图片对图片失败、DashScope 图片模型绕过异步传输、ModelScope/PPIO/SiliconFlow/DMXAPI 丢弃厂商图片参数。
