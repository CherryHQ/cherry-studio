name: Sign Preview macOS
run-name: Sign Preview macOS for ${{ github.event.workflow_run.display_title }}

on:
  workflow_run:
    workflows:
      - Preview Release
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  discover:
    name: Find macOS signing payload
    if: >-
      github.repository == 'CherryHQ/cherry-studio' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      has_payload: ${{ steps.artifacts.outputs.has_payload }}
    steps:
      - name: Record source artifact identities
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          ARTIFACTS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")"
          MATCHES="$(jq '[.artifacts[] | select(.expired == false and (.name | startswith("cherry-studio-preview-mac-signing-"))) | {id, name, digest}]' <<< "$ARTIFACTS")"
          COUNT="$(jq 'length' <<< "$MATCHES")"

          if [ "$COUNT" -eq 0 ]; then
            echo "has_payload=false" >> "$GITHUB_OUTPUT"
            echo "This preview run did not build macOS."
            exit 0
          fi

          jq . <<< "$MATCHES"
          echo "has_payload=true" >> "$GITHUB_OUTPUT"

  sign:
    name: Sign and notarize macOS preview
    needs: discover
    if: needs.discover.outputs.has_payload == 'true'
    runs-on: macos-latest
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted signing code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install trusted signing dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download exact preview signing payload
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: cherry-studio-preview-mac-signing-*
          path: preview-mac-signing

      - name: Validate preview target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          FIRST_METADATA="$(find preview-mac-signing -type f -name '*.json' | sort | head -n 1)"
          if [ -z "$FIRST_METADATA" ]; then
            echo "No macOS signing metadata was downloaded" >&2
            exit 1
          fi

          SOURCE_SHA="$(jq -r '.sourceSha' "$FIRST_METADATA")"
          PREVIEW_TAG="$(jq -r '.previewTag' "$FIRST_METADATA")"
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$PREVIEW_TAG" =~ ^preview-[A-Za-z0-9._-]+-[0-9a-f]{12}$ ]]; then
            echo "Invalid preview signing metadata" >&2
            exit 1
          fi

          find preview-mac-signing -type f -name '*.json' -print0 | while IFS= read -r -d '' METADATA_FILE; do
            jq -e --arg source_sha "$SOURCE_SHA" --arg preview_tag "$PREVIEW_TAG" \
              '.sourceSha == $source_sha and .previewTag == $preview_tag' "$METADATA_FILE" >/dev/null
          done

          RELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PREVIEW_TAG")"
          jq -e --arg source_sha "$SOURCE_SHA" '.draft == true and .target_commitish == $source_sha' <<< "$RELEASE" >/dev/null
          echo "preview_tag=$PREVIEW_TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Sign, notarize, and package macOS applications
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/release/sign-preview-macos.js preview-mac-signing signed-preview-assets

      - name: Upload signed macOS assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ steps.target.outputs.preview_tag }}
        shell: bash
        run: |
          gh release upload "$PREVIEW_TAG" signed-preview-assets/* --clobber

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PREVIEW_TAG" \
            --jq '.assets[] | select((.name | test("-mac-(x64|arm64)\\.zip\\.blockmap$")) or (.name | test("^preview(-cn)?-mac\\.yml$"))) | .id' |
            while read -r ASSET_ID; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
            done
