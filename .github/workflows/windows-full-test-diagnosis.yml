name: Windows Full Test Diagnosis

on:
  push:
    branches: [codex/windows-full-test-diagnosis]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: main-1
            projects: --project main --shard=1/3
          - group: main-2
            projects: --project main --shard=2/3
          - group: main-3
            projects: --project main --shard=3/3
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v5
      - run: pnpm install
      - run: pnpm rebuild:node
      - name: Run all tests in group
        run: pnpm exec vitest run ${{ matrix.projects }} --maxWorkers=4 --minWorkers=1 --silent --reporter=default --reporter=json --outputFile=test-results.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-test-results-${{ matrix.group }}
          path: test-results.json
          retention-days: 3
