name: BAChat Package

on:
  workflow_dispatch:
  push:
    branches:
      - BAChat

permissions:
  contents: read

concurrency:
  group: bachat-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux-x64-AppImage
            os: ubuntu-latest
            command: pnpm build:linux:x64
            artifact_path: dist/*-x64.AppImage
          - name: Windows-x64-Installer
            os: windows-2022
            command: pnpm build:win:x64
            artifact_path: dist/*-x64-setup.exe
          - name: macOS-arm64-DMG
            os: macos-latest
            command: pnpm build:mac:arm64
            artifact_path: dist/*-arm64.dmg
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_7Z_FILTER: BCJ
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libevdev-dev libxtst-dev libx11-dev libxfixes-dev libwayland-dev

      - name: Set up macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install python-setuptools

      - name: Restore pnpm cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: ${{ matrix.command }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: bachat-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
