name: Windows system speech

on:
  push:
    branches:
      - codex/voice-runtime-foundation
    paths:
      - packages/system-speech/**
      - scripts/packaging/before-pack.js
      - scripts/__tests__/before-pack.test.ts
      - electron-builder.yml
      - .github/workflows/system-speech-windows.yml
      - pnpm-lock.yaml
  pull_request:
    paths:
      - packages/system-speech/**
      - scripts/packaging/before-pack.js
      - scripts/__tests__/before-pack.test.ts
      - electron-builder.yml
      - .github/workflows/system-speech-windows.yml
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v5
      - name: Install dependencies
        # This job builds the helper explicitly and needs no unrelated Electron addon install scripts.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build Windows x64 helper with MSVC and Windows SDK
        run: pnpm --filter @cherrystudio/system-speech build:native -- --arch x64
      - name: Build native client
        run: pnpm --filter @cherrystudio/system-speech build
      - name: Typecheck native client
        run: pnpm --filter @cherrystudio/system-speech typecheck
      - name: Test native client and smoke inspectors
        run: pnpm --filter @cherrystudio/system-speech test
      - name: Test architecture-specific packaged resources
        run: pnpm exec vitest run --project scripts scripts/__tests__/before-pack.test.ts
      - name: Verify stdin JSON protocol without requiring voices
        run: pnpm --filter @cherrystudio/system-speech smoke:windows
      - name: Synthesize real PCM WAV with an installed SAPI voice
        run: pnpm --filter @cherrystudio/system-speech smoke:windows:tts
