name: Pre Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type or exact version (patch / minor / major / x.y.z / x.y.z-beta.N)"
        required: true
        default: "patch"
        type: string

  # Ensure this workflow only runs from the default branch
  # (workflow_dispatch already restricts to branches with write access,
  # but we guard the job to main to prevent accidental runs from feature branches)

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-state
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Dependencies
        run: pnpm install

      - name: Verify published release baseline
        id: release-baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git fetch origin --tags

          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          if ! node -e "const semver = require('semver'); process.exit(semver.valid(process.argv[1]) ? 0 : 1)" "$CURRENT_VERSION"; then
            echo "package.json contains an invalid semantic version: $CURRENT_VERSION" >&2
            exit 1
          fi

          RELEASE_PAGES="$(gh api --paginate --slurp "repos/$REPO/releases?per_page=100")"
          LATEST_PUBLISHED="$(jq -c '
            [.[][] | select(
              .draft == false and
              .published_at != null and
              (.tag_name | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$"))
            )] |
            sort_by(.published_at) | last // empty
          ' <<< "$RELEASE_PAGES")"
          if [ -z "$LATEST_PUBLISHED" ]; then
            echo "No published release exists to use as the preparation baseline" >&2
            exit 1
          fi

          BASELINE_TAG="v$CURRENT_VERSION"
          if [ "$(jq -r '.tag_name' <<< "$LATEST_PUBLISHED")" != "$BASELINE_TAG" ]; then
            echo "main records $BASELINE_TAG, but the latest published release is $(jq -r '.tag_name' <<< "$LATEST_PUBLISHED")" >&2
            echo "Merge the latest Post Release metadata pull request before preparing another release" >&2
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/$BASELINE_TAG" >/dev/null; then
            echo "Published baseline tag $BASELINE_TAG is missing from git" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$BASELINE_TAG" HEAD; then
            MARKER="release-metadata-boundary: $BASELINE_TAG"
            LEGACY_SUBJECT="chore(release): sync $BASELINE_TAG metadata"
            BOUNDARY_SHA=""
            while IFS= read -r COMMIT_SHA; do
              if git show -s --format=%B "$COMMIT_SHA" | grep -Fqx "$MARKER"; then
                BOUNDARY_SHA="$COMMIT_SHA"
                break
              fi
              SUBJECT="$(git show -s --format=%s "$COMMIT_SHA")"
              LEGACY_PREFIX="$LEGACY_SUBJECT (#"
              LEGACY_PR_NUMBER="${SUBJECT#"$LEGACY_PREFIX"}"
              LEGACY_PR_NUMBER="${LEGACY_PR_NUMBER%)}"
              if [ "$SUBJECT" = "$LEGACY_SUBJECT" ] || \
                 { [[ "$SUBJECT" == "$LEGACY_PREFIX"*")" ]] && [[ "$LEGACY_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; }; then
                BOUNDARY_SHA="$COMMIT_SHA"
                break
              fi
            done < <(git log --format=%H HEAD)
            if [ -z "$BOUNDARY_SHA" ]; then
              echo "$BASELINE_TAG is not an ancestor of main and its metadata boundary is missing" >&2
              exit 1
            fi
          fi

          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve requested version
        id: release-version
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.release-baseline.outputs.version }}
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          TARGET_VERSION="$(node <<'NODE'
          const semver = require('semver')
          const currentVersion = process.env.CURRENT_VERSION
          const requestedVersion = process.env.REQUESTED_VERSION.trim()
          const exactVersionPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/

          let targetVersion
          if (['patch', 'minor', 'major'].includes(requestedVersion)) {
            targetVersion = semver.inc(currentVersion, requestedVersion)
          } else if (exactVersionPattern.test(requestedVersion) && semver.valid(requestedVersion)) {
            targetVersion = requestedVersion
          }

          if (!targetVersion) {
            throw new Error(`Invalid release version intent: ${requestedVersion}`)
          }
          if (!semver.gt(targetVersion, currentVersion)) {
            throw new Error(`Release version ${targetVersion} must be greater than ${currentVersion}`)
          }
          process.stdout.write(targetVersion)
          NODE
          )"

          echo "version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ github.event.inputs.version }} to $TARGET_VERSION"

      - name: Prepare Release via Claude
        uses: anthropics/claude-code-action@v1.0.66
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: '--model ${{ vars.ANTHROPIC_MODEL }} --allowed-tools "Bash(git:*),Bash(gh release list:*),Bash(node:*),Bash(cat:*),Bash(pnpm build:builtin-knowledge),Edit,Read,Write,Glob,Grep"'
          prompt: |
            Run the prepare-release skill with exact version argument: ${{ steps.release-version.outputs.version }}

            Read the skill instructions from .agents/skills/prepare-release/SKILL.md and follow them exactly.

            Since this is running in CI (non-interactive), skip all interactive confirmation steps.

            The workflow froze the selected dispatch SHA and owns Step 1 item 1. Do not fetch or compare origin/main. It also completed the tag and published-release checks. Do not repeat those checks, push, or mutate any remote Git state. Local Git operations are temporary because the next step restores the frozen SHA.

            Stop after updating package.json and electron-builder.yml, plus release-history.json only for a stable release. Do not edit the generated product manifest. The next workflow steps validate the contents, generate the manifest, and own release branch creation and the signed commit.
            You may create temporary helper files if needed; the workflow discards every change except those three release metadata files.
        env:
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}

      - name: Retain prepared release metadata
        shell: bash
        env:
          RELEASE_HEAD: ${{ github.sha }}
        run: |
          RELEASE_PATCH="$RUNNER_TEMP/prepared-release.patch"
          git diff --binary --full-index "$RELEASE_HEAD" -- \
            package.json \
            electron-builder.yml \
            resources/cherry-studio/release-history.json > "$RELEASE_PATCH"

          git reset --hard "$RELEASE_HEAD"
          git clean -fd
          if [ -s "$RELEASE_PATCH" ]; then
            git apply "$RELEASE_PATCH"
          fi

      - name: Validate prepared release metadata
        shell: bash
        env:
          REQUESTED_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          node scripts/release/validate-prepared-release.js --target-version "$REQUESTED_VERSION"

      - name: Generate product manifest
        run: pnpm build:builtin-knowledge

      - name: Stage prepared release files
        uses: actions/upload-artifact@v7
        with:
          name: prepared-release-${{ github.sha }}
          path: |
            package.json
            electron-builder.yml
            resources/cherry-studio/release-history.json
            resources/builtin-agents/cherry-assistant/product-manifest.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Create release branch
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install validation dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download prepared release files
        uses: actions/download-artifact@v8
        with:
          name: prepared-release-${{ github.sha }}
          path: ${{ runner.temp }}/prepared-release

      - name: Validate prepared release artifact
        id: release-files
        shell: bash
        env:
          REQUESTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const artifactRoot = path.resolve(process.env.RUNNER_TEMP, 'prepared-release')
          const releaseFiles = [
            'electron-builder.yml',
            'package.json',
            'resources/builtin-agents/cherry-assistant/product-manifest.json',
            'resources/cherry-studio/release-history.json'
          ]

          for (const filePath of releaseFiles) {
            const sourcePath = path.join(artifactRoot, filePath)
            if (!fs.existsSync(sourcePath) || !fs.lstatSync(sourcePath).isFile()) {
              throw new Error(`Prepared release artifact is missing a regular file: ${filePath}`)
            }
            fs.copyFileSync(sourcePath, filePath)
          }
          NODE

          node scripts/release/validate-prepared-release.js --target-version "$REQUESTED_VERSION" --include-generated-manifest

          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const fs = require('node:fs')
          const path = require('node:path')

          const releaseFiles = [
            'electron-builder.yml',
            'package.json',
            'resources/builtin-agents/cherry-assistant/product-manifest.json',
            'resources/cherry-studio/release-history.json'
          ]
          const changedFiles = execFileSync(
            'git',
            ['diff', 'HEAD', '--name-only', '--no-renames', '-z', '--', ...releaseFiles],
            { encoding: 'utf8' }
          ).split('\0').filter(Boolean)
          const additions = changedFiles.map((filePath) => ({
            path: filePath,
            contents: fs.readFileSync(filePath).toString('base64')
          }))
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'prepare-release-files.json'), JSON.stringify(additions))
          NODE

          RELEASE_VERSION="$REQUESTED_VERSION"
          RELEASE_BRANCH="release/v$RELEASE_VERSION"
          echo "branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve release publisher identity
        id: publisher
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB_WRITE }}
        run: |
          AUTHOR_JSON="$(gh api user)"
          echo "name=$(jq -r '.name // .login' <<< "$AUTHOR_JSON")" >> "$GITHUB_OUTPUT"
          echo "email=$(jq -r '"\(.id)+\(.login)@users.noreply.github.com"' <<< "$AUTHOR_JSON")" >> "$GITHUB_OUTPUT"

      - name: Create release commit payload
        id: release-commit
        shell: bash
        env:
          RELEASE_BRANCH: ${{ steps.release-files.outputs.branch }}
          RELEASE_HEAD: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.release-files.outputs.version }}
          REPO: ${{ github.repository }}
          SIGNOFF_EMAIL: ${{ steps.publisher.outputs.email }}
          SIGNOFF_NAME: ${{ steps.publisher.outputs.name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const additions = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'prepare-release-files.json')))
          const payload = {
            query: `mutation($input: CreateCommitOnBranchInput!) {
              createCommitOnBranch(input: $input) {
                commit { oid url }
              }
            }`,
            variables: {
              input: {
                branch: {
                  repositoryNameWithOwner: process.env.REPO,
                  branchName: process.env.RELEASE_BRANCH
                },
                expectedHeadOid: process.env.RELEASE_HEAD,
                message: {
                  headline: `chore(release): prepare v${process.env.RELEASE_VERSION}`,
                  body: `Signed-off-by: ${process.env.SIGNOFF_NAME} <${process.env.SIGNOFF_EMAIL}>`
                },
                fileChanges: { additions }
              }
            }
          }

          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'prepare-release-commit.json'), JSON.stringify(payload))
          NODE

          echo "branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create signed release commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB_WRITE }}
          REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ steps.release-commit.outputs.branch }}
          RELEASE_HEAD: ${{ github.sha }}
          SIGNOFF_EMAIL: ${{ steps.publisher.outputs.email }}
          SIGNOFF_NAME: ${{ steps.publisher.outputs.name }}
        run: |
          TARGET_TAG="${RELEASE_BRANCH#release/}"
          gh api --paginate --slurp "repos/$REPO/releases?per_page=100" | \
            TAG="$TARGET_TAG" node scripts/release/validate-release-state.js prepare

          if gh api "repos/$REPO/git/ref/heads/$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "Release branch $RELEASE_BRANCH already exists" >&2
            exit 1
          fi

          gh api --method POST "repos/$REPO/git/refs" \
            -f ref="refs/heads/$RELEASE_BRANCH" \
            -f sha="$RELEASE_HEAD" >/dev/null

          COMMIT_SHA=""
          cleanup_release_branch() {
            STATUS=$?
            trap - EXIT
            CURRENT_SHA="$(gh api "repos/$REPO/git/ref/heads/$RELEASE_BRANCH" --jq '.object.sha' 2>/dev/null || true)"
            if [ "$CURRENT_SHA" = "$RELEASE_HEAD" ] || { [ -n "$COMMIT_SHA" ] && [ "$CURRENT_SHA" = "$COMMIT_SHA" ]; }; then
              gh api --method DELETE "repos/$REPO/git/refs/heads/$RELEASE_BRANCH" >/dev/null || true
            else
              echo "Refusing to clean up $RELEASE_BRANCH because it moved unexpectedly" >&2
            fi
            exit "$STATUS"
          }
          trap cleanup_release_branch EXIT

          RESPONSE="$(gh api graphql --input "$RUNNER_TEMP/prepare-release-commit.json")"
          COMMIT_SHA="$(jq -r '.data.createCommitOnBranch.commit.oid' <<< "$RESPONSE")"
          COMMIT_URL="$(jq -r '.data.createCommitOnBranch.commit.url' <<< "$RESPONSE")"
          COMMIT_JSON="$(gh api "repos/$REPO/commits/$COMMIT_SHA")"
          VERIFIED="$(jq -r '.commit.verification.verified' <<< "$COMMIT_JSON")"

          if [ "$VERIFIED" != "true" ]; then
            echo "Release commit $COMMIT_SHA was not verified" >&2
            exit 1
          fi

          if ! jq -r '.commit.message' <<< "$COMMIT_JSON" | grep -Fqx "Signed-off-by: $SIGNOFF_NAME <$SIGNOFF_EMAIL>"; then
            echo "Release commit $COMMIT_SHA is missing the expected DCO sign-off" >&2
            exit 1
          fi

          trap - EXIT
          echo "Created $RELEASE_BRANCH at $COMMIT_URL"
