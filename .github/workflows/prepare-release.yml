name: Pre Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type or exact version (patch / minor / major / x.y.z / x.y.z-beta.N)"
        required: true
        default: "patch"
        type: string

  # Ensure this workflow only runs from the default branch
  # (workflow_dispatch already restricts to branches with write access,
  # but we guard the job to main to prevent accidental runs from feature branches)

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Dependencies
        run: pnpm install

      - name: Resolve requested version
        id: release-version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          TARGET_VERSION="$(node <<'NODE'
          const semver = require('semver')
          const currentVersion = require('./package.json').version
          const requestedVersion = process.env.REQUESTED_VERSION.trim()
          const exactVersionPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/

          let targetVersion
          if (['patch', 'minor', 'major'].includes(requestedVersion)) {
            targetVersion = semver.inc(currentVersion, requestedVersion)
          } else if (exactVersionPattern.test(requestedVersion) && semver.valid(requestedVersion)) {
            targetVersion = requestedVersion
          }

          if (!targetVersion) {
            throw new Error(`Invalid release version intent: ${requestedVersion}`)
          }
          process.stdout.write(targetVersion)
          NODE
          )"

          echo "version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ github.event.inputs.version }} to $TARGET_VERSION"

      - name: Verify release slot is available
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB_WRITE }}
          REPO: ${{ github.repository }}
        run: |
          RELEASE_PAGES="$(gh api --paginate --slurp "repos/$REPO/releases?per_page=100")"
          RELEASE_REFS="$(gh api "repos/$REPO/git/matching-refs/heads/release/v")"
          DRAFT_TAGS="$(jq -r '.[][] | select(.draft == true) | .tag_name' <<< "$RELEASE_PAGES")"
          ACTIVE_RELEASES=()
          while IFS= read -r TAG; do
            if [ -z "$TAG" ]; then
              continue
            fi

            if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              continue
            fi

            if jq -e --arg ref "refs/heads/release/$TAG" 'any(.[]; .ref == $ref)' <<< "$RELEASE_REFS" >/dev/null; then
              ACTIVE_RELEASES+=("$TAG")
            fi
          done <<< "$DRAFT_TAGS"

          if [ "${#ACTIVE_RELEASES[@]}" -ne 0 ]; then
            RELEASES="$(IFS=', '; echo "${ACTIVE_RELEASES[*]}")"
            echo "Finish or abandon the active release before preparing another one: $RELEASES" >&2
            exit 1
          fi

      - name: Prepare Release via Claude
        uses: anthropics/claude-code-action@v1.0.66
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.TOKEN_GITHUB_WRITE }}
          claude_args: '--model ${{ vars.ANTHROPIC_MODEL }} --allowed-tools "Bash(git:*),Bash(gh release list:*),Bash(cat:*),Bash(pnpm build:builtin-knowledge),Edit,Read,Write,Glob,Grep"'
          prompt: |
            Run the prepare-release skill with exact version argument: ${{ steps.release-version.outputs.version }}

            Read the skill instructions from .agents/skills/prepare-release/SKILL.md and follow them exactly.

            Since this is running in CI (non-interactive), skip all interactive confirmation steps.

            Stop after generating the four allowed release files. Leave the changes uncommitted; the next workflow steps own release branch creation and the signed commit.
        env:
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}

      - name: Prepare release commit payload
        id: release-commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB_WRITE }}
          REPO: ${{ github.repository }}
          RELEASE_HEAD: ${{ github.sha }}
          REQUESTED_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$RELEASE_HEAD" ]; then
            echo "Claude must not create a local release commit" >&2
            exit 1
          fi

          RELEASE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_VERSION" != "$REQUESTED_VERSION" ]; then
            echo "Prepared version $RELEASE_VERSION does not match requested version $REQUESTED_VERSION" >&2
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Prepared version is not a supported semantic version: $RELEASE_VERSION" >&2
            exit 1
          fi

          RELEASE_BRANCH="release/v$RELEASE_VERSION"
          AUTHOR_JSON="$(gh api user)"
          export RELEASE_VERSION RELEASE_BRANCH
          export SIGNOFF_NAME="$(jq -r '.name // .login' <<< "$AUTHOR_JSON")"
          export SIGNOFF_EMAIL="$(jq -r '"\(.id)+\(.login)@users.noreply.github.com"' <<< "$AUTHOR_JSON")"

          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const fs = require('node:fs')
          const path = require('node:path')

          const allowedFiles = new Set([
            'package.json',
            'electron-builder.yml',
            'resources/cherry-studio/release-history.json',
            'resources/builtin-agents/cherry-assistant/product-manifest.json'
          ])
          const statusEntries = execFileSync(
            'git',
            ['status', '--porcelain=v1', '-z', '--untracked-files=all'],
            { encoding: 'utf8' }
          ).split('\0').filter(Boolean)
          const changedFiles = []

          for (const entry of statusEntries) {
            const status = entry.slice(0, 2)
            const filePath = entry.slice(3)
            if (status.includes('R') || status.includes('C')) {
              throw new Error(`Release preparation must not rename or copy files: ${filePath}`)
            }
            if (status.includes('D')) {
              throw new Error(`Release preparation must not delete files: ${filePath}`)
            }
            if (!allowedFiles.has(filePath)) {
              throw new Error(`Unexpected release preparation change: ${filePath}`)
            }
            if (!fs.lstatSync(filePath).isFile()) {
              throw new Error(`Release preparation change is not a regular file: ${filePath}`)
            }
            changedFiles.push(filePath)
          }

          if (changedFiles.length === 0) {
            throw new Error('Release preparation produced no changes')
          }

          changedFiles.sort()
          const additions = changedFiles.map((filePath) => ({
            path: filePath,
            contents: fs.readFileSync(filePath).toString('base64')
          }))
          const payload = {
            query: `mutation($input: CreateCommitOnBranchInput!) {
              createCommitOnBranch(input: $input) {
                commit { oid url }
              }
            }`,
            variables: {
              input: {
                branch: {
                  repositoryNameWithOwner: process.env.REPO,
                  branchName: process.env.RELEASE_BRANCH
                },
                expectedHeadOid: process.env.RELEASE_HEAD,
                message: {
                  headline: `chore(release): prepare v${process.env.RELEASE_VERSION}`,
                  body: `Signed-off-by: ${process.env.SIGNOFF_NAME} <${process.env.SIGNOFF_EMAIL}>`
                },
                fileChanges: { additions }
              }
            }
          }

          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'prepare-release-commit.json'), JSON.stringify(payload))
          NODE

          echo "branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create signed release commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB_WRITE }}
          REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ steps.release-commit.outputs.branch }}
          RELEASE_HEAD: ${{ github.sha }}
        run: |
          if gh api "repos/$REPO/git/ref/heads/$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "Release branch $RELEASE_BRANCH already exists" >&2
            exit 1
          fi

          gh api --method POST "repos/$REPO/git/refs" \
            -f ref="refs/heads/$RELEASE_BRANCH" \
            -f sha="$RELEASE_HEAD" >/dev/null

          COMMIT_SHA=""
          cleanup_release_branch() {
            STATUS=$?
            trap - EXIT
            CURRENT_SHA="$(gh api "repos/$REPO/git/ref/heads/$RELEASE_BRANCH" --jq '.object.sha' 2>/dev/null || true)"
            if [ "$CURRENT_SHA" = "$RELEASE_HEAD" ] || { [ -n "$COMMIT_SHA" ] && [ "$CURRENT_SHA" = "$COMMIT_SHA" ]; }; then
              gh api --method DELETE "repos/$REPO/git/refs/heads/$RELEASE_BRANCH" >/dev/null || true
            else
              echo "Refusing to clean up $RELEASE_BRANCH because it moved unexpectedly" >&2
            fi
            exit "$STATUS"
          }
          trap cleanup_release_branch EXIT

          RESPONSE="$(gh api graphql --input "$RUNNER_TEMP/prepare-release-commit.json")"
          COMMIT_SHA="$(jq -r '.data.createCommitOnBranch.commit.oid' <<< "$RESPONSE")"
          COMMIT_URL="$(jq -r '.data.createCommitOnBranch.commit.url' <<< "$RESPONSE")"
          COMMIT_JSON="$(gh api "repos/$REPO/commits/$COMMIT_SHA")"
          VERIFIED="$(jq -r '.commit.verification.verified' <<< "$COMMIT_JSON")"
          AUTHOR_JSON="$(gh api user)"
          SIGNOFF_NAME="$(jq -r '.name // .login' <<< "$AUTHOR_JSON")"
          SIGNOFF_EMAIL="$(jq -r '"\(.id)+\(.login)@users.noreply.github.com"' <<< "$AUTHOR_JSON")"

          if [ "$VERIFIED" != "true" ]; then
            echo "Release commit $COMMIT_SHA was not verified" >&2
            exit 1
          fi

          if ! jq -r '.commit.message' <<< "$COMMIT_JSON" | grep -Fqx "Signed-off-by: $SIGNOFF_NAME <$SIGNOFF_EMAIL>"; then
            echo "Release commit $COMMIT_SHA is missing the expected DCO sign-off" >&2
            exit 1
          fi

          trap - EXIT
          echo "Created $RELEASE_BRANCH at $COMMIT_URL"
