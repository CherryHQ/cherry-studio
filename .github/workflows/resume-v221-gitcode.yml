name: Resume v2.2.1 GitCode sync
on:
  push:
    branches: [codex/backfill-v221-cos]
    paths: [.github/workflows/resume-v221-gitcode.yml]
permissions:
  actions: read
  contents: read
concurrency:
  group: gitcode-sync-v2.2.1
  cancel-in-progress: false
jobs:
  sync-only:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TAG: v2.2.1
      SOURCE_RUN_ID: "43229565814"
      GH_REPO: CherryHQ/cherry-studio
      GH_TOKEN: ${{ github.token }}
      RELEASE_FROM_COS: "true"
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_OWNER: ${{ vars.GITCODE_OWNER }}
      GITCODE_REPO: ${{ vars.GITCODE_REPO }}
      GITCODE_API_URL: ${{ vars.GITCODE_API_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install cos-python-sdk-v5==1.9.44
      - name: Verify source publish and read COS inventory
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/jobs?filter=all&per_page=100" |
            jq -es 'any(.[].jobs[]; .name == "Publish approved release" and .conclusion == "success")' >/dev/null
          python scripts/release/release-cos.py prepare-sync
      - name: Sync with bounded GitCode PUTs
        run: |
          set -euo pipefail
          sed -i 's/--max-time 3600 -X PUT/--max-time 180 --speed-limit 32768 --speed-time 45 -H "Expect:" -w "%{stderr}PUT HTTP %{http_code} DNS %{time_namelookup}s TCP %{time_connect}s TLS %{time_appconnect}s uploaded %{size_upload} bytes total %{time_total}s\\n" -X PUT/' scripts/release/sync-gitcode.sh
          bash scripts/release/sync-gitcode.sh
