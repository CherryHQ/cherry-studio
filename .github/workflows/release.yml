name: Release
run-name: Release ${{ inputs.operation }} ${{ inputs.platform }} ${{ github.ref_name }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Release operation"
        required: true
        default: "build"
        type: choice
        options:
          - build
          - publish
      platform:
        description: "Build platform"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - mac
          - linux

concurrency:
  group: release-state
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  prepare:
    name: Prepare release ref
    if: github.repository == 'CherryHQ/cherry-studio'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-ref.outputs.tag }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate release branch and version
        id: release-ref
        shell: bash
        run: |
          export LC_ALL=C
          BRANCH="${GITHUB_REF_NAME}"
          TAG="${BRANCH#release/}"

          if [ "$GITHUB_REF_TYPE" != "branch" ] || [[ "$BRANCH" != release/v* ]]; then
            echo "Release must run from a release/v<semver> branch, not $GITHUB_REF" >&2
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release branch: $BRANCH" >&2
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Branch $BRANCH does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify release commit passed CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CI_RUN="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" \
            -f event=push \
            -f status=completed \
            -F per_page=100 \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0] // empty')"

          if [ -z "$CI_RUN" ]; then
            echo "No successful CI push run found for release commit $GITHUB_SHA" >&2
            exit 1
          fi

          if [ "$(jq -r '.head_sha' <<< "$CI_RUN")" != "$GITHUB_SHA" ] || \
             [ "$(jq -r '.event' <<< "$CI_RUN")" != "push" ] || \
             [ "$(jq -r '.status' <<< "$CI_RUN")" != "completed" ] || \
             [ "$(jq -r '.conclusion' <<< "$CI_RUN")" != "success" ]; then
            echo "CI result did not match the exact release commit" >&2
            exit 1
          fi

          echo "Verified successful CI run: $(jq -r '.html_url' <<< "$CI_RUN")"

      - name: Validate and update release state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ github.event.inputs.operation }}
          PUBLISH_TOKEN: ${{ secrets.TOKEN_GITHUB_WRITE }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release-ref.outputs.tag }}
        run: |
          BRANCH="$GITHUB_REF_NAME"
          RELEASE_PAGES="$(gh api --paginate --slurp "repos/$REPO/releases?per_page=100")"
          RELEASE="$(jq -c --arg tag "$TAG" '
            [.[][] | select(.tag_name == $tag)] |
            if length > 1 then error("multiple releases use tag " + $tag)
            elif length == 1 then .[0]
            else empty
            end
          ' <<< "$RELEASE_PAGES")"

          if [ "$OPERATION" = "publish" ]; then
            TAG_SHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            BRANCH_SHA="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
            OPEN_RELEASE_PRS="$(gh pr list --repo "$REPO" --base "$BRANCH" --state open --limit 1000 --json url --jq '.[].url')"
            EXPECTED_BUILD="Release build all $BRANCH @ $GITHUB_SHA"
            RELEASE_RUNS="$(gh api --paginate --slurp "repos/$REPO/actions/workflows/release.yml/runs?head_sha=$GITHUB_SHA&event=workflow_dispatch&status=completed&per_page=100")"
            BUILD_RUN="$(jq -c --arg title "$EXPECTED_BUILD" '
              [.[] | .workflow_runs[] | select(.display_title == $title and .conclusion == "success")][0] // empty
            ' <<< "$RELEASE_RUNS")"
            BRANCH_SHA="$BRANCH_SHA" \
            BUILD_RUN_JSON="$BUILD_RUN" \
            EXPECTED_BUILD_TITLE="$EXPECTED_BUILD" \
            OPEN_RELEASE_PULL_REQUESTS="$OPEN_RELEASE_PRS" \
            RELEASE_JSON="$RELEASE" \
            TAG="$TAG" \
            TAG_SHA="$TAG_SHA" \
            WORKFLOW_SHA="$GITHUB_SHA" \
              node scripts/release/validate-release-state.js publish

            RELEASE="$(gh api "repos/$REPO/releases/$(jq -r '.id' <<< "$RELEASE")")"
            TAG_SHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            BRANCH_SHA="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
            OPEN_RELEASE_PRS="$(gh pr list --repo "$REPO" --base "$BRANCH" --state open --limit 1000 --json url --jq '.[].url')"
            BRANCH_SHA="$BRANCH_SHA" \
            BUILD_RUN_JSON="$BUILD_RUN" \
            EXPECTED_BUILD_TITLE="$EXPECTED_BUILD" \
            OPEN_RELEASE_PULL_REQUESTS="$OPEN_RELEASE_PRS" \
            RELEASE_JSON="$RELEASE" \
            TAG="$TAG" \
            TAG_SHA="$TAG_SHA" \
            WORKFLOW_SHA="$GITHUB_SHA" \
              node scripts/release/validate-release-state.js publish

            GH_TOKEN="$PUBLISH_TOKEN" gh release edit "$TAG" --repo "$REPO" --draft=false --verify-tag
            if [ "$(gh api "repos/$REPO/releases/$(jq -r '.id' <<< "$RELEASE")" --jq '.draft')" != "false" ]; then
              echo "Release $TAG was not published" >&2
              exit 1
            fi
            exit 0
          fi

          REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')"
          RELEASE_JSON="$RELEASE" \
          REMOTE_TAG_SHA="$REMOTE_TAG_SHA" \
          TAG="$TAG" \
          WORKFLOW_SHA="$GITHUB_SHA" \
            node scripts/release/validate-release-state.js build-start

          git tag --force "$TAG" "$GITHUB_SHA"
          git push --force-with-lease="refs/tags/$TAG:$REMOTE_TAG_SHA" origin "refs/tags/$TAG"

          CURRENT_RELEASE_PAGES="$(gh api --paginate --slurp "repos/$REPO/releases?per_page=100")"
          CURRENT_RELEASE="$(jq -c --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)][0] // empty' <<< "$CURRENT_RELEASE_PAGES")"
          RELEASE_JSON="$CURRENT_RELEASE" TAG="$TAG" node scripts/release/validate-release-state.js build-completion

  release:
    needs: prepare
    if: github.event.inputs.operation == 'build'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ${{ fromJSON(
          github.event.inputs.platform == 'all' && '["macos-latest", "windows-latest", "ubuntu-latest"]' ||
          github.event.inputs.platform == 'linux' && '["ubuntu-latest"]' ||
          github.event.inputs.platform == 'windows' && '["windows-latest"]' ||
          github.event.inputs.platform == 'mac' && '["macos-latest"]' ||
          '["macos-latest", "windows-latest", "ubuntu-latest"]'
          ) }}
      fail-fast: false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: macos-latest dependencies fix
        if: matrix.os == 'macos-latest'
        run: |
          brew install python-setuptools

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y rpm libevdev-dev libxtst-dev libx11-dev libxfixes-dev libwayland-dev
          pnpm build:linux

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_CHERRYAI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRYAI_CLIENT_SECRET }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}

      - name: Build Mac
        if: matrix.os == 'macos-latest'
        run: |
          sudo -H pip install setuptools
          pnpm build:mac
        env:
          CSC_FOR_PULL_REQUEST: true
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_CHERRYAI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRYAI_CLIENT_SECRET }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          pnpm build:win
        env:
          ELECTRON_BUILDER_7Z_FILTER: BCJ
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_CHERRYAI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRYAI_CLIENT_SECRET }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          updateOnlyUnreleased: true
          makeLatest: false
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          tag: ${{ needs.prepare.outputs.tag }}
          artifacts: "dist/*.exe,dist/*.zip,dist/*.dmg,dist/*.AppImage,dist/*.snap,dist/*.deb,dist/*.rpm,dist/*.tar.gz,dist/latest*.yml,dist/rc*.yml,dist/beta*.yml,dist/*.blockmap${{ matrix.os == 'ubuntu-latest' && !contains(needs.prepare.outputs.tag, '-') && ',resources/cherry-studio/release-history.json' || '' }}"
          token: ${{ secrets.GITHUB_TOKEN }}
