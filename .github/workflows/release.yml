name: Release
run-name: Release build ${{ inputs.platform }} ${{ github.ref_name }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Build platform"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - mac
          - linux

concurrency:
  group: release-state
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  prepare:
    name: Prepare release ref
    if: github.repository == 'CherryHQ/cherry-studio'
    runs-on: ubuntu-latest
    outputs:
      remote-tag-sha: ${{ steps.release-state.outputs.remote-tag-sha }}
      tag: ${{ steps.release-ref.outputs.tag }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate release branch and version
        id: release-ref
        shell: bash
        run: |
          export LC_ALL=C
          BRANCH="${GITHUB_REF_NAME}"
          TAG="${BRANCH#release/}"

          if [ "$GITHUB_REF_TYPE" != "branch" ] || [[ "$BRANCH" != release/v* ]]; then
            echo "Release must run from a release/v<semver> branch, not $GITHUB_REF" >&2
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release branch: $BRANCH" >&2
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Branch $BRANCH does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify release commit passed CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CI_RUN="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" \
            -f event=push \
            -f status=completed \
            -F per_page=100 \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0] // empty')"

          if [ -z "$CI_RUN" ]; then
            echo "No successful CI push run found for release commit $GITHUB_SHA" >&2
            exit 1
          fi

          if [ "$(jq -r '.head_sha' <<< "$CI_RUN")" != "$GITHUB_SHA" ] || \
             [ "$(jq -r '.event' <<< "$CI_RUN")" != "push" ] || \
             [ "$(jq -r '.status' <<< "$CI_RUN")" != "completed" ] || \
             [ "$(jq -r '.conclusion' <<< "$CI_RUN")" != "success" ]; then
            echo "CI result did not match the exact release commit" >&2
            exit 1
          fi

          echo "Verified successful CI run: $(jq -r '.html_url' <<< "$CI_RUN")"

      - name: Validate and update release state
        id: release-state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release-ref.outputs.tag }}
        run: |
          BRANCH="$GITHUB_REF_NAME"
          RELEASE_PAGES="$(gh api --paginate --slurp "repos/$REPO/releases?per_page=100")"
          RELEASE="$(jq -c --arg tag "$TAG" '
            [.[][] | select(.tag_name == $tag)] |
            .[0] // empty
          ' <<< "$RELEASE_PAGES")"

          BRANCH_SHA="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
          REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')"
          echo "remote-tag-sha=$REMOTE_TAG_SHA" >> "$GITHUB_OUTPUT"
          BRANCH_SHA="$BRANCH_SHA" \
          PLATFORM="${{ github.event.inputs.platform }}" \
          RELEASE_JSON="$RELEASE" \
          REMOTE_TAG_SHA="$REMOTE_TAG_SHA" \
          TAG="$TAG" \
          WORKFLOW_SHA="$GITHUB_SHA" \
            node scripts/release/validate-release-state.js build-start

  release:
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      matrix:
        os: ${{ fromJSON(
          github.event.inputs.platform == 'all' && '["macos-latest", "windows-latest", "ubuntu-latest"]' ||
          github.event.inputs.platform == 'linux' && '["ubuntu-latest"]' ||
          github.event.inputs.platform == 'windows' && '["windows-latest"]' ||
          github.event.inputs.platform == 'mac' && '["macos-latest"]' ||
          '["macos-latest", "windows-latest", "ubuntu-latest"]'
          ) }}
      fail-fast: false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: macos-latest dependencies fix
        if: matrix.os == 'macos-latest'
        run: |
          brew install python-setuptools

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y rpm libevdev-dev libxtst-dev libx11-dev libxfixes-dev libwayland-dev
          pnpm build:linux

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_CHERRYAI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRYAI_CLIENT_SECRET }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}

      - name: Build Mac
        if: matrix.os == 'macos-latest'
        run: |
          sudo -H pip install setuptools
          pnpm build:mac
        env:
          CSC_FOR_PULL_REQUEST: true
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_CHERRYAI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRYAI_CLIENT_SECRET }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          pnpm build:win
        env:
          ELECTRON_BUILDER_7Z_FILTER: BCJ
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_CHERRYAI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRYAI_CLIENT_SECRET }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}

      - name: Stage Windows release artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.prepare.outputs.tag }}-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/latest*.yml
            dist/rc*.yml
            dist/beta*.yml
            dist/*.blockmap
          if-no-files-found: error
          compression-level: 0

      - name: Stage macOS release artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.prepare.outputs.tag }}-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/latest*.yml
            dist/rc*.yml
            dist/beta*.yml
            dist/*.blockmap
          if-no-files-found: error
          compression-level: 0

      - name: Stage Linux release artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.prepare.outputs.tag }}-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/latest*.yml
            dist/rc*.yml
            dist/beta*.yml
            dist/*.blockmap
          if-no-files-found: error
          compression-level: 0

      - name: Stage stable release history
        if: matrix.os == 'ubuntu-latest' && !contains(needs.prepare.outputs.tag, '-')
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.prepare.outputs.tag }}-history
          path: resources/cherry-studio/release-history.json
          if-no-files-found: error

  finalize-build:
    name: Update draft release
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download existing draft artifacts
        if: github.event.inputs.platform != 'all'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release download "$TAG" --dir existing-release-artifacts

      - name: Download selected release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-${{ needs.prepare.outputs.tag }}-*
          path: selected-release-artifacts
          merge-multiple: true

      - name: Assemble complete release artifacts
        shell: bash
        run: |
          mkdir release-artifacts
          if [ -d existing-release-artifacts ]; then
            cp -R existing-release-artifacts/. release-artifacts/
          fi
          cp -R selected-release-artifacts/. release-artifacts/

      - name: Revalidate current release head
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          BRANCH_SHA="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
          BRANCH_SHA="$BRANCH_SHA" TAG="$TAG" WORKFLOW_SHA="$GITHUB_SHA" \
            node scripts/release/validate-release-state.js build-completion

      - name: Prepare bilingual release notes
        shell: bash
        run: |
          node scripts/release/compose-release-body.js \
            electron-builder.yml \
            - \
            "$RUNNER_TEMP/release-body.md"

      - name: Create or update draft release
        id: draft-release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "release-artifacts/*"
          bodyFile: ${{ runner.temp }}/release-body.md
          commit: ${{ github.sha }}
          draft: true
          makeLatest: false
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          replacesArtifacts: true
          tag: ${{ needs.prepare.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          updateOnlyUnreleased: true

      - name: Validate uploaded draft
        id: uploaded-draft
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft-release.outputs.id }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          RELEASE="$(gh api "repos/$REPO/releases/$RELEASE_ID")"
          BRANCH_SHA="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
          BRANCH_SHA="$BRANCH_SHA" RELEASE_JSON="$RELEASE" TAG="$TAG" WORKFLOW_SHA="$GITHUB_SHA" \
            node scripts/release/validate-release-state.js build-completion

      - name: Move draft tag with lease after artifact upload
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          EXPECTED_TAG_SHA: ${{ needs.prepare.outputs.remote-tag-sha }}
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ github.event.inputs.platform }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.draft-release.outputs.id }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          RELEASE="$(gh api "repos/$REPO/releases/$RELEASE_ID")"
          BRANCH_SHA="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
          BRANCH_SHA="$BRANCH_SHA" RELEASE_JSON="$RELEASE" TAG="$TAG" WORKFLOW_SHA="$GITHUB_SHA" \
            node scripts/release/validate-release-state.js build-completion

          REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')"
          if [ "$PLATFORM" = "all" ]; then
            if [ -z "$EXPECTED_TAG_SHA" ]; then
              if [ -z "$REMOTE_TAG_SHA" ]; then
                gh api --method POST "repos/$REPO/git/refs" \
                  -f ref="refs/tags/$TAG" \
                  -f sha="$GITHUB_SHA" >/dev/null
              elif [ "$REMOTE_TAG_SHA" != "$GITHUB_SHA" ]; then
                echo "Tag $TAG was created at $REMOTE_TAG_SHA during artifact upload" >&2
                exit 1
              fi
            elif [ "$REMOTE_TAG_SHA" != "$EXPECTED_TAG_SHA" ]; then
              echo "Tag $TAG moved from $EXPECTED_TAG_SHA to $REMOTE_TAG_SHA during the build" >&2
              exit 1
            elif [ "$REMOTE_TAG_SHA" != "$GITHUB_SHA" ]; then
              REPOSITORY_ID="$(gh api "repos/$REPO" --jq '.node_id')"
              jq -n \
                --arg repositoryId "$REPOSITORY_ID" \
                --arg name "refs/tags/$TAG" \
                --arg beforeOid "$EXPECTED_TAG_SHA" \
                --arg afterOid "$GITHUB_SHA" \
                '{
                  query: "mutation($input: UpdateRefsInput!) { updateRefs(input: $input) { clientMutationId } }",
                  variables: {
                    input: {
                      repositoryId: $repositoryId,
                      refUpdates: [{
                        name: $name,
                        beforeOid: $beforeOid,
                        afterOid: $afterOid,
                        force: true
                      }]
                    }
                  }
                }' > "$RUNNER_TEMP/move-release-tag.json"
              gh api graphql --input "$RUNNER_TEMP/move-release-tag.json" >/dev/null
            fi
          elif [ "$REMOTE_TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "Single-platform retries must not move $TAG away from its existing release commit" >&2
            exit 1
          fi

          FINAL_TAG_SHA="$(git ls-remote origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')"
          if [ "$FINAL_TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "Tag $TAG does not point to $GITHUB_SHA after draft finalization" >&2
            exit 1
          fi
          FINAL_RELEASE="$(gh api "repos/$REPO/releases/$RELEASE_ID")"
          BRANCH_SHA="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
          BRANCH_SHA="$BRANCH_SHA" RELEASE_JSON="$FINAL_RELEASE" TAG="$TAG" WORKFLOW_SHA="$GITHUB_SHA" \
            node scripts/release/validate-release-state.js build-completion
          if [ "$(jq -r '.draft' <<< "$FINAL_RELEASE")" != "true" ]; then
            echo "Release $TAG was published while the build was finalizing" >&2
            exit 1
          fi

      - name: Add generated changes to release notes
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft-release.outputs.id }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh api --method POST "repos/$REPO/releases/generate-notes" \
            -f tag_name="$TAG" \
            --jq '.body' > "$RUNNER_TEMP/generated-release-notes.md"
          node scripts/release/compose-release-body.js \
            electron-builder.yml \
            "$RUNNER_TEMP/generated-release-notes.md" \
            "$RUNNER_TEMP/release-body.md"
          jq -Rs '{body: .}' < "$RUNNER_TEMP/release-body.md" > "$RUNNER_TEMP/release-body.json"
          RELEASE="$(gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" \
            --input "$RUNNER_TEMP/release-body.json")"
          BRANCH_SHA="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
          BRANCH_SHA="$BRANCH_SHA" RELEASE_JSON="$RELEASE" TAG="$TAG" WORKFLOW_SHA="$GITHUB_SHA" \
            node scripts/release/validate-release-state.js build-completion
          if [ -z "$(jq -r '.body // empty' <<< "$RELEASE")" ]; then
            echo "Draft release $TAG has no release notes" >&2
            exit 1
          fi
