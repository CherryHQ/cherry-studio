name: Diagnose v2.2.1 COS download
on:
  push:
    branches: [codex/backfill-v221-cos]
    paths: [.github/workflows/diagnose-v221-cos.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TAG: v2.2.1
      SOURCE_RUN_ID: "43229565814"
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install cos-python-sdk-v5==1.9.44
      - name: Time COS download of first GitCode attachment
        run: |
          set -eu
          python -u scripts/release/release-cos.py prepare-sync
          asset=$(grep -vE '\.(yml|yaml|json)$' release-assets.txt | head -1)
          echo "Testing COS read for $asset"
          time timeout 150 python -u scripts/release/release-cos.py get-asset "$asset" "$RUNNER_TEMP/first-attachment"
          stat --format '%s bytes read successfully' "$RUNNER_TEMP/first-attachment"
