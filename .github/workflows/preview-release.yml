name: Preview Release
run-name: Preview Release ${{ inputs.platform }} from ${{ inputs.branch }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Repository branch to build"
        required: true
        default: "main"
      platform:
        description: "Build platform"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - mac
          - linux

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve preview branch
    if: github.repository == 'CherryHQ/cherry-studio'
    runs-on: ubuntu-latest
    outputs:
      asset_sha: ${{ steps.source.outputs.asset_sha }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Resolve source branch
        id: source
        shell: bash
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git check-ref-format --branch "$BRANCH"

          REMOTE_REF="$(git ls-remote --refs "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$BRANCH")"
          if [ -z "$REMOTE_REF" ]; then
            echo "Branch $BRANCH does not exist in $GITHUB_REPOSITORY" >&2
            exit 1
          fi

          SOURCE_SHA="${REMOTE_REF%%[[:space:]]*}"
          echo "asset_sha=${SOURCE_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved $BRANCH to $SOURCE_SHA"

  build:
    name: Build preview ${{ matrix.edition }} (${{ matrix.os }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        edition: [global, cn]
        os: ${{ fromJSON(
          inputs.platform == 'all' && '["macos-latest", "windows-latest", "ubuntu-latest"]' ||
          inputs.platform == 'linux' && '["ubuntu-latest"]' ||
          inputs.platform == 'windows' && '["windows-latest"]' ||
          inputs.platform == 'mac' && '["macos-latest"]' ||
          '["macos-latest", "windows-latest", "ubuntu-latest"]'
          ) }}

    steps:
      - name: Check out preview commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: macos-latest dependencies fix
        if: matrix.os == 'macos-latest'
        run: brew install python-setuptools

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Set preview version
        shell: bash
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version.split('-')[0]")"
          PREVIEW_VERSION="$BASE_VERSION-preview-${{ needs.resolve.outputs.asset_sha }}"
          npm version "$PREVIEW_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          echo "Building preview version $PREVIEW_VERSION from ${{ needs.resolve.outputs.source_sha }}"

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y rpm libevdev-dev libxtst-dev libx11-dev libxfixes-dev libwayland-dev
          pnpm ${{ matrix.edition == 'cn' && 'build:linux:cn' || 'build:linux' }} --publish never
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_CHERRY_CLOUD_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRY_CLOUD_CLIENT_SECRET }}

      - name: Build Mac
        if: matrix.os == 'macos-latest'
        run: |
          sudo -H pip install setuptools
          pnpm ${{ matrix.edition == 'cn' && 'build:mac:cn' || 'build:mac' }} --publish never
        env:
          CSC_FOR_PULL_REQUEST: true
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_CHERRY_CLOUD_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRY_CLOUD_CLIENT_SECRET }}
          MAIN_VITE_CHERRYAI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRYAI_CLIENT_SECRET }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: pnpm ${{ matrix.edition == 'cn' && 'build:win:cn' || 'build:win' }} --publish never
        env:
          ELECTRON_BUILDER_7Z_FILTER: BCJ
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_CHERRY_CLOUD_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRY_CLOUD_CLIENT_SECRET }}

      - name: Validate edition preview artifacts
        run: node scripts/release/validate-edition-artifacts.js "${{ matrix.edition }}"

      - name: Upload preview x64 installer
        uses: actions/upload-artifact@v7
        with:
          path: |
            dist/*-x64-setup.exe
            dist/*-x64.dmg
            dist/*-x64.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 3

      - name: Upload preview arm64 installer
        uses: actions/upload-artifact@v7
        with:
          path: |
            dist/*-arm64-setup.exe
            dist/*-arm64.dmg
            dist/*-arm64.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 3

  summary:
    name: Preview downloads
    needs: [resolve, build]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Summarize preview artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.runId,
              per_page: 100
            });
            const platforms = { win: 'Windows', mac: 'macOS', linux: 'Linux' };
            const rows = [];
            for (const artifact of artifacts.sort((a, b) => a.name.localeCompare(b.name))) {
              const match = /^Cherry-Studio(-CN)?-(\d+\.\d+\.\d+-preview-[0-9a-f]{7})-(win|mac|linux)-(x64|arm64)(?:-setup\.exe|\.dmg|\.AppImage)$/.exec(artifact.name);
              if (artifact.expired || !match) continue;
              const [, cn, version, platform, arch] = match;
              const size = `${(artifact.size_in_bytes / 1024 / 1024).toFixed(1)} MiB`;
              const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
              rows.push(`| ${platforms[platform]} | ${cn ? 'CN' : 'Global'} | ${arch} | ${version} | ${size} | [Download](${url}) |`);
            }
            const lines = [
              '## Preview downloads',
              '',
              'Installers are available for 3 days. Sign in to GitHub to download the original file without an extra ZIP archive.',
              '',
              'Only available uploads are listed; check the build jobs for failures.',
              ''
            ];
            if (rows.length) {
              lines.push('| Platform | Edition | Architecture | Version | Size | Download |',
                '| --- | --- | --- | --- | --- | --- |', ...rows);
            } else {
              lines.push('No preview installers are available. Check the build jobs for details.');
            }
            await core.summary.addRaw(lines.join('\n') + '\n').write();
