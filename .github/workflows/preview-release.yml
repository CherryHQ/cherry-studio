name: Signed Windows x64 migration window close preview
run-name: Build and sign PR 23998 Windows x64 migration window close

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SOURCE_SHA: 895800c82db92069706d13471125e1be16e267ec

jobs:
  build:
    if: >-
      github.repository == 'CherryHQ/cherry-studio' &&
      github.ref == 'refs/heads/codex/pr-23998-portable-window-close-preview' &&
      github.actor == 'DeJeune'
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      id: ${{ steps.artifact.outputs.artifact-id }}
      digest: ${{ steps.artifact.outputs.artifact-digest }}
      filename: ${{ steps.package.outputs.filename }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v5
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Global Windows x64 preview
        id: package
        shell: pwsh
        env:
          ELECTRON_BUILDER_7Z_FILTER: BCJ
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          if ((git rev-parse HEAD) -cne $env:SOURCE_SHA) { throw 'Unexpected build commit' }
          $base = (node -p "require('./package.json').version.split('-')[0]").Trim()
          $version = "$base-preview-$($env:SOURCE_SHA.Substring(0,7))"
          npm version $version --no-git-tag-version --allow-same-version --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec dotenv -v CHERRY_EDITION=global -- electron-vite build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run build:utility-process
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --win nsis portable --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $filename = "Cherry-Studio-$version-win-x64-portable.exe"
          if (!(Test-Path -LiteralPath "dist/$filename")) { throw 'Missing portable preview' }
          "filename=$filename" >> $env:GITHUB_OUTPUT
      - name: Stage unsigned portable artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/${{ steps.package.outputs.filename }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: [self-hosted, windows-signing]
    timeout-minutes: 20
    steps:
      - name: Download the exact build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.id }}
          path: ${{ runner.temp }}/pr-23998-fix-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Sign and verify the portable executable
        id: signing
        shell: powershell
        env:
          CHERRY_CERT_PATH: ${{ secrets.CHERRY_CERT_PATH }}
          CHERRY_CERT_KEY: ${{ secrets.CHERRY_CERT_KEY }}
          CHERRY_CERT_CSP: ${{ secrets.CHERRY_CERT_CSP }}
          ARTIFACT_DIR: ${{ runner.temp }}/pr-23998-fix-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_NAME: ${{ needs.build.outputs.filename }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          $namePattern = '^Cherry-Studio-\d+\.\d+\.\d+-preview-' + $env:SOURCE_SHA.Substring(0,7) + '-win-x64-portable\.exe$'
          if ($env:ARTIFACT_NAME -cnotmatch $namePattern) { throw 'Unexpected artifact name' }
          $unsigned = Join-Path $env:ARTIFACT_DIR $env:ARTIFACT_NAME
          $expected = $env:ARTIFACT_DIGEST -replace '^sha256:', ''
          if ($expected -notmatch '^[a-f0-9]{64}$' -or (Get-FileHash -LiteralPath $unsigned -Algorithm SHA256).Hash -ne $expected) {
            throw 'Unexpected unsigned artifact SHA-256'
          }
          if ((Get-AuthenticodeSignature -LiteralPath $unsigned).Status -ne 'NotSigned') {
            throw 'Expected an unsigned preview'
          }
          if (!$env:CHERRY_CERT_PATH -or !$env:CHERRY_CERT_KEY -or !$env:CHERRY_CERT_CSP) {
            throw 'Missing Windows signing configuration'
          }
          $signedName = $env:ARTIFACT_NAME -replace '-win-x64-portable\.exe$', '-signed-win-x64-portable.exe'
          $signed = Join-Path $env:ARTIFACT_DIR $signedName
          $verified = $false
          foreach ($timestamp in @('http://timestamp.digicert.com', 'http://timestamp.sectigo.com')) {
            Copy-Item -LiteralPath $unsigned -Destination $signed -Force
            & signtool.exe sign /tr $timestamp /td sha256 /fd sha256 /f $env:CHERRY_CERT_PATH /csp $env:CHERRY_CERT_CSP /k $env:CHERRY_CERT_KEY $signed
            if ($LASTEXITCODE -ne 0) { continue }
            & signtool.exe verify /pa /tw $signed
            if ($LASTEXITCODE -eq 0) {
              $verified = $true
              break
            }
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $signed
          if (!$verified -or $signature.Status -ne 'Valid' -or !$signature.TimeStamperCertificate) {
            throw 'Could not verify a timestamped Authenticode signature'
          }
          "filename=$signedName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-FileHash -LiteralPath $signed -Algorithm SHA256
      - name: Upload signed x64 portable preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/pr-23998-fix-${{ github.run_id }}-${{ github.run_attempt }}/${{ steps.signing.outputs.filename }}
          archive: false
          if-no-files-found: error
          retention-days: 3
