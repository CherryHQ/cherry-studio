name: Signed Windows x64 Preview
run-name: Sign PR 23998 Windows x64 preview (8cd3f60)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  sign:
    name: Sign the verified PR 23998 portable artifact
    if: >-
      github.repository == 'CherryHQ/cherry-studio' &&
      github.ref == 'refs/heads/codex/pr-23998-signed-preview' &&
      github.actor == 'DeJeune'
    runs-on: [self-hosted, windows-signing]
    timeout-minutes: 15
    steps:
      - name: Download the pinned unsigned preview
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: 43068679639
          artifact-ids: 13878546617
          path: ${{ runner.temp }}/pr-23998-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Sign the x64 portable executable
        shell: powershell
        env:
          CHERRY_CERT_PATH: ${{ secrets.CHERRY_CERT_PATH }}
          CHERRY_CERT_KEY: ${{ secrets.CHERRY_CERT_KEY }}
          CHERRY_CERT_CSP: ${{ secrets.CHERRY_CERT_CSP }}
          ARTIFACT_DIR: ${{ runner.temp }}/pr-23998-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $unsigned = Join-Path $env:ARTIFACT_DIR 'Cherry-Studio-2.2.0-preview-8cd3f60-win-x64-portable.exe'
          $expected = '2af3201ac6d1e29aca5ff4231d3b1df94f9116ceccdd89289d5b108f2cf8b4ba'
          if ((Get-Item -LiteralPath $unsigned).Length -ne 306718744 -or
              (Get-FileHash -LiteralPath $unsigned -Algorithm SHA256).Hash -ne $expected) {
            throw 'Unexpected input artifact size or SHA-256'
          }
          if ((Get-AuthenticodeSignature -LiteralPath $unsigned).Status -ne 'NotSigned') {
            throw 'Expected the original unsigned portable preview'
          }
          if (!$env:CHERRY_CERT_PATH -or !$env:CHERRY_CERT_KEY -or !$env:CHERRY_CERT_CSP) {
            throw 'Missing Windows signing configuration'
          }

          $signed = Join-Path $env:ARTIFACT_DIR 'Cherry-Studio-2.2.0-preview-8cd3f60-signed-win-x64-portable.exe'
          $timestampServers = @('http://timestamp.digicert.com', 'http://timestamp.sectigo.com')
          $verified = $false
          foreach ($timestamp in $timestampServers) {
            Copy-Item -LiteralPath $unsigned -Destination $signed -Force
            & signtool.exe sign /tr $timestamp /td sha256 /fd sha256 /f $env:CHERRY_CERT_PATH /csp $env:CHERRY_CERT_CSP /k $env:CHERRY_CERT_KEY $signed
            if ($LASTEXITCODE -ne 0) { continue }
            & signtool.exe verify /pa /tw $signed
            if ($LASTEXITCODE -eq 0) {
              $verified = $true
              break
            }
          }
          if (!$verified) { throw 'Could not sign and verify the portable preview' }
          $signature = Get-AuthenticodeSignature -LiteralPath $signed
          if ($signature.Status -ne 'Valid' -or !$signature.TimeStamperCertificate) {
            throw 'The signed executable lacks a valid timestamped Authenticode signature'
          }
          Write-Output "Authenticode publisher $($signature.SignerCertificate.GetNameInfo('SimpleName', $false))"
          Get-FileHash -LiteralPath $signed -Algorithm SHA256

      - name: Upload the signed portable preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/pr-23998-${{ github.run_id }}-${{ github.run_attempt }}/Cherry-Studio-2.2.0-preview-8cd3f60-signed-win-x64-portable.exe
          archive: false
          if-no-files-found: error
          retention-days: 3
