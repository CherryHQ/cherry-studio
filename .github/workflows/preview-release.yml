name: Preview Release
run-name: Preview Release ${{ inputs.platform }} from ${{ inputs.branch }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Repository branch to build"
        required: true
        default: "main"
      platform:
        description: "Build platform"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - mac
          - linux

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve preview branch
    if: github.repository == 'CherryHQ/cherry-studio'
    runs-on: ubuntu-latest
    outputs:
      asset_sha: ${{ steps.source.outputs.asset_sha }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Resolve source branch
        id: source
        shell: bash
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git check-ref-format --branch "$BRANCH"

          REMOTE_REF="$(git ls-remote --refs "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$BRANCH")"
          if [ -z "$REMOTE_REF" ]; then
            echo "Branch $BRANCH does not exist in $GITHUB_REPOSITORY" >&2
            exit 1
          fi

          SOURCE_SHA="${REMOTE_REF%%[[:space:]]*}"
          echo "asset_sha=${SOURCE_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved $BRANCH to $SOURCE_SHA"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Select preview targets
        id: targets
        env:
          PLATFORM: ${{ inputs.platform }}
        run: echo "targets=$(node scripts/release/targets.js "$PLATFORM")" >> "$GITHUB_OUTPUT"

  bundle:
    name: Build JS ${{ matrix.edition }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      matrix:
        edition: [global, cn]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v5
      - name: Locate pnpm store
        id: store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: dependencies
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-
      - name: "Dependency cache: ${{ steps.dependencies.outputs.cache-hit == 'true' && 'exact-hit' || 'unknown' }}"
        run: ":"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Set preview version
        shell: bash
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version.split('-')[0]")"
          PREVIEW_VERSION="$BASE_VERSION-preview-${{ needs.resolve.outputs.asset_sha }}"
          npm version "$PREVIEW_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          echo "Building preview version $PREVIEW_VERSION from ${{ needs.resolve.outputs.source_sha }}"

      - name: Typecheck preview source
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Build JS bundle
        run: pnpm run ${{ matrix.edition == 'cn' && 'build:release:cn' || 'build:release' }}
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_CHERRYAI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRYAI_CLIENT_SECRET }}
          MAIN_VITE_CHERRY_CLOUD_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRY_CLOUD_CLIENT_SECRET }}
          SENTRY_SOURCE_MAP_UPLOAD: "true"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-js-${{ matrix.edition }}
          path: |
            out/
            release-bundle.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  build:
    name: Build preview ${{ matrix.edition }} (${{ matrix.target.platform }}-${{ matrix.target.arch }})
    needs: [resolve, bundle]
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        edition: [global, cn]
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}

    steps:
      - name: Check out preview commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: macos-latest dependencies fix
        if: matrix.target.platform == 'mac'
        run: brew install python-setuptools

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        id: dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-

      - name: "Dependency cache: ${{ steps.dependencies.outputs.cache-hit == 'true' && 'exact-hit' || 'unknown' }}"
        shell: bash
        run: ":"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set preview version
        shell: bash
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version.split('-')[0]")"
          PREVIEW_VERSION="$BASE_VERSION-preview-${{ needs.resolve.outputs.asset_sha }}"
          npm version "$PREVIEW_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          echo "Building preview version $PREVIEW_VERSION from ${{ needs.resolve.outputs.source_sha }}"

      - name: Cache verified Linux SQLite artifacts
        if: matrix.target.platform == 'linux'
        uses: actions/cache@v6
        with:
          path: scripts/linux-native/prebuilt
          key: linux-sqlite-${{ matrix.target.arch }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/linux-native/compat.js', 'scripts/linux-native/download.js', 'scripts/linux-native/release.json', 'patches/**') }}

      - name: Clean preview output
        shell: bash
        run: |
          node -e 'for (const directory of ["out", "dist"]) require("node:fs").rmSync(directory, { recursive: true, force: true })'

      - name: Download JS bundle
        uses: actions/download-artifact@v8
        with:
          name: release-js-${{ matrix.edition }}
      - name: Verify JS bundle
        run: node scripts/release/js-bundle.js verify ${{ matrix.edition }}

      - name: Enable Linux ARM64 addon builds
        if: matrix.target.platform == 'linux' && matrix.target.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Linux
        if: matrix.target.platform == 'linux'
        run: |
          sudo apt-get install -y rpm libglib2.0-dev libgdk-pixbuf-2.0-dev libevdev-dev libxtst-dev libx11-dev libxfixes-dev libwayland-dev
          pnpm exec electron-builder --linux --${{ matrix.target.arch }} --publish never ${{ matrix.edition == 'cn' && '--config electron-builder.cn.config.cjs' || '' }}
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build Mac
        if: matrix.target.platform == 'mac'
        run: |
          sudo -H pip install setuptools
          pnpm exec electron-builder --mac --${{ matrix.target.arch }} --publish never ${{ matrix.edition == 'cn' && '--config electron-builder.cn.config.cjs' || '' }}
        env:
          CSC_FOR_PULL_REQUEST: true
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build Windows
        if: matrix.target.platform == 'windows'
        run: pnpm exec electron-builder --win --x64 --arm64 --publish never ${{ matrix.edition == 'cn' && '--config electron-builder.cn.config.cjs' || '' }}
        env:
          ELECTRON_BUILDER_7Z_FILTER: BCJ
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Validate edition preview artifacts
        shell: bash
        env:
          EDITION: ${{ matrix.edition }}
          PLATFORM: ${{ matrix.target.platform }}
          ARCH: ${{ matrix.target.arch }}
        run: |
          node <<'NODE'
          const { validateEditionArtifacts } = require('./scripts/release/validate-edition-artifacts')
          validateEditionArtifacts({
            distDirectory: 'dist',
            edition: process.env.EDITION,
            platform: process.env.PLATFORM,
            architecture: process.env.ARCH === 'all' ? undefined : process.env.ARCH,
            productName: 'Cherry Studio',
            version: require('./package.json').version
          })
          NODE

      - name: Upload preview x64 installer
        if: matrix.target.arch == 'all' || matrix.target.arch == 'x64'
        uses: actions/upload-artifact@v7
        with:
          path: |
            dist/*-x64-setup.exe
            dist/*-x64.dmg
            dist/*-x64.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 3

      - name: Upload preview arm64 installer
        if: matrix.target.arch == 'all' || matrix.target.arch == 'arm64'
        uses: actions/upload-artifact@v7
        with:
          path: |
            dist/*-arm64-setup.exe
            dist/*-arm64.dmg
            dist/*-arm64.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 3

  summary:
    name: Preview downloads
    needs: [resolve, bundle, build]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Summarize preview artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.runId,
              per_page: 100
            });
            const platforms = { win: 'Windows', mac: 'macOS', linux: 'Linux' };
            const rows = [];
            for (const artifact of artifacts.sort((a, b) => a.name.localeCompare(b.name))) {
              const match = /^Cherry-Studio(-CN)?-(\d+\.\d+\.\d+-preview-[0-9a-f]{7})-(win|mac|linux)-(x64|arm64)(?:-setup\.exe|\.dmg|\.AppImage)$/.exec(artifact.name);
              if (artifact.expired || !match) continue;
              const [, cn, version, platform, arch] = match;
              const size = `${(artifact.size_in_bytes / 1024 / 1024).toFixed(1)} MiB`;
              const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
              rows.push(`| ${platforms[platform]} | ${cn ? 'CN' : 'Global'} | ${arch} | ${version} | ${size} | [Download](${url}) |`);
            }
            const lines = [
              '## Preview downloads',
              '',
              'Installers are available for 3 days. Sign in to GitHub to download the original file without an extra ZIP archive.',
              '',
              'Only available uploads are listed; check the build jobs for failures.',
              ''
            ];
            if (rows.length) {
              lines.push('| Platform | Edition | Architecture | Version | Size | Download |',
                '| --- | --- | --- | --- | --- | --- |', ...rows);
            } else {
              lines.push('No preview installers are available. Check the build jobs for details.');
            }
            await core.summary.addRaw(lines.join('\n') + '\n').write();
