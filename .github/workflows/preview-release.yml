name: Isolated Windows portable migration test
run-name: Test the signed 1.9.12 and 2.1.0 portable migration chain
on:
  workflow_dispatch:
    inputs:
      preview_artifact_id:
        description: Signed preview artifact from the pinned build
        required: false
        type: string
permissions:
  actions: read
  contents: read
jobs:
  migration:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Download the signed artifact from the build
        if: inputs.preview_artifact_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ inputs.preview_artifact_id }}
          github-token: ${{ github.token }}
          run-id: 43243027559
          path: ${{ runner.temp }}/cs-preview
      - name: Verify the real 1.9.12 Close control after startup
        if: inputs.preview_artifact_id == ''
        shell: pwsh
        run: ./scripts/preview-test/run.ps1
      - name: Verify the 1.9.12 close button with close-to-tray enabled
        if: inputs.preview_artifact_id != ''
        shell: pwsh
        run: |
          $preview = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/cs-preview" -Filter '*-preview-895800c-signed-win-x64-portable.exe' -Recurse -File)
          if ($preview.Count -ne 1) { throw 'Could not find the exact signed preview' }
          & ./scripts/preview-test/run.ps1 -Preview $preview[0].FullName
      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: isolated-portable-window-close-evidence
          path: |
            scripts/preview-test/*.json
            scripts/preview-test/*.png
            scripts/preview-test/*-history.txt
            scripts/preview-test/migration-fixtures/*.json
            scripts/preview-test/migration-fixtures/*.png
            ${{ runner.temp }}/cs23998-e2e/launcher.log
            ${{ runner.temp }}/cs23998-e2e/data/logs/app-error.*.log
            ${{ runner.temp }}/cs23998-e2e/home/.cherrystudio/cache/legacy-upgrade/**/*.install-error.log
          retention-days: 3
