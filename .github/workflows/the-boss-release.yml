name: The Boss Release
run-name: Installers ${{ github.ref_name }} @ ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Optional comma-separated platforms to build from the published payload
        required: false
        type: string
      reuse_installer_runs:
        description: Optional comma-separated workflow run ids containing immutable installer manifests
        required: false
        type: string
      reuse_platforms:
        description: Optional comma-separated platforms paired with reuse_installer_runs
        required: false
        type: string
  push:
    branches: [main]
    paths-ignore:
      ["**/*.md", "docs/**", ".kbd-orchestrator/**", ".prometheus/**", "openspec/**", "release-manifest.json"]
concurrency:
  group: the-boss-release-${{ github.ref }}
  cancel-in-progress: false
env:
  IPFS_API: https://ipfs.prometheusags.ai
  NODE_OPTIONS: --max-old-space-size=8192
permissions:
  contents: read
jobs:
  platforms:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      platforms: ${{ steps.select.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7
      - id: select
        env:
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
        run: node scripts/release-platforms.cjs
  build:
    needs: platforms
    name: Installer (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      HAS_SIGNING: ${{ secrets.CSC_LINK != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v5
      - uses: actions/cache@v6
        with:
          path: ~/.cache/the-boss-binaries
          key: binaries-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('build/integration-artifacts.json', 'scripts/download-binaries.js') }}
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools libfuse2 libsecret-1-dev
      - name: Install macOS packaging dependencies
        if: runner.os == 'macOS'
        run: brew install python-setuptools
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Windows runner capacity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/release-capacity.cjs
          if ($LASTEXITCODE -ne 0) {
            pnpm store prune
            node scripts/release-capacity.cjs
          }
      - name: Compile Windows NSIS uninstall hook
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress -y
          }
          node scripts/nsis-preflight.cjs
      - name: Enable configured signing
        if: env.HAS_SIGNING == 'true'
        shell: bash
        env:
          SIGN_LINK: ${{ secrets.CSC_LINK }}
          SIGN_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SIGN_APPLE_ID: ${{ secrets.APPLE_ID }}
          SIGN_APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SIGN_APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "CSC_LINK=$SIGN_LINK" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$SIGN_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_ID=$SIGN_APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=$SIGN_APPLE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$SIGN_APPLE_TEAM" >> "$GITHUB_ENV"
      - name: Build actual installers
        run: pnpm ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.HAS_SIGNING }}
      - name: Publish installers to IPFS
        run: node scripts/publish-installers.cjs
      - name: Record release runner capacity
        if: runner.os == 'Windows'
        run: node scripts/release-capacity.cjs --report-only
      - uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: installers-${{ matrix.platform }}-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 90
  publish-complete-release:
    needs: [build, platforms]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v6
        with:
          pattern: installers-*
          path: manifests
          merge-multiple: true
      - id: reuse
        name: Import explicitly reused installer manifests
        env:
          BUILT_PLATFORMS: ${{ needs.platforms.outputs.platforms }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REUSE_INSTALLER_RUNS: ${{ inputs.reuse_installer_runs }}
          REUSE_PLATFORMS: ${{ inputs.reuse_platforms }}
        run: node scripts/download-reused-installers.cjs
      - name: Generate complete release entry
        env:
          RELEASE_PLATFORMS: ${{ steps.reuse.outputs.release_platforms }}
          REUSED_PLATFORMS: ${{ steps.reuse.outputs.reused_platforms }}
        run: node scripts/update-release-entry.cjs
      - name: Commit release metadata through GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/commit-release-entry.cjs
      - uses: actions/upload-artifact@v5
        with:
          name: complete-release
          path: |
            release-manifest.json
            RELEASES.md
