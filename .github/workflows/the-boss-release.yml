name: The Boss Release
run-name: ${{ github.event_name == 'repository_dispatch' && format('Publish {0}-{1} {2}', github.event.client_payload.platform, github.event.client_payload.arch, github.event.client_payload.tag) || format('Installers ({0}) {1} @ {2}', inputs.release_profile, inputs.release_version, github.sha) }}
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Frozen application version (must match package.json)
        required: true
        default: 2.2.2
        type: string
      release_profile:
        description: Customer release profile
        required: true
        default: uar-enabled
        type: choice
        options:
          - non-uar
          - uar-enabled
      platforms:
        description: Optional comma-separated platforms to build from the published payload
        required: false
        type: string
      uar_win32_x64_record_url:
        description: Immutable win32-x64 UAR sidecar release record URL (required for uar-enabled)
        required: false
        type: string
      uar_darwin_arm64_record_url:
        description: Immutable darwin-arm64 UAR sidecar release record URL (required for uar-enabled)
        required: false
        type: string
  repository_dispatch:
    types: [boss_release_platform_published]
concurrency:
  group: ${{ github.event_name == 'repository_dispatch' && 'the-boss-release-publication' || format('the-boss-release-{0}', github.ref) }}
  cancel-in-progress: false
env:
  NODE_OPTIONS: --max-old-space-size=8192
  RELEASE_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.version || inputs.release_version }}
  THE_BOSS_UAR_ENABLED: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.profile == 'uar-enabled' && '1' || inputs.release_profile == 'uar-enabled' && '1' || '0' }}
  UAR_WIN32_X64_RECORD_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.uar_win32_x64_record_url || '' }}
  UAR_DARWIN_ARM64_RECORD_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.uar_darwin_arm64_record_url || '' }}
permissions:
  contents: read
jobs:
  platforms:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      platforms: ${{ steps.select.outputs.platforms }}
      profile: ${{ steps.select.outputs.profile }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Freeze release version, profile, and source
        env:
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
        run: node scripts/release-preflight.cjs
      - name: Import complete UAR sidecar payload
        if: env.THE_BOSS_UAR_ENABLED == '1'
        run: node scripts/import-uar-sidecar-payloads.cjs
      - id: select
        env:
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
        run: node scripts/release-platforms.cjs
  prepare-release:
    if: github.event_name == 'workflow_dispatch'
    needs: platforms
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare versioned GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prepare-github-release.cjs
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: [platforms, prepare-release]
    name: Installer (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      HAS_MAC_SIGNING: ${{ secrets.CSC_LINK != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.WIN_CSC_LINK != '' }}
      HAS_SIGNING: ${{ (matrix.platform == 'darwin' && secrets.CSC_LINK != '') || (matrix.platform == 'win32' && secrets.WIN_CSC_LINK != '') }}
      HAS_NOTARIZATION: ${{ secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Import complete UAR sidecar payload
        if: env.THE_BOSS_UAR_ENABLED == '1'
        run: node scripts/import-uar-sidecar-payloads.cjs
      - name: Report native release capacity and payloads
        run: node scripts/release-capacity.cjs --platform ${{ matrix.platform }}-${{ matrix.arch }} --report-only
      - uses: pnpm/action-setup@v5
      - uses: actions/cache@v6
        with:
          path: ~/.cache/the-boss-binaries
          key: binaries-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('build/integration-artifacts.json', 'scripts/download-binaries.js') }}
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          rpm libarchive-tools libfuse2 libsecret-1-dev libdbus-1-dev pkg-config
          libevdev-dev libxtst-dev libx11-dev libxfixes-dev libwayland-dev
      - name: Install macOS packaging dependencies
        if: runner.os == 'macOS'
        run: brew install python-setuptools
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require macOS distribution credentials
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "$HAS_MAC_SIGNING" != "true" ] || [ "$HAS_NOTARIZATION" != "true" ]; then
            echo "macOS releases require Developer ID signing and App Store Connect notarization credentials" >&2
            exit 1
          fi
      - name: Recover Windows runner capacity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/release-capacity.cjs --platform ${{ matrix.platform }}-${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) {
            pnpm store prune
            node scripts/release-capacity.cjs --platform ${{ matrix.platform }}-${{ matrix.arch }}
          }
      - name: Require macOS runner capacity
        if: runner.os == 'macOS'
        run: node scripts/release-capacity.cjs --platform ${{ matrix.platform }}-${{ matrix.arch }}
      - name: Compile Windows NSIS uninstall hook
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress -y
          }
          node scripts/nsis-preflight.cjs
      - name: Enable configured macOS signing
        if: runner.os == 'macOS' && env.HAS_MAC_SIGNING == 'true'
        shell: bash
        env:
          SIGN_LINK: ${{ secrets.CSC_LINK }}
          SIGN_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SIGN_APPLE_ID: ${{ secrets.APPLE_ID }}
          SIGN_APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SIGN_APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "CSC_LINK=$SIGN_LINK" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$SIGN_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_ID=$SIGN_APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=$SIGN_APPLE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$SIGN_APPLE_TEAM" >> "$GITHUB_ENV"
      - name: Enable configured Windows signing
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: bash
        env:
          SIGN_LINK: ${{ secrets.WIN_CSC_LINK }}
          SIGN_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          echo "CSC_LINK=$SIGN_LINK" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$SIGN_PASSWORD" >> "$GITHUB_ENV"
      - name: Enable App Store Connect notarization
        if: runner.os == 'macOS' && env.HAS_NOTARIZATION == 'true'
        shell: bash
        env:
          SIGN_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          SIGN_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          SIGN_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$SIGN_API_KEY_ID.p8"
          printf '%s' "$SIGN_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$SIGN_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$SIGN_API_ISSUER" >> "$GITHUB_ENV"
      - name: Build actual installers
        run: pnpm ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.HAS_SIGNING }}
      - name: Publish installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-installers.cjs
      - name: Queue serialized metadata and site publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/queue-release-publication.cjs
      - name: Record release runner capacity
        run: node scripts/release-capacity.cjs --platform ${{ matrix.platform }}-${{ matrix.arch }} --report-only
      - uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: installers-${{ matrix.platform }}-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 90
  publish-platform:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Merge, publish, verify, and dispatch platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANDING_DISPATCH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
          LANDING_REPOSITORY: Know-Me-Tools/boss-landing-spot
          RELEASE_ARCH: ${{ github.event.client_payload.arch }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_MANIFEST_ASSET: ${{ github.event.client_payload.manifestAsset }}
          RELEASE_PLATFORM: ${{ github.event.client_payload.platform }}
          RELEASE_PROFILE: ${{ github.event.client_payload.profile }}
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
        run: node scripts/coordinate-release-publication.cjs
      - uses: actions/upload-artifact@v5
        with:
          name: published-${{ github.event.client_payload.platform }}-${{ github.event.client_payload.arch }}
          path: |
            release-manifest.json
            RELEASES.md
