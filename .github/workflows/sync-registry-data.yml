name: Sync provider-registry data

# Publishes the regenerated provider/model catalog to the `x-files/provider-registry`
# branch so running apps can pick up new models without an app release
# (see src/main/services/ProviderRegistryUpdaterService.ts). The `x-files/*` naming
# matches x-files/app-upgrade-config so the same GitCode repo mirror serves it to
# CN users (raw.gitcode.com) without a separate push.
#
# The catalog on `main` (packages/provider-registry/data/*.json, regenerated and
# committed by the catalog-source-sync CI on every metadata PR) is the source of
# truth — this job only MIRRORS it into a schema-version dir on the branch.
#
# Each v{N}/ dir holds the catalog plus a manifest with an explicit application
# compatibility range and monotonic workflow revision. Clients only download
# the model metadata files; provider routing always remains bundled.
#
# One-time setup (both required before this is useful):
#   1. Create the orphan branch, from a clean repo:
#        git checkout --orphan x-files/provider-registry && git rm -rf .
#        mkdir -p v1 && cp <main>/packages/provider-registry/data/*.json v1/
#        git add v1 && git commit -m "chore(provider-registry): init x-files/provider-registry"
#        git push origin x-files/provider-registry
#      (the manifest.json is created automatically on the first workflow run)
#   2. Ensure the GitCode repo mirror replicates this branch (as it already does
#      for x-files/app-upgrade-config) so CN clients can fetch from raw.gitcode.com.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-registry-data.yml"
      - "packages/provider-registry/data/**"
      - "scripts/buildRegistrySyncRequest.js"
      # A REGISTRY_SCHEMA_VERSION bump changes the publish dir (v{N}); watch its
      # source so a version-only change still creates the new vN/ directory.
      - "packages/provider-registry/src/registry-loader.ts"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-registry-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          path: main
          fetch-depth: 1

      - name: Checkout x-files/provider-registry branch
        uses: actions/checkout@v7
        with:
          ref: x-files/provider-registry
          path: pub
          fetch-depth: 1

      - name: Resolve schema-version dir
        id: ver
        run: |
          # Single source of truth: REGISTRY_SCHEMA_VERSION in the package source.
          # Publishing to the matching v{N} dir is what keeps old apps on a
          # schema they can parse — see the constant's doc comment.
          VER=$(grep -oE 'REGISTRY_SCHEMA_VERSION = [0-9]+' \
            main/packages/provider-registry/src/registry-loader.ts | grep -oE '[0-9]+' | head -n1)
          if [ -z "$VER" ]; then
            echo "Could not resolve REGISTRY_SCHEMA_VERSION from registry-loader.ts" >&2
            exit 1
          fi
          MIN_APP_VERSION=$(grep -oE "REGISTRY_MIN_APP_VERSION = '[^']+'" \
            main/packages/provider-registry/src/registry-loader.ts | cut -d"'" -f2 | head -n1)
          if [ -z "$MIN_APP_VERSION" ]; then
            echo "Could not resolve REGISTRY_MIN_APP_VERSION from registry-loader.ts" >&2
            exit 1
          fi
          echo "dir=v$VER" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "min_app_version=$MIN_APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate catalog against frozen schema
        run: |
          node "main/packages/provider-registry/compat/v${{ steps.ver.outputs.version }}-validator.mjs" \
            main/packages/provider-registry/data

      - name: Copy catalog into version dir
        run: |
          DEST="pub/${{ steps.ver.outputs.dir }}"
          mkdir -p "$DEST"
          cp main/packages/provider-registry/data/models.json \
             main/packages/provider-registry/data/providers.json \
             main/packages/provider-registry/data/provider-models.json \
             "$DEST/"

      - name: Write release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # sourceAppVersion = latest published release, proving the snapshot is
          # not older than that shipped bundle. minAppVersion is an explicit
          # semantic runtime floor from source; structural Zod compatibility is
          # insufficient for values interpreted by adapters and request builders.
          # revision is monotonic per workflow and prevents branch/mirror rollback.
          # schemaVersion lets a client that later DOWNGRADES ignore an override
          # written for a schema it no longer understands (falls back to bundled).
          # files.* = each catalog file's content-hash `version`; a client verifies
          # every downloaded file against it so a mid-fetch branch move (cross-commit
          # mixture) is rejected — the set is bound to this one published snapshot.
          SOURCE_APP_VERSION=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name' 2>/dev/null | sed 's/^v//' || true)
          if [ -z "$SOURCE_APP_VERSION" ] || [ "$SOURCE_APP_VERSION" = "null" ]; then
            SOURCE_APP_VERSION=$(jq -r '.version' main/package.json)
          fi
          DEST="pub/${{ steps.ver.outputs.dir }}"
          jq -n \
            --arg sourceAppVersion "$SOURCE_APP_VERSION" \
            --arg minAppVersion "${{ steps.ver.outputs.min_app_version }}" \
            --argjson revision "${{ github.run_number }}" \
            --argjson schema "${{ steps.ver.outputs.version }}" \
            --arg models "$(jq -r '.version' "$DEST/models.json")" \
            --arg providers "$(jq -r '.version' "$DEST/providers.json")" \
            --arg providerModels "$(jq -r '.version' "$DEST/provider-models.json")" \
            '{minAppVersion: $minAppVersion, sourceAppVersion: $sourceAppVersion, revision: $revision, schemaVersion: $schema, files: {"models.json": $models, "providers.json": $providers, "provider-models.json": $providerModels}}' \
            > "$DEST/manifest.json"

      - name: Commit if changed
        working-directory: pub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Commits go through GraphQL rather than `git push`: GitHub signs
          # API-authored commits, which the branch's required-signatures rule demands.
          git add "${{ steps.ver.outputs.dir }}"
          if git diff --cached --quiet; then
            echo "No catalog changes to publish."
            exit 0
          fi

          REPO="${{ github.repository }}"
          REF=$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$ref:String!){repository(owner:$owner,name:$name){ref(qualifiedName:$ref){id target{oid}}}}' \
            -f owner="${REPO%/*}" -f name="${REPO#*/}" -f ref="refs/heads/x-files/provider-registry")
          REF_ID=$(jq -er '.data.repository.ref.id' <<< "$REF")
          HEAD_OID=$(jq -er '.data.repository.ref.target.oid' <<< "$REF")

          REQUEST_FILE=$(mktemp)
          trap 'rm -f "$REQUEST_FILE"' EXIT
          REGISTRY_SYNC_REF_ID="$REF_ID" \
          REGISTRY_SYNC_EXPECTED_HEAD_OID="$HEAD_OID" \
          REGISTRY_SYNC_HEADLINE="chore(provider-registry): sync catalog to ${{ steps.ver.outputs.dir }}" \
          REGISTRY_SYNC_BODY="Source: ${{ github.repository }}@${{ github.sha }}
          Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            node ../main/scripts/buildRegistrySyncRequest.js "$REQUEST_FILE"

          RESP=$(gh api graphql --input "$REQUEST_FILE")

          # gh does not always exit non-zero on a GraphQL `errors` payload.
          if jq -e '.errors' <<< "$RESP" >/dev/null; then
            echo "$RESP" >&2
            exit 1
          fi
          jq -er '.data.createCommitOnBranch.commit.url' <<< "$RESP"
