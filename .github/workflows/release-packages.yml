name: Release Packages

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - "packages/aiCore/**"
      - "packages/ai-sdk-provider/**"
      - "packages/extension-table-plus/**"
      - "packages/file-preview/**"
      - "packages/remote-protocol/**"
      - "packages/remote-transport/**"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release Packages
    if: github.repository == 'CherryHQ/cherry-studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install

      - name: Build Packages
        run: pnpm packages:build

      - name: Check Remote Packages
        run: |
          pnpm --filter '@cherrystudio/remote-*' typecheck
          pnpm --filter '@cherrystudio/remote-*' test

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          create-github-releases: false
          publish-script: pnpm changeset:publish
          version-script: pnpm changeset:version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Summary
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "## Published Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following packages were published:" >> $GITHUB_STEP_SUMMARY
          echo "$PUBLISHED_PACKAGES" >> $GITHUB_STEP_SUMMARY
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
