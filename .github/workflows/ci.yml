name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main, "release/v*"]
  pull_request:
    types: [ready_for_review, synchronize, opened, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      repository: ${{ steps.plan.outputs.repository }}
      lint: ${{ steps.plan.outputs.lint }}
      types: ${{ steps.plan.outputs.types }}
      i18n: ${{ steps.plan.outputs.i18n }}
      main: ${{ steps.plan.outputs.main }}
      renderer: ${{ steps.plan.outputs.renderer }}
      packages: ${{ steps.plan.outputs.packages }}
      platform: ${{ steps.plan.outputs.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Plan affected validation
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            node scripts/validation/run.mjs --committed --base HEAD^1 --github-output
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            if git fetch --no-tags --depth=1 origin "$BEFORE_SHA"; then
              node scripts/validation/run.mjs --committed --base "$BEFORE_SHA" --github-output
            else
              node scripts/validation/run.mjs --all --github-output
            fi
          else
            node scripts/validation/run.mjs --all --github-output
          fi

  repository-checks:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.repository == 'true'
    env:
      VALIDATION_PLAN: ${{ needs.changes.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        env:
          SHELLCHECK_OPTS: --severity=error
        with:
          args: -color
      - name: Prepare base reference
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git update-ref "refs/remotes/origin/$BASE_REF" "$(git rev-parse HEAD^1)"

      # provider-registry data/*.json are generated from src/creators + src/providers.
      # The daily catalog workflow regenerates data without source changes, so exempt only
      # its exact same-repository branch from the hand-edit guard.
      - name: Detect provider-registry changes
        if: github.event_name == 'pull_request' && !(github.head_ref == 'auto-update-catalog-daily' && github.event.pull_request.head.repo.full_name == github.repository)
        id: catalog-filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            data:
              - 'packages/provider-registry/data/**'
            source:
              - 'packages/provider-registry/src/**'
              - 'packages/provider-registry/scripts/**'

      - name: Reject hand-edited catalog
        if: steps.catalog-filter.outputs.data == 'true' && steps.catalog-filter.outputs.source == 'false'
        run: |
          echo "::error::packages/provider-registry/data/*.json changed but no src/ or scripts/ change — that's a hand-edit. The data files are generated: edit src/creators|src/providers and run \`pnpm --filter @cherrystudio/provider-registry generate\`, then commit. Never hand-edit data/*.json."
          exit 1

      - uses: ./.github/actions/setup-validation
        with:
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: Check provider-registry compatibility baseline policy
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: pnpm --filter @cherrystudio/provider-registry compat:policy -- "origin/$BASE_REF"

      - name: Check changesets
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: pnpm changeset status --since="origin/$BASE_REF"

      - name: Repository checks
        run: pnpm check --group repository

      - name: DB Migrations Check
        if: contains(fromJSON(needs.changes.outputs.plan).tasks, 'migrations')
        run: |
          # Generation detects schema drift after the plan checks snapshot chain integrity.
          pnpm db:migrations:generate
          if [ -n "$(git status --porcelain migrations/)" ]; then
            echo "::error::Schema and migrations are out of sync. Run \`pnpm db:migrations:generate\` and commit the result."
            git --no-pager status --porcelain migrations/
            git --no-pager diff -- migrations/
            exit 1
          fi

      - name: System Provider IDs Check
        if: contains(fromJSON(needs.changes.outputs.plan).tasks, 'knowledge')
        run: |
          # SystemProviderId is generated from packages/provider-registry — fail on drift.
          pnpm gen:system-provider-ids
          if [ -n "$(git status --porcelain src/shared/utils/systemProviderId.ts)" ]; then
            echo "::error::systemProviderId.ts is out of sync with provider-registry. Run \`pnpm gen:system-provider-ids\` and commit the result."
            git --no-pager diff -- src/shared/utils/systemProviderId.ts
            exit 1
          fi

  lint-checks:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    env:
      VALIDATION_PLAN: ${{ needs.changes.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-validation
      - run: pnpm check --group lint

  type-checks:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.types == 'true'
    env:
      VALIDATION_PLAN: ${{ needs.changes.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-validation
      - run: pnpm check --group types

  i18n-checks:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.i18n == 'true'
    env:
      TRANSLATION_BASE_LOCALE: ${{ vars.TRANSLATION_BASE_LOCALE || 'en-us' }}
      VALIDATION_PLAN: ${{ needs.changes.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-validation
      - name: Check locale synchronization
        run: |
          pnpm i18n:sync
          if [ -n "$(git status --porcelain --untracked-files=all -- src/renderer/i18n src/main/i18n)" ]; then
            echo "::error::Translations are out of sync."
            git --no-pager diff -- src/renderer/i18n src/main/i18n
            exit 1
          fi
      - run: pnpm check --group i18n

  main-test-shard:
    name: main-test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.main == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      VALIDATION_PLAN: ${{ needs.changes.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-validation
      - run: pnpm check --group main --shard=${{ matrix.shard }}/3

  renderer-test-shard:
    name: renderer-test (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.renderer == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      VALIDATION_PLAN: ${{ needs.changes.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-validation
      - run: pnpm check --group renderer --shard=${{ matrix.shard }}/5

  package-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    env:
      VALIDATION_PLAN: ${{ needs.changes.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-validation
      - run: pnpm check --group packages

  platform-test:
    name: platform-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - name: macOS native build prerequisites
        if: runner.os == 'macOS'
        run: brew install python-setuptools
      - uses: ./.github/actions/setup-validation
      - name: Platform contracts
        env:
          VALIDATION_PLAN: ${{ needs.changes.outputs.plan }}
        run: pnpm check --group platform

  basic-checks:
    runs-on: ubuntu-latest
    needs: [changes, repository-checks, lint-checks, type-checks, i18n-checks]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify planned jobs
        env:
          VALIDATION_JOBS: ${{ toJSON(needs) }}
        run: node scripts/validation/verify.mjs basic

  general-test:
    runs-on: ubuntu-latest
    needs: [changes, main-test-shard, package-test, platform-test]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify planned jobs
        env:
          VALIDATION_JOBS: ${{ toJSON(needs) }}
        run: node scripts/validation/verify.mjs general

  render-test:
    runs-on: ubuntu-latest
    needs: [changes, renderer-test-shard]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify planned jobs
        env:
          VALIDATION_JOBS: ${{ toJSON(needs) }}
        run: node scripts/validation/verify.mjs renderer

  notify:
    runs-on: ubuntu-latest
    needs: [basic-checks, general-test, package-test, render-test]
    if: always() && (needs.basic-checks.result == 'failure' || needs.general-test.result == 'failure' || needs.package-test.result == 'failure' || needs.render-test.result == 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install

      - name: Send failure notification to Feishu
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          DESCRIPTION=$(printf "**分支:** main\n\n**提交:** %.7s\n\n**信息:** %s\n\n**工作流:** [查看详情](%s)" "$COMMIT_SHA" "$COMMIT_MSG" "$RUN_URL")
          pnpm tsx scripts/feishu-notify.ts send \
            -t "Main 分支 CI 失败" \
            -d "$DESCRIPTION" \
            -c "red"
