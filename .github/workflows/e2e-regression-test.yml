name: E2E Regression Test
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch in this repository or a v* release tag to test
        required: true
        default: main
        type: string
      task:
        description: Test task (all = full regression)
        required: true
        default: all
        type: choice
        options:
          - all
          - startup-smoke
          - mini-app
          - notes
          - settings
          - assistants
          - error-recovery
          - chat-core
          - translation
          - system-integration
          - knowledge
          - mcp-skills
          - code-tools
          - paintings
          - agents
          - topics
          - files
          - data-backup
          - browser
          - mini-app-smoke
          - notes-smoke
          - mini-app-pinning
          - custom-provider-chat
          - provider-model-scroll
          - custom-assistant
          - chat-stream-failure
          - clear-chat-messages
          - chat-error-recovery
          - translation-smoke
          - quick-assistant
          - knowledge-smoke
          - everything-mcp
          - skill-import
          - code-cli
          - openclaw
          - code-cli-permissions
          - cherryin-chat
          - image-generation
          - agent-basic-task
          - claude-agent-runtime
          - pi-runtime
          - translation-settings
          - native-settings
      provider_mode:
        description: "Provider backend: real = repository vars (default), mock = in-job
          mock service (deterministic, no quota, fault injection). Mock supports
          a subset of tasks; see scripts/e2e/regression/mock-fixtures/README.md"
        required: true
        default: real
        type: choice
        options:
          - real
          - mock
permissions:
  contents: read
concurrency:
  group: cherry-regression-test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.ref.outputs.mode }}
      name: ${{ steps.ref.outputs.name }}
      ref: ${{ steps.ref.outputs.ref }}
      sha: ${{ steps.ref.outputs.sha }}
      task: ${{ steps.ref.outputs.task }}
    steps:
      - name: Checkout workflow controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install controller dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            [[ "$attempt" == "3" ]] && exit 1
            sleep $((attempt * 15))
          done
      - name: Resolve and validate test reference
        id: ref
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          REQUESTED_TASK: ${{ inputs.task }}
        run: |
          pnpm exec tsx scripts/e2e/regression/cli.ts resolve-ref \
            --requested "$REQUESTED_REF" \
            --repository "${{ github.repository }}"
          echo "task=$REQUESTED_TASK" >> "$GITHUB_OUTPUT"
  test:
    needs: resolve
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-latest
            platform: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      TARGET_DIR: ${{ github.workspace }}/target-app
      MCP_TIMEOUT: "30000"
      MCP_TOOL_TIMEOUT: "240000"
    steps:
      - name: Checkout workflow controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout application under test
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          path: target-app
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Export pinned Node.js version
        shell: bash
        run: echo "NODE_VERSION=$(node -p 'process.versions.node')" >> "$GITHUB_ENV"
      - name: Install controller dependencies
        id: controller-dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            [[ "$attempt" == "3" ]] && exit 1
            sleep $((attempt * 15))
          done
      - name: Define isolated test directory
        shell: bash
        run: >
          echo "RUN_DIR=$RUNNER_TEMP/cherry-regression" >> "$GITHUB_ENV"

          echo "CHERRY_TEST_RUN_DIR=$RUNNER_TEMP/cherry-regression" >>
          "$GITHUB_ENV"
      - name: Initialize isolated test directory
        shell: bash
        env:
          TEST_MODE: ${{ needs.resolve.outputs.mode }}
          TEST_REF_NAME: ${{ needs.resolve.outputs.name }}
          TEST_SHA: ${{ needs.resolve.outputs.sha }}
          TEST_RUNNER: ${{ matrix.runner }}
          TEST_TASK: ${{ needs.resolve.outputs.task }}
        run: pnpm exec tsx scripts/e2e/regression/cli.ts initialize --run-dir "$RUN_DIR"
          --mode "$TEST_MODE" --platform "${{ matrix.platform }}" --ref
          "$TEST_REF_NAME" --sha "$TEST_SHA" --runner "$TEST_RUNNER" --task
          "$TEST_TASK" --provider-mode "${{ inputs.provider_mode }}"
      - name: Prepare Notification Center on the disposable macOS runner
        if: matrix.platform == 'macos'
        shell: bash
        run: >
          node <<'NODE'

          const { execFileSync, spawnSync } = require('node:child_process')

          const { existsSync, mkdirSync, writeFileSync } = require('node:fs')

          const { join } = require('node:path')

          if (process.env.GITHUB_ACTIONS !== 'true' ||
          process.env.RUNNER_ENVIRONMENT !== 'github-hosted') throw new
          Error('Disposable hosted runner required')

          const root = process.env.RUN_DIR

          if (!root || !existsSync(join(root, 'run.json'))) throw new
          Error('Initialized run directory required')

          const agent =
          '/System/Library/LaunchAgents/com.apple.notificationcenterui.plist'

          const label = execFileSync('plutil', ['-extract', 'Label', 'raw',
          '-o', '-', agent], { encoding: 'utf8' }).trim()

          if (!['com.apple.notificationcenterui',
          'com.apple.notificationcenterui.agent'].includes(label)) throw new
          Error('Unexpected Notification Center service label')

          const domain = `gui/${process.getuid()}`

          const service = `${domain}/${label}`

          const overrides = execFileSync('launchctl', ['print-disabled',
          domain], { encoding: 'utf8' })

          const disabled = overrides.split('\n').some(line =>
          line.includes(JSON.stringify(label)) && /=>\s*true/.test(line))

          const loaded = spawnSync('launchctl', ['print', service], { stdio:
          'ignore' }).status === 0

          mkdirSync(join(root, 'state'), { recursive: true })

          writeFileSync(join(root, 'state/notification-center-agent.json'),
          JSON.stringify({ domain, label, disabled, loaded }), { flag: 'wx',
          mode: 0o600 })

          process.stdout.write(JSON.stringify({ notificationCenterService:
          label, notificationCenterInitiallyDisabled: disabled,
          notificationCenterInitiallyLoaded: loaded }) + '\n')

          execFileSync('launchctl', ['enable', service])

          if (!loaded) execFileSync('launchctl', ['bootstrap', domain, agent])

          execFileSync('launchctl', ['kickstart', service])

          NODE
      - name: Start disposable macOS permission observer
        if: matrix.platform == 'macos'
        shell: bash
        run: >
          umask 077

          mkdir -p "$RUN_DIR/state"

          nohup osascript -l JavaScript
          scripts/e2e/regression/macPermissionObserver.jxa "$RUN_DIR" >
          "$RUN_DIR/logs/ci-native-permissions.log" 2>&1 < /dev/null &

          echo "$!" > "$RUN_DIR/state/ci-native-permissions.pid"

          sleep 1

          kill -0 "$(cat "$RUN_DIR/state/ci-native-permissions.pid")"
      - name: Validate native controller adapters
        shell: bash
        run: pnpm test:scripts
          scripts/e2e/regression/__tests__/externalAppSyntax.test.ts
          scripts/e2e/regression/__tests__/nativeAdapters.test.ts
          --reporter=default --reporter=json
          --outputFile.json="$RUN_DIR/report/native-controller-results.json" -t
          "completes the real macos file dialog"
      - name: Stop disposable macOS permission observer
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: >
          [[ -n "${RUN_DIR:-}" && -d "$RUN_DIR/state" ]] || exit 0

          touch "$RUN_DIR/state/stop-ci-permissions"

          if [[ -f "$RUN_DIR/state/ci-native-permissions.pid" ]]; then
            observer_pid=$(cat "$RUN_DIR/state/ci-native-permissions.pid")
            [[ "$observer_pid" =~ ^[1-9][0-9]*$ ]] || exit 1
            for attempt in {1..15}; do
              kill -0 "$observer_pid" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$observer_pid" 2>/dev/null; then
              observer_command=$(ps -p "$observer_pid" -o command=)
              [[ "$observer_command" == *"scripts/e2e/regression/macPermissionObserver.jxa $RUN_DIR"* ]] || exit 1
              kill "$observer_pid"
            fi
          fi
      - name: Restore Notification Center on the disposable macOS runner
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: >
          node <<'NODE'

          const { execFileSync, spawnSync } = require('node:child_process')

          const { existsSync, readFileSync } = require('node:fs')

          const { join } = require('node:path')

          if (process.env.GITHUB_ACTIONS !== 'true' ||
          process.env.RUNNER_ENVIRONMENT !== 'github-hosted') throw new
          Error('Disposable hosted runner required')

          if (!process.env.RUN_DIR) process.exit(0)

          const path = join(process.env.RUN_DIR,
          'state/notification-center-agent.json')

          if (!existsSync(path)) process.exit(0)

          const state = JSON.parse(readFileSync(path, 'utf8'))

          if (state.domain !== `gui/${process.getuid()}` || typeof
          state.disabled !== 'boolean' || typeof state.loaded !== 'boolean')
          throw new Error('Notification Center ownership record is invalid')

          if (!['com.apple.notificationcenterui',
          'com.apple.notificationcenterui.agent'].includes(state.label)) throw
          new Error('Notification Center service label is invalid')

          const service = `${state.domain}/${state.label}`

          if (state.disabled) execFileSync('launchctl', ['disable', service])

          if (!state.loaded && spawnSync('launchctl', ['print', service], {
          stdio: 'ignore' }).status === 0) execFileSync('launchctl', ['bootout',
          service])

          NODE
      - name: Upload platform report and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ matrix.platform }}
          overwrite: true
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/cherry-regression/report
            ${{ runner.temp }}/cherry-regression/evidence
            ${{ runner.temp }}/cherry-regression/agent-workspace
            ${{ runner.temp }}/cherry-regression/fixtures
            ${{ runner.temp }}/cherry-regression/release/installation.json
