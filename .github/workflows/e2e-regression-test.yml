name: E2E Regression Test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch in this repository or a v* release tag to test"
        required: true
        default: "main"
        type: string
      task:
        description: "Test task (all = full regression)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - startup-smoke
          - mini-app
          - notes
          - settings
          - assistants
          - error-recovery
          - chat-core
          - translation
          - system-integration
          - knowledge
          - mcp-skills
          - code-tools
          - paintings
          - agents
          - topics
          - files
          - data-backup
          - browser
          - mini-app-smoke
          - notes-smoke
          - mini-app-pinning
          - custom-provider-chat
          - provider-model-scroll
          - custom-assistant
          - chat-stream-failure
          - clear-chat-messages
          - chat-error-recovery
          - translation-smoke
          - quick-assistant
          - knowledge-smoke
          - everything-mcp
          - skill-import
          - code-cli
          - openclaw
          - code-cli-permissions
          - cherryin-chat
          - image-generation
          - agent-basic-task
          - claude-agent-runtime
          - pi-runtime
          - translation-settings
          - native-settings
      provider_mode:
        description: "Provider backend: real = repository vars (default), mock = in-job mock service (deterministic, no quota, fault injection). Mock supports a subset of tasks; see scripts/e2e/regression/mock-fixtures/README.md"
        required: true
        default: "real"
        type: choice
        options:
          - real
          - mock

permissions:
  contents: read

concurrency:
  group: cherry-regression-test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.ref.outputs.mode }}
      name: ${{ steps.ref.outputs.name }}
      ref: ${{ steps.ref.outputs.ref }}
      sha: ${{ steps.ref.outputs.sha }}
      task: ${{ steps.ref.outputs.task }}
    steps:
      - name: Checkout workflow controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install controller dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            [[ "$attempt" == "3" ]] && exit 1
            sleep $((attempt * 15))
          done

      - name: Resolve and validate test reference
        id: ref
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          REQUESTED_TASK: ${{ inputs.task }}
        run: |
          pnpm exec tsx scripts/e2e/regression/cli.ts resolve-ref \
            --requested "$REQUESTED_REF" \
            --repository "${{ github.repository }}"
          echo "task=$REQUESTED_TASK" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-latest
            platform: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      TARGET_DIR: ${{ github.workspace }}/target-app
      MCP_TIMEOUT: "30000"
      MCP_TOOL_TIMEOUT: "240000"
    steps:
      - name: Checkout workflow controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout application under test
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          path: target-app
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Export pinned Node.js version
        shell: bash
        run: echo "NODE_VERSION=$(node -p 'process.versions.node')" >> "$GITHUB_ENV"

      - name: Install controller dependencies
        id: controller-dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            [[ "$attempt" == "3" ]] && exit 1
            sleep $((attempt * 15))
          done

      - name: Define isolated test directory
        shell: bash
        run: |
          echo "RUN_DIR=$RUNNER_TEMP/cherry-regression" >> "$GITHUB_ENV"
          echo "CHERRY_TEST_RUN_DIR=$RUNNER_TEMP/cherry-regression" >> "$GITHUB_ENV"

      - name: Initialize isolated test directory
        shell: bash
        env:
          TEST_MODE: ${{ needs.resolve.outputs.mode }}
          TEST_REF_NAME: ${{ needs.resolve.outputs.name }}
          TEST_SHA: ${{ needs.resolve.outputs.sha }}
          TEST_RUNNER: ${{ matrix.runner }}
          TEST_TASK: ${{ needs.resolve.outputs.task }}
        run: >-
          pnpm exec tsx scripts/e2e/regression/cli.ts initialize
          --run-dir "$RUN_DIR"
          --mode "$TEST_MODE"
          --platform "${{ matrix.platform }}"
          --ref "$TEST_REF_NAME"
          --sha "$TEST_SHA"
          --runner "$TEST_RUNNER"
          --task "$TEST_TASK"
          --provider-mode "${{ inputs.provider_mode }}"

      - name: Start disposable macOS permission observer
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          umask 077
          mkdir -p "$RUN_DIR/state"
          nohup osascript -l JavaScript scripts/e2e/regression/macPermissionObserver.jxa "$RUN_DIR" > "$RUN_DIR/logs/ci-native-permissions.log" 2>&1 < /dev/null &
          echo "$!" > "$RUN_DIR/state/ci-native-permissions.pid"
          sleep 1
          kill -0 "$(cat "$RUN_DIR/state/ci-native-permissions.pid")"

      - name: Validate native controller adapters
        shell: bash
        run: >-
          pnpm test:scripts
          scripts/e2e/regression/__tests__/externalAppSyntax.test.ts
          scripts/e2e/regression/__tests__/nativeAdapters.test.ts
          --reporter=default -t 'completes the real macos file dialog' --reporter=json
          --outputFile.json="$RUN_DIR/report/native-controller-results.json"

      - name: Upload platform report and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ matrix.platform }}
          overwrite: true
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/cherry-regression/report
            ${{ runner.temp }}/cherry-regression/evidence
            ${{ runner.temp }}/cherry-regression/agent-workspace
            ${{ runner.temp }}/cherry-regression/fixtures
            ${{ runner.temp }}/cherry-regression/release/installation.json

