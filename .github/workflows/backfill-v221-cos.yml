name: Backfill v2.2.1 release files to COS
on:
  push:
    branches: [codex/backfill-v221-cos]
    paths:
      - .github/workflows/backfill-v221-cos.yml
      - scripts/release/backfill-v221-cos.py
permissions:
  contents: read
  actions: read
concurrency:
  group: backfill-v221-cos
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install cos-python-sdk-v5==1.9.44
      - name: Upload existing v2.2.1 release files individually
        env:
          GH_TOKEN: ${{ github.token }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: python -u scripts/release/backfill-v221-cos.py
