name: Backfill v2.2.1 through Shanghai SCF
on:
  push:
    branches: [codex/gitcode-sync-via-scf]
    paths: [.github/workflows/backfill-v221-via-scf.yml]
permissions:
  actions: read
  contents: read
concurrency:
  group: gitcode-sync-v2.2.1
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: CherryHQ/cherry-studio
      TAG: v2.2.1
      SOURCE_RUN_ID: "43229565814"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install cos-python-sdk-v5==1.9.44 tencentcloud-sdk-python-scf==3.1.100
      - name: Verify original release publication
        run: |
          gh api --paginate "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/jobs?filter=all&per_page=100" |
            jq -es 'any(.[].jobs[]; .name == "Publish approved release" and .conclusion == "success")' >/dev/null
      - name: Read complete COS inventory
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: python scripts/release/release-cos.py prepare-sync
      - name: Sync both editions through SCF
        env:
          RELEASE_FROM_COS: "true"
          RELEASE_VIA_SCF: "true"
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_OWNER: ${{ vars.GITCODE_OWNER }}
          GITCODE_REPO: ${{ vars.GITCODE_REPO }}
          GITCODE_API_URL: ${{ vars.GITCODE_API_URL }}
        run: bash scripts/release/sync-gitcode.sh
