  "@deepseek-ai/dsh-sandbox-local@0.2.0-rc.2": patches/@deepseek-ai__dsh-sandbox-local@0.2.0-rc.2.patch
  "@deepseek-ai/dsh-subprocess-local@0.2.0-rc.2": patches/@deepseek-ai__dsh-subprocess-local@0.2.0-rc.2.patch
  # Forward transient assistant chunks on the SDK pipe, ordered with durable session events.
  "@deepseek-ai/dsh-sdk-jsonrpc-server@0.2.0-rc.2": patches/@deepseek-ai__dsh-sdk-jsonrpc-server@0.2.0-rc.2.patch
  "@napi-rs/system-ocr@1.2.0": patches/@napi-rs__system-ocr@1.2.0.patch
  "tesseract.js@6.0.1": patches/tesseract.js-npm-6.0.1-2562a7e46d.patch
  "electron-updater@6.7.0": patches/electron-updater-npm-6.7.0-47b11bb0d4.patch
  "atomically@1.7.0": patches/atomically-npm-1.7.0-e742e5293b.patch
  "file-stream-rotator@0.6.1": patches/file-stream-rotator-npm-0.6.1-eab45fb13d.patch
  "ollama-ai-provider-v2@3.3.1": patches/ollama-ai-provider-v2@3.3.1.patch
  "@opeoginni/github-copilot-openai-compatible@1.0.0": patches/@opeoginni__github-copilot-openai-compatible@1.0.0.patch
  "@ai-sdk/openai@3.0.109": patches/@ai-sdk__openai@3.0.109.patch
  "@ai-sdk/google@3.0.113": patches/@ai-sdk__google@3.0.113.patch
  "@ai-sdk/anthropic": patches/@ai-sdk__anthropic.patch
  "@tiptap/extension-drag-handle@3.26.1": patches/@tiptap__extension-drag-handle@3.26.1.patch
  "@tiptap/markdown@3.26.1": patches/@tiptap__markdown@3.26.1.patch
  "@openrouter/ai-sdk-provider@2.10.0": patches/@openrouter__ai-sdk-provider@2.10.0.patch
  onnxruntime-node@1.25.1: patches/onnxruntime-node@1.25.1.patch
  emoji-picker-react@4.19.1: patches/emoji-picker-react@4.19.1.patch
  "@ai-sdk/openai-compatible@2.0.72": patches/@ai-sdk__openai-compatible@2.0.72.patch
  "@ai-sdk/open-responses@1.0.34": patches/@ai-sdk__open-responses@1.0.34.patch
  ai@6.0.185: patches/ai@6.0.185.patch
  ppu-paddle-ocr@6.0.0: patches/ppu-paddle-ocr@6.0.0.patch
  "@ai-sdk/react@3.0.187": patches/@ai-sdk__react@3.0.187.patch
  "@streamdown/code@1.1.1": patches/@streamdown__code@1.1.1.patch
  # Version-pinned: hunk targets a content-hashed dist chunk; bumps hard-fail install until key+hunk are re-derived.
  streamdown@2.5.0: patches/streamdown@2.5.0.patch
  app-builder-lib@26.15.6: patches/app-builder-lib@26.15.6.patch
  # Preserve main's ultra reasoning support until the adapter accepts that level upstream.
  "@deepseek-ai/dsh-llm-pi-ai@0.2.0-rc.2": patches/@deepseek-ai__dsh-llm-pi-ai@0.2.0-rc.2.patch
  "@earendil-works/pi-ai@0.87.1": patches/@earendil-works__pi-ai@0.87.1.patch
  "@earendil-works/pi-ai@1.0.0": patches/@earendil-works__pi-ai@1.0.0.patch
  # #20329: preserve current animation targets when React Activity reconnects.
  # Remove when an upstream release includes the blocked-initial-animation remount fix.
  motion-dom@12.42.0: patches/motion-dom@12.42.0.patch
  "@tiptap/extension-list@3.26.1": patches/@tiptap__extension-list@3.26.1.patch
  "@deepseek-ai/dsh-sdk-client@0.2.0-rc.2": patches/@deepseek-ai__dsh-sdk-client@0.2.0-rc.2.patch
  docx-preview@0.3.7: patches/docx-preview@0.3.7.patch
  "@elysia/node@1.4.6": patches/@elysia__node@1.4.6.patch
  bonjour-service@1.3.0: patches/bonjour-service@1.3.0.patch
  "@sting8k/pi-vcc@0.8.1": patches/@sting8k__pi-vcc@0.8.1.patch

allowBuilds:
  "@deepseek-ai/dsh-subprocess-local": true
  "@google/genai": false
  "@j178/prek": true
  "@paymoapp/electron-shutdown-handler": true
  "@scarf/scarf": true
  "@sentry/cli": true
  "@swc/core": true
  better-sqlite3: true
  canvas: false
  core-js: true
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  msw: true
  node-mac-permissions: true
  node-pty: true
  onnxruntime-node: true
  protobufjs: true
  registry-js: true
  selection-hook: true
  sharp: true
  tesseract.js: true
  unrs-resolver: true
  zipfile: true

# Every platform builds both arches (`electron-builder --x64 --arm64`), so both prebuilt
# sets must be installed up front: pnpm does not record supportedArchitectures in the
# node_modules state, so changing it after the first install is a silent no-op.
supportedArchitectures:
  os:
    - current
  cpu:
    - x64
    - arm64

